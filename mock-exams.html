"e":"先行詞 The girl 與 hair 是所有關係，用 whose。"},{"n":6,"q":"Neither Tom nor his parents _____ at home now.","o":["be","is","are","was"],"a":"C","e":"Neither...nor 的動詞和靠近它的主詞一致，parents 是複數，現在式用 are。"},{"n":7,"q":"A: Have you ever been to Tainan? B: Yes. I _____ there last summer.","o":["have been","went","have gone","go"],"a":"B","e":"last summer 是明確的過去時間，不能與完成式連用，要用過去式 went。"},{"n":8,"q":"Linda is _____ of all the girls in her class.","o":["tall","more tall","the tallest","taller"],"a":"C","e":"在全班女生中比較，用 the tallest。"},{"n":9,"q":"If it _____ tomorrow, we will stay at home.","o":["rains","rained","is raining","will rain"],"a":"A","e":"if 條件子句表示未來時，動詞用現在式 rains。"},{"n":10,"q":"It was kind _____ you to help me move the boxes.","o":["at","to","of","for"],"a":"C","e":"It is + 表示人品德的形容詞 + of + 人 + to V。"},{"n":11,"q":"This isn't my pen. Mine _____ on the desk.","o":["were","be","is","are"],"a":"C","e":"Mine 代表 my pen，是單數，現在式用 is。"},{"n":12,"q":"The students were told _____ quiet during the test.","o":["to keep","keeps","keep","keeping"],"a":"A","e":"be told to V，被告知要做某事。"},{"n":13,"q":"This soup is _____ hot to drink. Please wait for a few minutes.","o":["enough","so","very","too"],"a":"D","e":"too + 形容詞 + to V，表示「太……而不能……」。"},{"n":14,"q":"How _____ has your sister been in Japan?","o":["often","much","many","long"],"a":"D","e":"問時間長度，用 How long。"},{"n":15,"q":"You didn't bring your umbrella, _____?","o":["do you","will you","did you","didn't you"],"a":"C","e":"前面是否定句，附加問句用肯定形式；過去式用 did you。"},{"n":16,"q":"The boy broke the vase _____ he was playing basketball in the house.","o":["so","or","but","while"],"a":"D","e":"打球的同時打破花瓶，表示同時發生的兩動作，用 while。"},{"n":17,"q":"Be careful! The floor is wet. You may _____.","o":["falls","falling","fell","fall"],"a":"D","e":"may 後面接原形動詞 fall。"},{"n":18,"q":"The story _____ I read last night was about a brave dog.","o":["who","which","what","whose"],"a":"B","e":"先行詞是物 The story，作 read 的受詞，用 which。"},{"n":19,"q":"A notice at a pool says: \"Children under 120 cm must be with an adult.\" Tim is 110 cm tall. What must he do?","o":["Buy a ticket.","Wait until he is older.","Swim alone.","Go with an adult."],"a":"D","e":"低於 120 公分的孩子必須有大人陪同，Tim 才 110 公分。"}],"groups":[{"from":20,"to":22,"type":"海報","title":"Night Market Photo Contest","text":"Night Market Photo Contest\nDo you love taking pictures? Show us the night market you know!\nRules:\n1. Each person can send in two photos.\n2. Photos must be taken in our city.\n3. Send your photos to nightphoto@mail.com by Sunday, April 30.\nPrizes:\nFirst prize: $5,000\nSecond prize: $3,000\nThird prize: $1,000\nThe winners will be shown on our website on May 10.","qs":[{"n":20,"q":"What do people have to do to join the contest?","o":["Send in photos by April 30.","Visit the website.","Take photos of food.","Pay $1,000."],"a":"A","e":"規則要求在 4 月 30 日前寄出照片。"},{"n":21,"q":"Which of the following is true?","o":["Photos can be taken anywhere.","The first prize is $3,000.","Each person can send three photos.","The winners will be shown online."],"a":"D","e":"得獎者會在網站上公布。"},{"n":22,"q":"When can people know who the winners are?","o":["On May 10.","After June.","On April 30.","On May 1."],"a":"A","e":"5 月 10 日得獎者會顯示在網站上。"}]},{"from":23,"to":24,"type":"短文","title":"Zoe's Garden","text":"Zoe lives in a small apartment, but she has a \"garden\" on the balcony. She grows tomatoes, mint, and a few flowers in old milk bottles. Every morning, she gets up early to give them water. Last month, she found small green tomatoes on the plants, and she was so happy that she took many pictures. Two weeks later, the tomatoes turned red. She used them to make a salad for her family. Her mother said it was the best salad she had ever eaten.","qs":[{"n":23,"q":"Where is Zoe's garden?","o":["On the balcony.","In front of the building.","In a park.","On the roof."],"a":"A","e":"她的花園在陽台上。"},{"n":24,"q":"What did Zoe do with the red tomatoes?","o":["She took pictures of them.","She gave them to neighbors.","She made a salad.","She sold them."],"a":"C","e":"番茄變紅後，她用來做了沙拉。"}]},{"from":25,"to":27,"type":"對話","title":"Choosing a Gift","text":"Wendy: Mom's birthday is next week. Have you thought about what to buy?\nTed: Not yet. Maybe flowers?\nWendy: She received a lot of flowers last year. Why don't we buy her a scarf? Winter is coming.\nTed: Good idea. But I don't know which color she likes.\nWendy: She often wears red or white, so I think a white scarf will be good.\nTed: OK. Where can we get one?\nWendy: There's a department store near the MRT station. It's having a big sale this week.\nTed: Great. Let's go this Saturday.","qs":[{"n":25,"q":"What does Wendy suggest buying?","o":["A hat.","Some flowers.","A cake.","A scarf."],"a":"D","e":"Wendy 建議買圍巾，因為冬天快到了。"},{"n":26,"q":"Why doesn't Wendy want to buy flowers?","o":["Ted bought some already.","Mom got many flowers last year.","Mom is allergic to flowers.","They are too expensive."],"a":"B","e":"媽媽去年已經收到很多花了。"},{"n":27,"q":"When will they go shopping?","o":["On Mom's birthday.","Next week.","Tonight.","On Saturday."],"a":"D","e":"Ted 說這個星期六去。"}]},{"from":28,"to":29,"type":"電子郵件","title":"Class Party","text":"To: All students in Class 8-3\nFrom: Ms. Liu\nSubject: End-of-year party\nDear students,\nOur end-of-year party will be held in our classroom on Friday, January 12, from 1:00 p.m. to 3:00 p.m. Everyone has to bring one dish to share. Please tell me what you are going to bring by Tuesday, so that we will not have the same food. Ann and Ryan have agreed to decorate the room, and Jason will bring the music. If you want to help, please let me know. I'm sure it will be a great party!\nMs. Liu","qs":[{"n":28,"q":"What does Ms. Liu want students to do by Tuesday?","o":["Pay some money for the party.","Tell her what food they will bring.","Bring the music.","Decorate the classroom."],"a":"B","e":"星期二前要告訴老師各自會帶什麼菜，避免重複。"},{"n":29,"q":"Who will bring the music?","o":["Ms. Liu.","Jason.","Ryan.","Ann."],"a":"B","e":"信中說 Jason 會帶音樂。"}]},{"from":30,"to":32,"type":"價目表","title":"Rental Bikes","text":"Green Wheels Bike Rental\nRegular bike: $50 for 1 hour, $150 for half a day (4 hours), $250 for a whole day\nElectric bike: $100 for 1 hour, $300 for half a day, $500 for a whole day\nHelmet: free\nChild seat: $30 per day\nOpen every day from 8:00 a.m. to 6:00 p.m.\nBikes must be returned before 6:00 p.m.","qs":[{"n":30,"q":"Jill wants a regular bike for five hours. What is the cheapest way?","o":["Rent it for half a day and one more hour.","Rent it for two half days.","Rent it for a whole day.","Rent it for five hours."],"a":"A","e":"半天 $150 加一小時 $50 共 $200，比一整天 $250 便宜，也比五小時 $250 便宜。"},{"n":31,"q":"How much does an electric bike cost for half a day?","o":["$100","$200","$300","$500"],"a":"C","e":"電動車半天是 $300。"},{"n":32,"q":"Which is true?","o":["Bikes can be returned the next day.","People have to pay for helmets.","The shop opens at 6 p.m.","Child seats cost $30 a day."],"a":"D","e":"兒童座椅一天 $30。"}]},{"from":33,"to":34,"type":"公告","title":"School Library","text":"Notice to all students\nStarting next week, the school library will be open until 6:00 p.m. on weekdays. In the past, it closed at 4:30 p.m. We made this change because many students said they needed more time to study after school. Students who stay late must sign their names at the door. Please remember to keep the library clean and quiet. Thank you for your cooperation.\nPrincipal Huang","qs":[{"n":33,"q":"Why did the school change the library hours?","o":["There are too many books.","The teachers wanted to go home early.","Some students wanted more study time.","The library needs cleaning."],"a":"C","e":"許多學生表示放學後需要更多時間念書。"},{"n":34,"q":"What must students do if they stay late?","o":["Sign their names.","Ask the principal.","Pay for the lights.","Bring their own books."],"a":"A","e":"晚留的學生要在門口簽名。"}]},{"from":35,"to":37,"type":"短文","title":"The Honest Boy","text":"Ken found a wallet on the street on his way home. There was a lot of money in it, and he was tempted to keep it. He had wanted to buy a new pair of shoes for a long time, but his family didn't have much money. He thought for a while and then took the wallet to the police station. The next day, the owner, an old man, came to Ken's house to thank him. He wanted to give Ken some money, but Ken said no. \"I only did what I should do,\" he said. The old man was moved and told Ken's story to the newspaper. Soon, many people knew about Ken's kindness.","qs":[{"n":35,"q":"Why was Ken tempted to keep the wallet?","o":["His family didn't have much money.","He didn't have a wallet.","The wallet was very nice.","He wanted to buy a gift for the old man."],"a":"A","e":"他很想買新鞋，但家裡沒什麼錢。"},{"n":36,"q":"What did Ken do with the wallet?","o":["He took it to the police station.","He took it to the newspaper.","He gave it to a friend.","He kept it."],"a":"A","e":"他把皮夾送到警察局。"},{"n":37,"q":"What did the old man do after he met Ken?","o":["He gave Ken some shoes.","He took Ken to dinner.","He told Ken's story to the newspaper.","He sent Ken a letter."],"a":"C","e":"老人很感動，把肯的故事告訴了報社。"}]},{"from":38,"to":43,"type":"填空","title":"The Smart Watch","text":"My father gave me a smart watch for my birthday. It can tell me the time, and it can also __38__ how many steps I take every day. At first, I thought it was just a toy, but now I use it all the time. The watch is __39__ by a small battery, so I have to charge it every night. Last week, I forgot __40__ it, and the watch stopped working at school. My classmates laughed at me. Since then, I __41__ it every night before I go to bed. My father is always telling me that I should be __42__ with my things. I think he is right, so I am trying to be more __43__.","qs":[{"n":38,"q":"","o":["counting","counted","counts","count"],"a":"D","e":"can 後面接原形動詞 count。"},{"n":39,"q":"","o":["powering","powered","powers","power"],"a":"B","e":"手錶是由電池供電，用被動語態 is powered by。"},{"n":40,"q":"","o":["charged","charge","charging","to charge"],"a":"D","e":"forget to V 表示忘記去做某事。"},{"n":41,"q":"","o":["charge","charged","have charged","am charging"],"a":"C","e":"Since then 搭配現在完成式 have charged。"},{"n":42,"q":"","o":["carelessly","careful","carefully","care"],"a":"B","e":"be 動詞後面接形容詞 careful。"},{"n":43,"q":"","o":["responsibly","responsible","respond","responsibility"],"a":"B","e":"more 後面接形容詞 responsible。"}]}]},{"n":9,"kind":"分冊複習・第1～5冊","scope":"第1～5冊綜合：各種時態、被動語態、關係代名詞、分詞作形容詞、副詞子句（although／unless／so...that／as soon as）、假設語氣、使役動詞、too...to／enough to、感嘆句","singles":[{"n":1,"q":"The news about the accident was really _____. Everyone felt sad.","o":["shocks","shocking","shock","shocked"],"a":"B","e":"主詞是事物（news），表示「令人震驚的」，用現在分詞形容詞 shocking。"},{"n":2,"q":"I was so _____ in the book that I forgot to eat lunch.","o":["interested","interest","interests","interesting"],"a":"A","e":"主詞是人，表示「感興趣的」，用過去分詞 interested；be interested in。"},{"n":3,"q":"If I _____ you, I would tell the teacher the truth.","o":["were","am","will be","was"],"a":"A","e":"與現在事實相反的假設，if 子句 be 動詞一律用 were。"},{"n":4,"q":"Although it rained heavily, the game _____.","o":["is cancelled","was cancelled","cancelled","wasn't cancelled"],"a":"D","e":"Although 表示讓步，語意為「雖然下大雨，比賽卻沒有被取消」，且過去被動否定用 wasn't cancelled。"},{"n":5,"q":"My mother let me _____ out with my friends on Saturday night.","o":["go","to go","going","went"],"a":"A","e":"let + 受詞 + 原形動詞。"},{"n":6,"q":"What a beautiful day _____!","o":["that is","it is","is","are"],"a":"B","e":"感嘆句 What + a + 形容詞 + 名詞 + 主詞 + 動詞，這裡 it is。"},{"n":7,"q":"You won't pass the test _____ you study harder.","o":["when","if","unless","because"],"a":"C","e":"unless 等於 if...not，表示「除非」。"},{"n":8,"q":"This box is _____ heavy for me to carry.","o":["so","too","enough","very"],"a":"B","e":"too + 形容詞 + to V，太重而搬不動。"},{"n":9,"q":"As soon as she _____ home, she turned on the TV.","o":["gets","will get","got","has gotten"],"a":"C","e":"兩個動作都發生在過去，turned 是過去式，所以 as soon as 子句也用過去式。"},{"n":10,"q":"The boy _____ under the tree is my cousin.","o":["slept","sleep","sleeps","sleeping"],"a":"D","e":"現在分詞片語後置修飾名詞，表示「正在樹下睡覺的男孩」。"},{"n":11,"q":"He was so excited _____ he couldn't sleep.","o":["what","because","which","that"],"a":"D","e":"so + 形容詞 + that 子句。"},{"n":12,"q":"Mr. Lee made his son _____ the room before going out.","o":["cleans","clean","cleaning","cleaned"],"a":"B","e":"make + 受詞 + 原形動詞。"},{"n":13,"q":"The man _____ you met yesterday is our new principal.","o":["what","whose","whom","which"],"a":"C","e":"先行詞是人，作 met 的受詞，用 whom。"},{"n":14,"q":"The letter _____ in English was sent to me yesterday.","o":["writing","wrote","write","written"],"a":"D","e":"過去分詞後置修飾名詞，表示「被寫成英文的信」。"},{"n":15,"q":"I wish I _____ a bird. Then I could fly anywhere.","o":["were","will be","was","am"],"a":"A","e":"wish 後面接與現在事實相反的願望，be 動詞用 were。"},{"n":16,"q":"He is old enough _____ a car.","o":["drives","drive","driving","to drive"],"a":"D","e":"形容詞 + enough + to V。"},{"n":17,"q":"A: How _____ do you go to the gym? B: Three times a week.","o":["often","soon","long","much"],"a":"A","e":"回答次數 three times a week，問頻率用 How often。"},{"n":18,"q":"The teacher asked us _____ talk in class.","o":["not","not for","don't","not to"],"a":"D","e":"ask + 人 + not to V。"},{"n":19,"q":"A sign on the door says: \"Staff Only.\" Who can go in?","o":["Anyone.","Only customers.","Only the workers.","Only children."],"a":"C","e":"Staff Only 表示只有員工可以進入。"}],"groups":[{"from":20,"to":22,"type":"廣告","title":"Language Exchange","text":"Language Exchange Club\nWant to learn English or Chinese? Come and make friends!\nWe meet every Thursday at 7:00 p.m. at the Sunny Coffee Shop.\nHow it works:\n- First hour: we speak English.\n- Second hour: we speak Chinese.\nEveryone is welcome! You don't need to pay for the club, but please buy your own drink.\nThis month's topic: Traveling around the world. Share your best trip with us!\nFor more details, send an e-mail to club@mail.com.","qs":[{"n":20,"q":"How long does each meeting last?","o":["Three hours.","All night.","Two hours.","One hour."],"a":"C","e":"第一小時說英文，第二小時說中文，共兩小時。"},{"n":21,"q":"What do members have to pay for?","o":["A trip.","Their own drinks.","The club fee.","The coffee shop."],"a":"B","e":"聚會免費，但要自己買飲料。"},{"n":22,"q":"What will members talk about this month?","o":["Their best trip.","Their favorite food.","Their jobs.","Their school life."],"a":"A","e":"這個月的主題是旅行，分享最棒的旅行。"}]},{"from":23,"to":24,"type":"短文","title":"Bird Feeder","text":"Last winter, my grandfather put a bird feeder in our garden. At first, no birds came. He was surprised, but he didn't give up. He moved the feeder to a different place near a tree and added some seeds. Two days later, a small brown bird came. Soon more birds arrived. Now we can watch them every morning. My grandfather says that being patient is important. If you wait long enough, good things will come.","qs":[{"n":23,"q":"What did Grandfather do when no birds came?","o":["He took the feeder away.","He bought a bigger feeder.","He asked the neighbors for help.","He put it in a different place."],"a":"D","e":"他把餵食器移到樹旁邊另一個位置。"},{"n":24,"q":"What does Grandfather mean?","o":["Good things come to those who wait.","Winter is the best time to feed birds.","It is easy to feed birds.","Birds are afraid of people."],"a":"A","e":"他說有耐心很重要，等得夠久好事就會來。"}]},{"from":25,"to":27,"type":"對話","title":"A Part-time Job","text":"Mia: Hi, Dan. You look tired today.\nDan: I am. I started working at a restaurant last week, and I have to wash dishes until ten every night.\nMia: Wow! Why do you want to work?\nDan: I'm saving money to buy a camera. I've wanted one for a year, but it costs $15,000.\nMia: That's a lot. How much have you saved so far?\nDan: About $6,000. If I keep working, I will have enough by the end of the summer.\nMia: Good for you. But don't forget to get some rest. If you get sick, you won't be able to work.\nDan: You're right. I'll go to bed earlier from now on.","qs":[{"n":25,"q":"Why does Dan work at the restaurant?","o":["He wants to buy a camera.","He wants to learn cooking.","He wants to save his father's money.","He wants to make friends."],"a":"A","e":"他想存錢買相機。"},{"n":26,"q":"How much does Dan still need to save?","o":["$6,000","$9,000","$15,000","$21,000"],"a":"B","e":"相機 $15,000，已存 $6,000，還差 $9,000。"},{"n":27,"q":"What does Mia advise Dan to do?","o":["Find another job.","Work harder.","Buy a cheaper camera.","Get some rest."],"a":"D","e":"Mia 提醒他不要忘了休息。"}]},{"from":28,"to":29,"type":"電子郵件","title":"Roommate Wanted","text":"To: Class 9-2\nFrom: Mr. Chen\nSubject: Exchange Student\nDear students,\nWe are going to have a new exchange student from Canada next month. His name is Noah, and he will stay with us for one year. He doesn't speak much Chinese, so I hope you can help him get used to our school life. If you know any family who would like to host him, please let me know by the end of this week. The host family will receive $5,000 a month from the school.\nThank you!\nMr. Chen","qs":[{"n":28,"q":"What does Mr. Chen ask the students to do?","o":["Invite Noah to a party.","Help Noah get used to school life.","Take Noah to Canada.","Teach Noah Chinese for free."],"a":"B","e":"他希望同學幫助 Noah 適應學校生活。"},{"n":29,"q":"What should students do by the end of this week?","o":["Learn some English.","Tell Mr. Chen if they know a host family.","Pay $5,000 to the school.","Write a letter to Noah."],"a":"B","e":"本週末前要告訴老師有沒有認識願意接待的家庭。"}]},{"from":30,"to":32,"type":"節目表","title":"Radio Schedule","text":"FM 98.5 Weekend Programs\nSaturday\n8:00 - 10:00 Morning Music\n10:00 - 11:00 Health Talk\n2:00 - 4:00 Movie World\nSunday\n8:00 - 9:00 English Lesson\n9:00 - 11:00 Travel Stories\n3:00 - 5:00 Classic Songs","qs":[{"n":30,"q":"How long is \"Health Talk\"?","o":["Three hours.","Two hours.","One hour.","Thirty minutes."],"a":"C","e":"Health Talk 從 10:00 到 11:00，共一小時。"},{"n":31,"q":"Peter wants to improve his English. Which program should he listen to?","o":["Travel Stories.","Movie World.","English Lesson.","Health Talk."],"a":"C","e":"English Lesson 是學習英文的節目。"},{"n":32,"q":"When can people listen to Travel Stories?","o":["Sunday at 3:00.","Saturday at 10:00.","Sunday at 9:00.","Saturday at 2:00."],"a":"C","e":"Travel Stories 在星期日 9:00 到 11:00。"}]},{"from":33,"to":34,"type":"公告","title":"Parking Notice","text":"Notice to all residents\nFrom next Monday, the parking lot behind Building B will be closed for two weeks because the ground needs fixing. During this time, please park your cars in the lot in front of Building A. It will be crowded, so we suggest that you take buses or ride bikes when possible. Anyone who parks in the wrong place may have to pay a $500 fine. We are sorry for the trouble.\nBuilding Management Office","qs":[{"n":33,"q":"Why will the parking lot be closed?","o":["It is going to be a garden.","There are too many cars.","The ground needs fixing.","A new building is coming."],"a":"C","e":"因為地面需要整修。"},{"n":34,"q":"What may happen if someone parks in the wrong place?","o":["Their cars will be sold.","They will have to pay a fine.","They will lose their room.","They will not see a notice."],"a":"B","e":"停錯位置可能被罰 $500。"}]},{"from":35,"to":37,"type":"短文","title":"Learning from Failure","text":"Thomas Edison is one of the most famous inventors in history. He invented the light bulb, but it didn't happen overnight. Before he made one that worked, he tried more than a thousand times. A reporter once asked him, \"How does it feel to fail so many times?\" Edison answered, \"I didn't fail. I just found a thousand ways that didn't work.\" This attitude helped him keep trying. Today, many people remember Edison not only because of his inventions but also because of his courage in the face of failure.","qs":[{"n":35,"q":"What is the passage mainly about?","o":["Who invented the telephone.","How Edison viewed failure.","Why reporters ask questions.","How the light bulb works."],"a":"B","e":"短文重點在說明愛迪生如何看待失敗。"},{"n":36,"q":"How many times did Edison try before he made a light bulb that worked?","o":["About one hundred.","More than one thousand.","About ten.","Only once."],"a":"B","e":"他試了超過一千次。"},{"n":37,"q":"Why do many people remember Edison?","o":["He was a famous reporter.","He was the richest man.","He wrote many books.","His inventions and courage."],"a":"D","e":"人們記得他是因為發明與面對失敗的勇氣。"}]},{"from":38,"to":43,"type":"填空","title":"Plastic Bags","text":"Many people use plastic bags every day, __38__ they don't think about the trouble they cause. Plastic bags are not easy to break down. It takes hundreds of years __39__ a plastic bag to disappear. Some animals eat plastic by mistake, and they __40__ sick or even die. If we don't do anything, the problem __41__ worse. That's __42__ more and more shops now ask customers to bring their own bags. If everyone __43__ a cloth bag, we can save a lot of plastic.","qs":[{"n":38,"q":"","o":["but","so","or","and"],"a":"A","e":"很多人天天使用塑膠袋，但沒想過帶來的麻煩，語意轉折，用 but。"},{"n":39,"q":"","o":["of","in","for","to"],"a":"C","e":"It takes + 時間 + for + 人事物 + to V，這裡 for a plastic bag to disappear。"},{"n":40,"q":"","o":["gets","got","get","getting"],"a":"C","e":"主詞 they 為複數，現在簡單式，get sick 表示生病。"},{"n":41,"q":"","o":["got","will get","getting","gets"],"a":"B","e":"這是 If 子句的主要子句，表示未來，用 will get worse。"},{"n":42,"q":"","o":["why","when","how","what"],"a":"A","e":"That's why + 結果，表示「這就是為什麼……」。"},{"n":43,"q":"","o":["used","use","using","uses"],"a":"D","e":"everyone 是第三人稱單數，if 條件子句用現在式 uses。"}]}]},{"n":10,"kind":"分冊複習・第5～6冊","scope":"分詞作形容詞、假設語氣、使役動詞、關係副詞（where／when）、複合關係代名詞 what、過去完成式、現在完成進行式、the more...the more...、名詞子句、分詞構句、感嘆句、so...that／such...that","singles":[{"n":1,"q":"By the time we got to the station, the train _____.","o":["has left","left","leaves","had left"],"a":"D","e":"到達車站之前火車就已離開，先發生的動作用過去完成式 had left。"},{"n":2,"q":"I have been _____ for you for two hours. Where were you?","o":["waited","wait","waits","waiting"],"a":"D","e":"現在完成進行式 have been + V-ing，強調動作從過去持續到現在。"},{"n":3,"q":"This is the house _____ my grandfather was born.","o":["who","what","which","where"],"a":"D","e":"先行詞是地點 the house，關係副詞用 where。"},{"n":4,"q":"_____ you need is a good rest. You have worked too hard.","o":["Which","What","That","Who"],"a":"B","e":"What you need 是名詞子句作主詞，相當於 the thing that you need。"},{"n":5,"q":"The more you practice, the _____ you will play.","o":["best","good","well","better"],"a":"D","e":"the + 比較級 ..., the + 比較級 ...，well 的比較級是 better。"},{"n":6,"q":"It was _____ a hot day that nobody wanted to go outside.","o":["too","very","so","such"],"a":"D","e":"such + a + 形容詞 + 名詞 + that，表示「如此……以至於……」。"},{"n":7,"q":"_____ the door, he found the room was empty.","o":["To open","Opened","Open","Opening"],"a":"D","e":"分詞構句，兩個動作由同一主詞完成，用現在分詞 Opening；即 When he opened the door。"},{"n":8,"q":"I don't know _____ the meeting will start.","o":["what","when","who","whose"],"a":"B","e":"間接問句詢問時間，meeting will start 缺少時間，用 when。"},{"n":9,"q":"If I had more time, I _____ travel around the world.","o":["would","can","am going to","will"],"a":"A","e":"與現在事實相反的假設，主要子句用 would + 原形動詞。"},{"n":10,"q":"Peter was the _____ student in the class who got full marks.","o":["lonely","only","one","alone"],"a":"B","e":"the only + 名詞，表示「唯一的」。"},{"n":11,"q":"I remember the day _____ we first met.","o":["which","when","what","where"],"a":"B","e":"先行詞是時間 the day，關係副詞用 when。"},{"n":12,"q":"Please wait here _____ I come back. I won't be long.","o":["unless","until","during","since"],"a":"B","e":"until 表示「直到……為止」，請在這裡等到我回來。"},{"n":13,"q":"How _____ the little girl is! Everyone loves her.","o":["cute","a cute","cuteness","cutely"],"a":"A","e":"感嘆句 How + 形容詞 + 主詞 + 動詞。"},{"n":14,"q":"Because of the heavy rain, the baseball game was _____.","o":["called in","called up","called off","called on"],"a":"C","e":"call off 表示取消。"},{"n":15,"q":"Tina asked me _____ I had finished the report.","o":["if","what","who","that"],"a":"A","e":"間接問句表示「是否」，用 if。"},{"n":16,"q":"I wish I _____ more money last year. I could have bought the bag.","o":["had had","had","have","would have"],"a":"A","e":"與過去事實相反的願望，wish 後面用過去完成式 had had。"},{"n":17,"q":"_____ by the news, the girl started to cry.","o":["Shocking","Shock","Shocked","To shock"],"a":"C","e":"分詞構句表示被動，女孩是被消息震驚，用過去分詞 Shocked。"},{"n":18,"q":"This book is worth _____. You will learn a lot from it.","o":["be read","read","reading","to read"],"a":"C","e":"be worth + V-ing，值得做某事。"},{"n":19,"q":"A sign in an elevator says: \"In case of fire, use the stairs.\" What should you do when there is a fire?","o":["Wait in the elevator.","Take the stairs.","Open the windows.","Use the elevator."],"a":"B","e":"發生火災時要走樓梯。"}],"groups":[{"from":20,"to":22,"type":"海報","title":"Green Living Fair","text":"Green Living Fair\nCome and see how small changes can make a big difference!\nDate: Saturday, October 14\nTime: 10:00 a.m. - 5:00 p.m.\nPlace: City Park\nActivities:\n- Learn to make bags out of old T-shirts (11:00 a.m. and 2:00 p.m.)\n- Free bike check (all day)\n- Talk: \"Eat Local, Save the Earth\" (3:30 p.m.)\nBring your own cup and get a free drink from our booth!\nEverything at the fair is free, but donations are welcome.","qs":[{"n":20,"q":"What can people do at 2:00 p.m.?","o":["Get a free drink.","Make bags from old T-shirts.","Check their bikes.","Listen to a talk."],"a":"B","e":"下午兩點有用舊 T 恤做袋子的活動。"},{"n":21,"q":"How can people get a free drink?","o":["By bringing their own cups.","By riding a bike.","By giving some money.","By joining the talk."],"a":"A","e":"自備杯子就能領到免費飲料。"},{"n":22,"q":"What is true about the fair?","o":["Most activities are free.","It lasts for two days.","People have to buy tickets.","It is held indoors."],"a":"A","e":"活動幾乎都免費，只歡迎捐款。"}]},{"from":23,"to":24,"type":"短文","title":"A Letter to Myself","text":"Last year, my English teacher asked us to write a letter to ourselves. We were going to open it one year later. At first, I thought it was silly. But when I opened the letter last week, I was moved. I wrote about my fears and dreams. I had wanted to join the school band, but I was afraid of playing in front of others. Now I am the drummer of the band! Reading the letter made me realize how much I have grown. I think I will write another one for next year.","qs":[{"n":23,"q":"When did the writer open the letter?","o":["Two years later.","A month later.","A week ago.","As soon as he wrote it."],"a":"C","e":"他上週打開了那封信，已是寫信一年後。"},{"n":24,"q":"What did the writer realize after reading the letter?","o":["He wrote too slowly.","He should stop playing in the band.","He had grown a lot.","He needed a new teacher."],"a":"C","e":"讀信讓他體認到自己成長了多少。"}]},{"from":25,"to":27,"type":"對話","title":"Talking about a Trip","text":"Ellie: How was your trip to Kyoto, Sam?\nSam: It was wonderful! I had always wanted to see the temples, and they were more beautiful than I had imagined.\nEllie: Did you try any local food?\nSam: Yes. We went to a small restaurant that was recommended by a friend. The tofu there was so delicious that I ate three bowls.\nEllie: Three bowls! What else did you do?\nSam: We rented kimonos and walked around the old streets. I took hundreds of photos.\nEllie: I'd love to see them. By the way, would you go again?\nSam: Definitely. If I had more vacation days, I would stay longer.","qs":[{"n":25,"q":"Why did Sam eat three bowls of tofu?","o":["It was so delicious.","His friend ordered it.","It was very cheap.","He was very hungry."],"a":"A","e":"他說豆腐好吃到吃了三碗。"},{"n":26,"q":"What did Sam do in the old streets?","o":["He ate out every night.","He rented a car.","He took the train.","He wore kimonos."],"a":"D","e":"他們租了和服在老街散步。"},{"n":27,"q":"What does Sam mean by \"If I had more vacation days, I would stay longer\"?","o":["He doesn't have enough vacation days.","He won't go back to Kyoto.","He has many vacation days.","He stayed for too long."],"a":"A","e":"假設語氣表示與事實相反，事實是假期不夠多。"}]},{"from":28,"to":29,"type":"電子郵件","title":"Job Application","text":"To: Ms. Wang\nFrom: Kevin Lin\nSubject: Application for the Summer Job\nDear Ms. Wang,\nI am writing to apply for the summer job at your bookstore. I am a high school student, and I have loved books since I was a child. I have been working part-time at the school library for a year, so I know how to organize books and help readers. I am also good at using computers. I can work from June to August, and I am available on weekends. I have attached my résumé. I look forward to hearing from you.\nYours sincerely,\nKevin Lin","qs":[{"n":28,"q":"Why does Kevin write to Ms. Wang?","o":["To apply for a job.","To ask about a library.","To invite her to school.","To buy some books."],"a":"A","e":"信的開頭就說明他想申請暑期工作。"},{"n":29,"q":"What experience does Kevin have?","o":["He has worked at a library for a year.","He has taught computers.","He has run a bookstore.","He has written a book."],"a":"A","e":"他已經在學校圖書館打工一年。"}]},{"from":30,"to":32,"type":"資訊表","title":"Museum Guide","text":"City Science Museum\nOpening hours: Tuesday - Sunday, 9:30 a.m. - 5:00 p.m. (Closed on Mondays)\nTickets: Adults $150, Students $100, Children under 6 free\nSpecial exhibition: \"Space Adventure\" (extra $50 per person)\nGuided tours: 10:30 a.m. and 2:30 p.m. (30 minutes, free)\nCameras are welcome, but flashes are not allowed.\nFood is not allowed in the exhibition rooms.","qs":[{"n":30,"q":"How much do two students pay to visit the museum and the special exhibition?","o":["$150","$200","$250","$300"],"a":"D","e":"每位學生 $100 加特展 $50，共 $150，兩人是 $300。"},{"n":31,"q":"What is true about the guided tours?","o":["They cost $50.","They are only for adults.","They start at 9:30.","They last half an hour."],"a":"D","e":"導覽時間是 30 分鐘，也就是半小時。"},{"n":32,"q":"Which is NOT allowed in the museum?","o":["Using flashes.","Taking a guided tour.","Visiting on Sundays.","Taking photos."],"a":"A","e":"館方歡迎相機，但不得使用閃光燈。"}]},{"from":33,"to":34,"type":"公告","title":"Volunteer Wanted","text":"Volunteers Wanted for Elderly Care\nEvery Saturday morning, the Sunshine Care Center invites young people to spend time with elderly people. You can play cards, read newspapers, or just talk with them. No special skills are needed. All you need is a warm heart and some patience. If you are interested, come to the center this Saturday at 9:00 a.m. for a short training. Every volunteer will receive a certificate after ten visits, which is useful for school applications.","qs":[{"n":33,"q":"What can volunteers do at the center?","o":["Give medical care.","Teach English.","Play cards with the elderly.","Cook meals."],"a":"C","e":"志工可以和長者玩牌、讀報或聊天。"},{"n":34,"q":"What will volunteers get after ten visits?","o":["A new card.","A certificate.","A free meal.","Some money."],"a":"B","e":"十次探訪後，志工會拿到證書。"}]},{"from":35,"to":37,"type":"短文","title":"The Little Library","text":"In some towns, you may see a small wooden box on the street. It looks like a mailbox, but it is full of books. It is called a \"Little Free Library.\" The idea is simple: take a book, and leave a book. People do not need to pay or sign anything. The first Little Free Library was built in the United States in 2009 by a man who wanted to honor his mother, a teacher who loved reading. Today, there are more than 100,000 such libraries around the world. Many people say that these boxes have brought neighbors closer, because strangers often leave notes inside the books.","qs":[{"n":35,"q":"What is a \"Little Free Library\"?","o":["A big building with many rooms.","A small box where people share books.","A shop selling books.","A mailbox for letters."],"a":"B","e":"它是街上讓人分享書籍的小木箱。"},{"n":36,"q":"Why did the man build the first one?","o":["To make money.","To honor his mother.","To sell books to the town.","To teach children to read."],"a":"B","e":"他想紀念熱愛閱讀的母親。"},{"n":37,"q":"What can we learn from the last sentence?","o":["Strangers dislike each other.","Books are too heavy to carry.","Little libraries help people connect.","Neighbors write to each other often."],"a":"C","e":"陌生人在書裡留言，使鄰居變得更親近。"}]},{"from":38,"to":43,"type":"填空","title":"A Special Teacher","text":"Mr. Hill is a teacher __38__ I will never forget. He has taught at our school for thirty years. When I was in Grade 7, I was a shy boy who __39__ speak in public. Mr. Hill noticed this and asked me __40__ a short talk in class. I was scared, but he said, \"You'll do fine.\" That day, I gave my first speech, and my classmates clapped. Mr. Hill taught me that __41__ we want to improve, we must try. Now I __42__ in the debate club for two years. I am thankful for all he has done __43__ me.","qs":[{"n":38,"q":"","o":["what","whose","which","who"],"a":"D","e":"先行詞是人 a teacher，關係代名詞用 who；whose 需接名詞，which 用於物，what 不能接先行詞。"},{"n":39,"q":"","o":["couldn't afford to","wasn't going to","isn't able to","didn't dare to"],"a":"D","e":"害羞的男孩「不敢」在公眾面前說話，用 didn't dare to。"},{"n":40,"q":"","o":["giving","give","to give","gave"],"a":"C","e":"ask + 人 + to V。"},{"n":41,"q":"","o":["although","if","unless","so"],"a":"B","e":"如果我們想進步，就必須嘗試，用 if 引導條件。"},{"n":42,"q":"","o":["was","am","have been","will be"],"a":"C","e":"for two years 表示持續到現在，用現在完成式 have been。"},{"n":43,"q":"","o":["with","to","at","for"],"a":"D","e":"do something for me，表示為我所做的事。"}]}]},{"n":11,"kind":"會考模擬（一）","scope":"第1～6冊全範圍：詞彙、文法、對話、圖表與短文閱讀、綜合測驗","singles":[{"n":1,"q":"My brother is a(n) _____ person. He always makes everyone laugh at parties.","o":["funny","shy","serious","lazy"],"a":"A","e":"他總是讓大家哈哈大笑，表示他是風趣的人。"},{"n":2,"q":"The test was so _____ that nobody could finish it on time.","o":["close","free","easy","long"],"a":"D","e":"考試太長，所以沒人能準時寫完。"},{"n":3,"q":"We should save water. Every _____ counts.","o":["mountain","drop","ground","step"],"a":"B","e":"每一滴水都很重要，drop 是「一滴」。"},{"n":4,"q":"A: Could you _____ me a favor? B: Sure. What is it?","o":["get","take","do","make"],"a":"C","e":"do someone a favor 表示「幫某人一個忙」。"},{"n":5,"q":"The weather forecast says it will be cloudy tomorrow, but the sun may _____ in the afternoon.","o":["turn out","give out","come out","go out"],"a":"C","e":"太陽出來用 come out。"},{"n":6,"q":"Sara _____ on the sofa when the doorbell rang.","o":["has slept","slept","was sleeping","is sleeping"],"a":"C","e":"門鈴響的時候她正在睡覺，用過去進行式。"},{"n":7,"q":"Jack is not only a good singer _____ a great dancer.","o":["or","but also","so","and"],"a":"B","e":"not only A but also B 表示「不但……而且……」。"},{"n":8,"q":"You'd better _____ more vegetables. They are good for your health.","o":["ate","to eat","eating","eat"],"a":"D","e":"had better 後面接原形動詞。"},{"n":9,"q":"This is the first time that I _____ a horse.","o":["rode","have ridden","am riding","ride"],"a":"B","e":"the first time that 子句要用現在完成式。"},{"n":10,"q":"A: Why don't we go hiking this Sunday? B: _____ I have to take care of my little brother.","o":["Sorry, I can't.","No problem.","That's a good idea.","I'd love to."],"a":"A","e":"後面說明要照顧弟弟，表示婉拒。"},{"n":11,"q":"The boy _____ is playing the guitar is my classmate.","o":["whose","whom","who","which"],"a":"C","e":"先行詞是人，作主詞，關係代名詞用 who。"},{"n":12,"q":"Mom wants me to stay at home _____ it is too dangerous to go out.","o":["because","but","although","unless"],"a":"A","e":"因為出門太危險，所以媽媽要我留在家，表示原因。"},{"n":13,"q":"The restaurant is famous _____ its delicious seafood.","o":["for","with","at","of"],"a":"A","e":"be famous for 表示「以……聞名」。"},{"n":14,"q":"Tom's room is _____ than mine, so he has more space.","o":["larger","large","more largely","largest"],"a":"A","e":"後面有 than，用比較級 larger。"},{"n":15,"q":"After the earthquake, many people were _____ and needed help.","o":["fair","proud","glad","hurt"],"a":"D","e":"地震後許多人受傷需要幫助。"},{"n":16,"q":"The singer was _____ by thousands of fans when she arrived at the airport.","o":["welcomed","welcomes","welcome","welcoming"],"a":"A","e":"歌手被歡迎，用被動語態 was welcomed。"},{"n":17,"q":"Don't be afraid of making mistakes. We _____ from them.","o":["spend","wait","borrow","learn"],"a":"D","e":"我們從錯誤中學習，learn from 表示「從……學到」。"},{"n":18,"q":"It's _____ of you to carry my heavy bag. Thank you very much.","o":["kindness","kinder","kind","kindly"],"a":"C","e":"It is kind of you to V 表示「你真好心」。"},{"n":19,"q":"A note on a refrigerator says: \"Please do not open the door too long.\" What does the note ask people to do?","o":["Close the door slowly.","Open the door as often as possible.","Open the door quickly.","Keep the door open."],"a":"C","e":"不要開門太久，意思是要快點開快點關。"}],"groups":[{"from":20,"to":22,"type":"海報","title":"Taipei Night Run","text":"Taipei Night Run\nRun for fun and run for health!\nDate: Saturday, November 25\nTime: 7:00 p.m. (Check in from 5:30 p.m.)\nPlace: Riverside Park\nChoose your route:\n- 3 km (for families and beginners): $300\n- 5 km: $400\n- 10 km: $500\nEvery runner will get a T-shirt and a medal. Children under 12 can join the 3 km run for free with an adult.\nSign up online before November 10. No sign-up on the day!","qs":[{"n":20,"q":"Who can join the 3 km run for free?","o":["All families.","Children under 12 with an adult.","People who sign up on the day.","Beginners."],"a":"B","e":"十二歲以下兒童在大人陪同下，可免費參加 3 公里。"},{"n":21,"q":"Mr. Lin and his 8-year-old son want to run 3 km, and his wife wants to run 5 km. How much do they pay?","o":["$400","$600","$700","$1,000"],"a":"C","e":"林先生 $300，兒子免費，太太 $400，共 $700。"},{"n":22,"q":"Which of the following is true?","o":["The 10 km run is free.","The race starts at 5:30 p.m.","All runners get a medal.","People can sign up at the park."],"a":"C","e":"每位跑者都會拿到 T 恤和獎牌。"}]},{"from":23,"to":24,"type":"短文","title":"The Last Sandwich","text":"Joe was walking home from school when he saw a thin dog near the market. The dog looked hungry and cold. Joe had a sandwich in his bag. It was the last one his mother had made for him, and he was hungry too. But he looked at the dog's eyes and knelt down. He broke the sandwich in half and gave one half to the dog. The dog ate it quickly and wagged its tail. Joe felt warm inside. The next day, he brought a bowl of food to the same place, but the dog was gone. He hoped that it had found a home.","qs":[{"n":23,"q":"Why did Joe give half of his sandwich to the dog?","o":["His mother told him to.","He wanted to keep the dog.","He felt sorry for the dog.","He was not hungry."],"a":"C","e":"看到狗又餓又冷，他心生同情，分一半給牠。"},{"n":24,"q":"What did Joe do the next day?","o":["He found the dog a home.","He brought food for the dog.","He made another sandwich.","He took the dog to the market."],"a":"B","e":"隔天他帶了一碗食物到同一個地方。"}]},{"from":25,"to":27,"type":"對話","title":"Choosing a Club","text":"Rita: Have you decided which club to join, Paul?\nPaul: Not yet. I like drawing, but my parents want me to join the science club.\nRita: Why do they want you to do that?\nPaul: They think science will be more useful for my future.\nRita: I see. But shouldn't you choose what you love?\nPaul: I think so, too. Still, I don't want to make them upset.\nRita: How about talking to them? Maybe they will understand if you show them your drawings.\nPaul: That's a good idea. I'll try it tonight.","qs":[{"n":25,"q":"What does Paul like?","o":["Sports.","Music.","Science.","Drawing."],"a":"D","e":"Paul 說他喜歡畫畫。"},{"n":26,"q":"Why do Paul's parents want him to join the science club?","o":["The club is free.","They are scientists.","They don't like drawing.","They think it is useful for his future."],"a":"D","e":"父母認為科學對他的未來比較有用。"},{"n":27,"q":"What will Paul probably do tonight?","o":["Talk to his parents.","Call Rita.","Join the science club.","Quit drawing."],"a":"A","e":"Paul 說今晚會試著跟父母談談，並讓他們看他的畫。"}]},{"from":28,"to":29,"type":"電子郵件","title":"Order Problem","text":"To: Customer Service\nFrom: Linda Tsai\nSubject: Problem with my order\nDear Sir or Madam,\nI ordered a blue backpack from your website on March 3. The order number is 8821. I received the package yesterday, but the backpack I got is black, not blue. Also, one of the zippers does not work well. I would like to exchange it for a blue one. Please tell me what I should do. I can send the black one back by post if you want. Thank you.\nLinda Tsai","qs":[{"n":28,"q":"Why did Linda write the e-mail?","o":["She wanted to cancel her order.","She wanted to buy a new backpack.","She wanted to thank the store.","She wanted to exchange a wrong product."],"a":"D","e":"她收到的背包顏色不對，想換成藍色的。"},{"n":29,"q":"What problems does Linda have with the backpack?","o":["It is too expensive.","It is the wrong color and has a bad zipper.","It is too small and old.","It came late and was dirty."],"a":"B","e":"背包是黑色的不是藍色，而且有一個拉鍊不好用。"}]},{"from":30,"to":32,"type":"價目表","title":"Phone Plans","text":"Phone Plans\nPlan A: $300 per month - 3 GB data, 100 minutes of calls\nPlan B: $500 per month - 10 GB data, 300 minutes of calls\nPlan C: $800 per month - unlimited data, unlimited calls\nStudents get 10% off any plan. Sign up for one year, and the first month is free.\nExtra data: $100 for each additional 1 GB.","qs":[{"n":30,"q":"Which plan has no limit on data?","o":["Plan A.","Plan B.","Plan C.","None of them."],"a":"C","e":"只有 Plan C 提供無限數據。"},{"n":31,"q":"A student chooses Plan B. How much does she pay per month?","o":["$400","$450","$480","$500"],"a":"B","e":"學生享九折，$500 的 90% 是 $450。"},{"n":32,"q":"Tim uses 12 GB of data a month with Plan B. How much extra does he need to pay?","o":["$100","$200","$300","$400"],"a":"B","e":"超出 2 GB，每 GB $100，共 $200。"}]},{"from":33,"to":34,"type":"公告","title":"Online Class","text":"Notice to all parents\nBecause of the typhoon, our school will have online classes on Tuesday, September 12. Students should log in at 8:30 a.m. using the school's website. Please make sure your child has a quiet place and a working computer. If you have any problems, please call the computer teacher, Mr. Ho, at 2233-4455. Classes will end at 2:00 p.m. A teacher will check every student's attendance. Students who do not log in must have a letter from their parents.","qs":[{"n":33,"q":"Why will the school have online classes?","o":["There is a typhoon.","The school is being fixed.","The teachers are sick.","It is a holiday."],"a":"A","e":"因為颱風，學校改為線上上課。"},{"n":34,"q":"Which is true about the online classes?","o":["Parents must call Mr. Ho.","Students must use the school's website.","Students will go to school at 8:30.","Classes end at noon."],"a":"B","e":"學生要透過學校網站登入上課。"}]},{"from":35,"to":37,"type":"短文","title":"Sleep and Learning","text":"Many students stay up late to study before an exam. They think that more study time means better grades. However, scientists have found that this may not be true. Sleep plays an important role in how our brain stores information. When we sleep, the brain organizes what we learned during the day. Students who sleep well after studying can remember about 20% more than those who do not. In another study, students who slept only four hours a night had more trouble paying attention in class. Therefore, experts suggest that teenagers get eight to ten hours of sleep each night.","qs":[{"n":35,"q":"What is the main idea of the passage?","o":["Teenagers like staying up late.","Sleep helps students learn better.","Students should study more at night.","Exams are harder than before."],"a":"B","e":"全文說明睡眠有助於大腦儲存資訊，幫助學習。"},{"n":36,"q":"What happens when we sleep?","o":["We forget what we learned.","Our brain organizes what we learned.","We eat less.","We feel hungry."],"a":"B","e":"睡覺時，大腦整理白天學到的東西。"},{"n":37,"q":"How many hours of sleep do experts suggest for teenagers?","o":["More than twelve.","Four to six.","Six to eight.","Eight to ten."],"a":"D","e":"專家建議青少年每晚睡八到十小時。"}]},{"from":38,"to":43,"type":"填空","title":"The Sea Turtle","text":"Last summer, my family visited a beach in Pingtung. We went there to see sea turtles __38__ eggs on the sand. Sea turtles are in danger because people __39__ their eggs and dirty the ocean. Many of them die by eating plastic bags, which look like jellyfish. The guide told us, \"If you see a sea turtle, please keep a distance and __40__ it alone.\" At night, we saw a mother turtle come out of the water. She dug a hole and laid about one hundred eggs. It was a __41__ moment that I will never forget. __42__ the turtles need our help, we should do our best to protect them. After this trip, I stopped __43__ plastic bags.","qs":[{"n":38,"q":"","o":["laid","lays","lay","laying"],"a":"D","e":"see + 受詞 + V-ing，表示看到海龜正在產卵。"},{"n":39,"q":"","o":["steals","stealing","steal","stole"],"a":"C","e":"people 是複數，現在式動詞用 steal。"},{"n":40,"q":"","o":["leave","to leave","leaves","leaving"],"a":"A","e":"祈使句中的 and 連接兩個動詞，與 keep 平行用原形動詞 leave。"},{"n":41,"q":"","o":["touches","touch","touching","touched"],"a":"C","e":"修飾 moment 的形容詞，表示「令人感動的」，用現在分詞 touching。"},{"n":42,"q":"","o":["Although","Because","So","Unless"],"a":"B","e":"因為海龜需要我們的幫助，所以我們應該盡力保護牠們，用 Because 引導原因。"},{"n":43,"q":"","o":["using","to use","used","use"],"a":"A","e":"stop + V-ing 表示停止做某事。"}]}]},{"n":12,"kind":"會考模擬（二）","scope":"第1～6冊全範圍：詞彙、文法、對話、圖表與短文閱讀、綜合測驗","singles":[{"n":1,"q":"Please speak _____. The baby is sleeping.","o":["quietly","quietness","quiet","quieter"],"a":"A","e":"修飾動詞 speak 要用副詞 quietly。"},{"n":2,"q":"The old man lives _____, so his children visit him every weekend.","o":["alone","among","against","lonely"],"a":"A","e":"live alone 表示獨自生活。"},{"n":3,"q":"I'm sorry. I didn't _____ to hurt your feelings.","o":["hope","guess","mean","wish"],"a":"C","e":"didn't mean to V 表示「不是故意要……」。"},{"n":4,"q":"Our teacher gave us a lot of homework, _____ we couldn't go to the party.","o":["so","because","but","if"],"a":"A","e":"功課很多是原因，不能去派對是結果，用 so。"},{"n":5,"q":"A: Do you mind if I open the window? B: _____ It's too hot in here.","o":["Yes, I do.","I'd rather not.","That's too bad.","No, go ahead."],"a":"D","e":"Do you mind 的回答，No 表示不介意，可以開窗。"},{"n":6,"q":"The students were asked to _____ the classroom before they left.","o":["give up","clean up","look up","pick up"],"a":"B","e":"clean up 表示打掃乾淨。"},{"n":7,"q":"By the end of this year, my father _____ in this company for twenty years.","o":["has worked","works","will have worked","will work"],"a":"C","e":"By the end of this year 搭配未來完成式 will have worked。"},{"n":8,"q":"It is _____ to eat too much junk food.","o":["healthily","unhealthy","health","healthy"],"a":"B","e":"吃太多垃圾食物是不健康的，用 unhealthy。"},{"n":9,"q":"I don't know _____ to say. I'm so surprised.","o":["who","which","what","where"],"a":"C","e":"驚訝得不知道要說什麼，用 what to say。"},{"n":10,"q":"The movie was so touching _____ many people cried.","o":["but","that","which","as"],"a":"B","e":"so + 形容詞 + that 子句。"},{"n":11,"q":"Mary is the girl _____ father is a famous doctor.","o":["which","who","whose","whom"],"a":"C","e":"Mary 的爸爸，表示所有關係，用 whose。"},{"n":12,"q":"I'd like to buy a _____ for my little sister. She loves playing with it.","o":["coin","basket","sofa","toy"],"a":"D","e":"小妹喜歡玩，所以想買玩具。"},{"n":13,"q":"If you _____ harder, you would pass the exam.","o":["studied","will study","had studied","study"],"a":"A","e":"與現在事實相反的假設，if 子句用過去式 studied。"},{"n":14,"q":"The bridge, _____ was built in 1990, is now the symbol of our city.","o":["where","what","which","who"],"a":"C","e":"先行詞是物 The bridge，非限定用法，用 which。"},{"n":15,"q":"She has _____ finished her work, so she can go home now.","o":["yet","never","just","ever"],"a":"C","e":"has just finished 表示剛剛完成。"},{"n":16,"q":"The little girl is afraid _____ dogs.","o":["in","at","to","of"],"a":"D","e":"be afraid of 表示「害怕……」。"},{"n":17,"q":"Tom ran so fast that he _____ the bus.","o":["caught","missed","lost","left"],"a":"A","e":"他跑得很快，所以趕上了公車。"},{"n":18,"q":"Neither my sister nor I _____ interested in sports.","o":["am","are","be","is"],"a":"A","e":"Neither...nor 的動詞與靠近它的主詞 I 一致，用 am。"},{"n":19,"q":"A sign on a lake says: \"Danger! Thin ice.\" What does the sign mean?","o":["People can skate here.","The lake is closed in summer.","People should not walk on the ice.","The ice is very thick."],"a":"C","e":"Thin ice 表示冰很薄，很危險，不應在上面行走。"}],"groups":[{"from":20,"to":22,"type":"傳單","title":"Neighborhood Clean-up","text":"Neighborhood Clean-up\nOur streets are our home. Let's keep them clean!\nWhen: Every first Sunday of the month, 8:00 a.m. - 10:00 a.m.\nWhere: Meet at the front gate of Rainbow Park\nWhat to bring: gloves and a bag. We will provide tongs and water.\nThose who join three times in a row will get a free movie ticket!\nFamilies, students, and elderly people are all welcome.\nJoin us on Facebook: Rainbow Clean-up Group","qs":[{"n":20,"q":"How often is the clean-up held?","o":["Every Sunday.","Once a month.","Twice a month.","Every morning."],"a":"B","e":"每個月第一個星期日，所以一個月一次。"},{"n":21,"q":"What will the organizers provide?","o":["Gloves and bags.","Movie tickets.","Breakfast.","Tongs and water."],"a":"D","e":"主辦單位提供夾子與水。"},{"n":22,"q":"How can people get a free movie ticket?","o":["By joining the event three times in a row.","By bringing gloves.","By inviting three friends.","By joining the Facebook group."],"a":"A","e":"連續參加三次，可獲得免費電影票。"}]},{"from":23,"to":24,"type":"短文","title":"The Magic Pencil Case","text":"Amy had an old pencil case. It was torn and had a big ink stain. Her classmates often laughed at it, and she wanted a new one. One day, her grandmother told her, \"That pencil case was mine when I was your age. I used it for six years, and I learned everything I know with it.\" Amy was surprised. She looked at the pencil case again. It no longer looked old to her; it looked special. From then on, she took good care of it. She even sewed up the hole by herself. She learned that the value of something is not in how new it looks but in the memories it holds.","qs":[{"n":23,"q":"Why did Amy want a new pencil case at first?","o":["Her old one was too small.","She lost her old one.","Her grandmother gave her money.","Her friends laughed at her old one."],"a":"D","e":"同學常嘲笑她那個破舊的鉛筆盒，所以她想換新的。"},{"n":24,"q":"What did Amy learn?","o":["She should sew every day.","Old things are always better.","New things are not important.","Memories give things value."],"a":"D","e":"事物的價值在於它所承載的回憶，而非外表是否嶄新。"}]},{"from":25,"to":27,"type":"對話","title":"At the Doctor's","text":"Doctor: What seems to be the problem?\nKim: I have a terrible headache, and I've been coughing since yesterday.\nDoctor: Do you have a fever?\nKim: I think so. I feel hot, but I haven't taken my temperature.\nDoctor: Let me check. Yes, it's 38.5°C. How long have you been sleeping at night?\nKim: Only about four hours. I've been preparing for an exam.\nDoctor: That's not enough. You should rest more. I'll give you some medicine. Take it three times a day after meals.\nKim: Thank you, doctor. Should I go to school tomorrow?\nDoctor: No. Stay at home for two days and drink plenty of water.","qs":[{"n":25,"q":"What is wrong with Kim?","o":["She can't sleep because of noise.","She has a stomachache.","She hurt her leg.","She has a headache, a cough, and a fever."],"a":"D","e":"Kim 頭痛、咳嗽，醫生量到體溫 38.5°C，表示發燒。"},{"n":26,"q":"Why does Kim sleep so little?","o":["She watches TV.","She works at night.","She feels too hot.","She is preparing for an exam."],"a":"D","e":"她一直在準備考試，每晚只睡四小時。"},{"n":27,"q":"What does the doctor tell Kim to do?","o":["Go to school tomorrow.","Take medicine before meals.","Do more exercise.","Stay at home and drink water."],"a":"D","e":"醫生要她在家休息兩天並多喝水。"}]},{"from":28,"to":29,"type":"電子郵件","title":"Pen Pal","text":"To: Lucas\nFrom: Mei\nSubject: Nice to meet you!\nDear Lucas,\nMy name is Mei, and I live in Tainan. My teacher told me that you want to practice Chinese, so I am writing to you. I am fourteen years old, and I love baking and playing badminton. In my free time, I also learn French. I have never been to France, but I hope to go there someday. What about you? Please tell me more about yourself and your country. I'm looking forward to your reply!\nMei","qs":[{"n":28,"q":"How did Mei find out about Lucas?","o":["From a website.","From her mother.","From her teacher.","From a friend."],"a":"C","e":"老師告訴她 Lucas 想練習中文。"},{"n":29,"q":"What does Mei hope to do?","o":["Teach Lucas French.","Visit France one day.","Learn baking in Tainan.","Play badminton with Lucas tomorrow."],"a":"B","e":"她說從沒去過法國，但希望有一天能去。"}]},{"from":30,"to":32,"type":"行程表","title":"School Trip Schedule","text":"Grade 8 School Trip to Hualien\nDay 1: 7:00 Leave school → 11:30 Arrive at Qingshui Cliff → 12:30 Lunch → 15:00 Check in at the hotel → 18:00 Dinner\nDay 2: 8:00 Breakfast → 9:00 Visit Taroko Gorge → 12:00 Lunch → 14:00 Rafting (for those who sign up) → 17:00 Free time → 19:00 Dinner\nDay 3: 8:00 Breakfast → 9:30 Leave for home → 15:00 Arrive at school\nPlease bring your own towel and swimsuit for rafting.","qs":[{"n":30,"q":"How many days is the school trip?","o":["Three.","Two.","Four.","Five."],"a":"A","e":"行程分為 Day 1 到 Day 3，共三天。"},{"n":31,"q":"What will students do right after lunch on the second day?","o":["Have free time.","Check in at the hotel.","Visit Taroko Gorge.","Go rafting."],"a":"D","e":"第二天午餐後 14:00 是泛舟，只有報名的人參加。"},{"n":32,"q":"What do students need to bring if they go rafting?","o":["A towel and a swimsuit.","A camera and a map.","A lunch box.","A raincoat and a hat."],"a":"A","e":"行程表最後提醒泛舟要自備毛巾和泳衣。"}]},{"from":33,"to":34,"type":"公告","title":"Lost Property","text":"Lost Property Notice\nMany items have been left in the gym over the past month. They include three water bottles, two jackets, one umbrella, and a pair of glasses. If you have lost anything, please come to the General Office before Friday, June 9. Be ready to describe the item. After that date, all unclaimed items will be given to charity. Please note that valuable items such as phones and wallets should be handed in to the office directly and not left in the gym.","qs":[{"n":33,"q":"What will happen to items that are not claimed by June 9?","o":["They will be thrown away.","They will be given to charity.","They will be kept in the gym.","They will be sold to students."],"a":"B","e":"逾期沒人領的物品會捐給慈善機構。"},{"n":34,"q":"What can we learn from the notice?","o":["Students need to describe lost items.","The office is in the gym.","Students must pay to get their things.","Phones should be left in the gym."],"a":"A","e":"公告要求認領者說明遺失物品的特徵。"}]},{"from":35,"to":37,"type":"短文","title":"Street Musicians","text":"Every weekend, a group of young people play music on a busy street in the city center. They don't have a stage, and their instruments are simple: a guitar, a drum, and a small keyboard. At first, few people stopped to listen, but they kept playing. Slowly, a crowd began to form. Now, people come from all over the city to hear them. One of the players said, \"We don't do this for money. We want to bring happiness to people who are in a hurry.\" Some people put coins in their hat, while others just smile and say thank you. The city government has even asked them to play at the New Year concert.","qs":[{"n":35,"q":"What is the main purpose of the young people?","o":["To teach music to children.","To become famous singers.","To earn a lot of money.","To bring happiness to busy people."],"a":"D","e":"他們說不是為了錢，而是想帶給匆忙的人快樂。"},{"n":36,"q":"What happened after the group kept playing?","o":["A crowd began to form.","They lost their instruments.","They moved to another city.","The street was closed."],"a":"A","e":"一開始很少人停下來，但慢慢地聚集了群眾。"},{"n":37,"q":"What can we infer from the last sentence?","o":["The band is too noisy.","The government doesn't like the band.","The band is becoming well known.","The band plays only at New Year."],"a":"C","e":"市政府邀請他們在跨年演唱會表演，可見他們已有名氣。"}]},{"from":38,"to":43,"type":"填空","title":"A Good Habit","text":"My uncle is a person who gets up very early every morning. He says that this is a good habit that has __38__ him a lot. He goes jogging for an hour and then __39__ breakfast for the whole family. When I was little, I often wondered __40__ he didn't feel sleepy. He said, \"In the morning, the air is fresh, and my mind is clear.\" Last year, I decided to follow him. At first, it was __41__ for me to get up at five. But after a few weeks, I got used to it. Now I feel __42__ and have more energy during the day. I think developing good habits can make our lives much __43__.","qs":[{"n":38,"q":"","o":["help","helped","helping","helps"],"a":"B","e":"has 後面接過去分詞 helped，構成現在完成式。"},{"n":39,"q":"","o":["make","made","makes","making"],"a":"C","e":"主詞是 he，現在簡單式動詞加 s。"},{"n":40,"q":"","o":["what","why","whose","where"],"a":"B","e":"wonder why he didn't feel sleepy，表示納悶為什麼不覺得睏。"},{"n":41,"q":"","o":["hardly","hard","harder","hardest"],"a":"B","e":"it is hard for me to V，hard 是形容詞，表示「困難的」。"},{"n":42,"q":"","o":["refreshing","refreshed","refresh","refreshes"],"a":"B","e":"feel + 形容詞，主詞是人，表示「感到精神煥發」，用 refreshed。"},{"n":43,"q":"","o":["good","best","better","well"],"a":"C","e":"make + 受詞 + 形容詞，表示「使生活變得更好」，用比較級 better。"}]}]},{"n":13,"kind":"會考模擬（三）","scope":"第1～6冊全範圍：詞彙、文法、對話、圖表與短文閱讀、綜合測驗","singles":[{"n":1,"q":"The tour guide asked us to _____ together so that no one would get lost.","o":["leave","wonder","stay","spend"],"a":"C","e":"為了不走失，導遊要大家待在一起。"},{"n":2,"q":"My mother is very _____ about my health. She always makes me eat breakfast.","o":["surprised","serious","excited","worried"],"a":"D","e":"她擔心我的健康，所以總是要我吃早餐。"},{"n":3,"q":"The price of vegetables _____ a lot after the typhoon last week.","o":["went by","went up","went on","went out"],"a":"B","e":"颱風後菜價上漲，go up 表示上升。"},{"n":4,"q":"Neither of the two shirts _____ me. They are both too small.","o":["fits","fit","fitting","to fit"],"a":"A","e":"Neither of the two 當單數處理，現在式用 fits。"},{"n":5,"q":"A: How about going to the night market tonight? B: _____. I have a lot of homework to do.","o":["Why not","Of course","I'd rather not","Sounds great"],"a":"C","e":"後面說有很多功課，表示婉拒，用 I'd rather not。"},{"n":6,"q":"It took Tom two years _____ the book.","o":["writing","write","wrote","to write"],"a":"D","e":"It takes + 時間 + to V。"},{"n":7,"q":"I enjoy _____ to music while I am doing my homework.","o":["listening","listen","listened","to listen"],"a":"A","e":"enjoy 後面接動名詞 listening。"},{"n":8,"q":"The cookies _____ by my grandmother taste wonderful.","o":["make","are made","making","made"],"a":"D","e":"過去分詞後置修飾 cookies，表示「奶奶做的餅乾」。"},{"n":9,"q":"He is the only person _____ I can talk to about this problem.","o":["who","what","which","whose"],"a":"A","e":"先行詞是人，用 who；what 不接先行詞。"},{"n":10,"q":"We must hurry. The movie _____ start in ten minutes.","o":["would","has to","is going to","used to"],"a":"C","e":"電影十分鐘後就要開始，表示即將發生的事，用 be going to。"},{"n":11,"q":"Mr. Chang looks angry. I wonder _____ he is upset.","o":["what","why","which","whether"],"a":"B","e":"wonder why 表示納悶為什麼他生氣。"},{"n":12,"q":"Sam is _____ than any other student in his class.","o":["more tall","tall","taller","the tallest"],"a":"C","e":"與班上任何其他學生比較，用比較級 taller。"},{"n":13,"q":"Ann asked me _____ I could lend her my notes.","o":["that","if","how","what"],"a":"B","e":"間接問句表示「能不能」，用 if。"},{"n":14,"q":"I can't find my keys. I think I _____ them at the restaurant.","o":["am leaving","left","have leave","leave"],"a":"B","e":"鑰匙是之前遺留的，用過去式 left。"},{"n":15,"q":"The more careful you are, the _____ mistakes you will make.","o":["less","fewer","fewest","few"],"a":"B","e":"mistakes 是可數名詞，用 fewer；the + 比較級 ..., the + 比較級 ...。"},{"n":16,"q":"Please give me some advice. I don't know _____ to do.","o":["who","how","which","what"],"a":"D","e":"不知道要做什麼，用 what to do。"},{"n":17,"q":"Mr. Lin was so tired that he fell asleep _____ he got on the bus.","o":["as long as","unless","even if","as soon as"],"a":"D","e":"as soon as 表示「一……就……」。"},{"n":18,"q":"This is a story _____ happened in a small village many years ago.","o":["whom","who","which","where"],"a":"C","e":"先行詞是物 a story，作主詞，用 which。"},{"n":19,"q":"A label on a medicine bottle says: \"Keep out of reach of children.\" What does it mean?","o":["The medicine is only for children.","Children should not touch the medicine.","Children should take the medicine.","The medicine tastes sweet."],"a":"B","e":"要放在小孩拿不到的地方，所以小孩不該碰。"}],"groups":[{"from":20,"to":22,"type":"廣告","title":"Weekend Market","text":"Sunset Weekend Market\nFresh food, handmade gifts, and live music!\nOpen: Saturday and Sunday, 3:00 p.m. - 9:00 p.m.\nWhere: Harbor Square (next to the ferry pier)\nHighlights:\n- Local farmers sell fruits and vegetables.\n- Artists sell paintings and cards.\n- Live music starts at 6:00 p.m.\nParking is limited. Please take the ferry or the bus. Tickets for the ferry are only $20 on weekends.\nBring your own bag. Plastic bags are not provided.","qs":[{"n":20,"q":"What can people buy at the market?","o":["Fruits, vegetables, and handmade gifts.","Cars and bikes.","Furniture and books.","Clothes and shoes."],"a":"A","e":"市集有農民賣蔬果，藝術家賣畫與卡片等手作物。"},{"n":21,"q":"How can visitors get there?","o":["On foot only.","By ferry or bus.","By car only.","By plane."],"a":"B","e":"因為停車位有限，建議搭渡輪或公車。"},{"n":22,"q":"What should visitors bring?","o":["Some music.","Plastic bags.","A ferry ticket.","Their own bags."],"a":"D","e":"市集不提供塑膠袋，請自備袋子。"}]},{"from":23,"to":24,"type":"短文","title":"Grandpa's Watch","text":"Grandpa had an old watch that he wore every day. It did not tell time correctly anymore, and it was scratched. My father asked, \"Why don't you buy a new one?\" Grandpa smiled and said, \"This watch was a gift from your mother. She gave it to me when we got married, forty years ago.\" My father fell silent. A week later, he took the watch to a shop and had it repaired. When he gave it back to Grandpa, Grandpa's eyes were full of tears. \"Thank you, son,\" he said. \"Now it can keep going for another forty years.\"","qs":[{"n":23,"q":"Why didn't Grandpa buy a new watch?","o":["His son told him not to.","The watch was a special gift.","He didn't need a watch.","He couldn't afford one."],"a":"B","e":"手錶是太太送的結婚禮物，對他有特別意義。"},{"n":24,"q":"How did Grandpa feel when he got the watch back?","o":["Moved.","Angry.","Bored.","Worried."],"a":"A","e":"他眼中泛淚並道謝，表示很感動。"}]},{"from":25,"to":27,"type":"對話","title":"Joining the Team","text":"Coach: Welcome to the basketball team, Ryan. Have you played before?\nRyan: Yes. I played for my elementary school team for three years.\nCoach: Great. We have practice every Tuesday and Thursday after school, from 4:30 to 6:00.\nRyan: Can I miss a practice if I have a test?\nCoach: Of course. Just let me know in advance. By the way, do you have a pair of basketball shoes?\nRyan: Not yet. I plan to buy a pair this weekend.\nCoach: Good. Remember to also bring a water bottle and a towel to every practice.\nRyan: Got it. Thank you, Coach.","qs":[{"n":25,"q":"How long is each practice?","o":["One hour.","Thirty minutes.","One and a half hours.","Two hours."],"a":"C","e":"從 4:30 到 6:00，共一個半小時。"},{"n":26,"q":"What should Ryan do if he has a test on a practice day?","o":["Come anyway.","Quit the team.","Tell the coach in advance.","Ask his friends to play for him."],"a":"C","e":"教練說有考試可以缺席，但要事先告知。"},{"n":27,"q":"What does Ryan plan to do this weekend?","o":["Take a test.","Play in a game.","Buy basketball shoes.","Visit his elementary school."],"a":"C","e":"他打算週末買一雙籃球鞋。"}]},{"from":28,"to":29,"type":"電子郵件","title":"Concert Tickets","text":"To: Josh\nFrom: Hana\nSubject: Concert tickets\nHi Josh,\nGuess what? I just got two tickets to the Jay Chou concert on December 2! My uncle works for the ticket company, and he gave them to me for free. The concert starts at 7:30 p.m. Do you want to go with me? I know you are a big fan, too. If you're free, let's meet at the MRT station at 6:00 p.m. and have dinner before the show. Please reply by this Friday so that I can tell my uncle.\nHana","qs":[{"n":28,"q":"How did Hana get the tickets?","o":["Her uncle gave them to her.","She won them in a contest.","She bought them online.","Josh gave them to her."],"a":"A","e":"她叔叔在票務公司工作，免費給了她票。"},{"n":29,"q":"What does Hana want Josh to do?","o":["Make dinner for her.","Meet her uncle.","Reply by Friday.","Buy two more tickets."],"a":"C","e":"她請 Josh 在週五前回覆，才能告訴叔叔。"}]},{"from":30,"to":32,"type":"圖表","title":"Students' Favorite Fruit","text":"A class survey of 40 students asked, \"What is your favorite fruit?\" The results are shown below.\nApples: 12 students\nBananas: 8 students\nStrawberries: 10 students\nWatermelons: 6 students\nOthers: 4 students\nThe teacher says that although apples are the most popular fruit, strawberries are close behind.","qs":[{"n":30,"q":"Which fruit is the most popular?","o":["Watermelons.","Bananas.","Strawberries.","Apples."],"a":"D","e":"蘋果 12 票，最多人喜歡。"},{"n":31,"q":"How many students like strawberries or watermelons?","o":["6","10","16","18"],"a":"C","e":"草莓 10 人加西瓜 6 人，共 16 人。"},{"n":32,"q":"How many more students like apples than bananas?","o":["2","4","6","8"],"a":"B","e":"蘋果 12 人，香蕉 8 人，多 4 人。"}]},{"from":33,"to":34,"type":"公告","title":"Swimming Pool Rules","text":"Swimming Pool Rules\n1. Take a shower before you enter the pool.\n2. Children under ten must be with an adult.\n3. No running around the pool.\n4. No food or drinks in the water.\n5. Swimming caps are required for everyone.\n6. If you hear thunder, leave the water immediately.\nThank you for helping us keep the pool safe and clean.","qs":[{"n":33,"q":"What must people do before they enter the pool?","o":["Eat a snack.","Call a lifeguard.","Take a shower.","Buy a cap."],"a":"C","e":"規則第一條是下水前先淋浴。"},{"n":34,"q":"What should people do when they hear thunder?","o":["Stay in the water.","Leave the water at once.","Run to the shower room.","Dive to the bottom."],"a":"B","e":"聽到雷聲要立刻離開水中。"}]},{"from":35,"to":37,"type":"短文","title":"Honey Bees","text":"Honey bees are small, but they play a big role in our lives. About one third of the food we eat depends on bees, because they carry pollen from flower to flower. This helps plants make fruits and seeds. However, the number of bees around the world has been dropping. Scientists say that pesticides and the loss of flowers are two main reasons. Some cities have started to help. They plant more flowers in parks and along roads, and they limit the use of pesticides. Ordinary people can also help. For example, you can grow flowers on your balcony or avoid using chemicals in your garden.","qs":[{"n":35,"q":"Why are bees important?","o":["They help plants make fruits and seeds.","They kill other insects.","They make people healthy.","They clean flowers."],"a":"A","e":"蜜蜂傳花粉，幫助植物結果和結種子。"},{"n":36,"q":"What is one reason bees are disappearing?","o":["Too many flowers.","Cold weather.","Pesticides.","Too many people."],"a":"C","e":"科學家指出殺蟲劑是蜜蜂減少的主因之一。"},{"n":37,"q":"What can ordinary people do to help bees?","o":["Move to the city.","Collect honey.","Use more chemicals.","Grow flowers."],"a":"D","e":"民眾可以在陽台種花來幫助蜜蜂。"}]},{"from":38,"to":43,"type":"填空","title":"Learning to Cook","text":"When I was ten, I couldn't even boil an egg. My mother was always busy, so she __38__ most of the meals. One day, I said to her, \"Can you teach me __39__?\" She smiled and said yes. The first dish we made together was fried rice. I was nervous, and I __40__ the rice so badly that it turned black. My mother didn't get angry. She told me, \"Everyone makes mistakes when they begin.\" Since then, I __41__ many dishes. Last week, I made dinner for my family for the first time. They said it was the __42__ meal they had ever had. I felt so proud that I could __43__ say a word.","qs":[{"n":38,"q":"","o":["cooking","cooked","cooks","cook"],"a":"B","e":"描述過去的情況，用過去式 cooked。"},{"n":39,"q":"","o":["cooks","cooked","to cook","how to cook"],"a":"D","e":"teach me how to cook 表示教我如何烹飪。"},{"n":40,"q":"","o":["burned","burning","burn","burns"],"a":"A","e":"描述過去發生的事，用過去式 burned。"},{"n":41,"q":"","o":["learned","have learned","learn","am learning"],"a":"B","e":"Since then 搭配現在完成式 have learned。"},{"n":42,"q":"","o":["the most delicious","more delicious","most delicious","delicious"],"a":"A","e":"他們吃過最好吃的一餐，用 the + 最高級；有 ever 搭配。"},{"n":43,"q":"","o":["hardly","almost","nearly","quite"],"a":"A","e":"驕傲得幾乎說不出話，用 hardly 表示「幾乎不」。"}]}]},{"n":14,"kind":"會考模擬（四）","scope":"第1～6冊全範圍：詞彙、文法、對話、圖表與短文閱讀、綜合測驗","singles":[{"n":1,"q":"The doctor told him to _____ smoking because it was bad for his lungs.","o":["look up","give up","take up","put up"],"a":"B","e":"give up 表示放棄、戒除。"},{"n":2,"q":"My little sister is too _____ to go to school alone. She is only five.","o":["young","brave","tall","old"],"a":"A","e":"她才五歲，年紀太小，不能自己上學。"},{"n":3,"q":"It is _____ to keep a pet if you don't have enough time to take care of it.","o":["wise","unfair","useless","polite"],"a":"B","e":"沒有足夠時間照顧卻養寵物，對寵物不公平，所以選 unfair。"},{"n":4,"q":"A: How was your trip to Japan? B: It was _____. I'd like to go there again.","o":["terrible","wonderful","awful","boring"],"a":"B","e":"回答想再去一次，表示旅行很棒。"},{"n":5,"q":"The doctor said that smoking _____ cause serious diseases.","o":["used to","had to","may","were"],"a":"C","e":"may 表示可能；其他選項在語意或文法上不通。"},{"n":6,"q":"My father has _____ been to Europe. He wants to go this summer.","o":["just","never","already","ever"],"a":"B","e":"因為沒去過，所以想今年夏天去，用 never。"},{"n":7,"q":"Sue is looking forward to _____ her cousin from Canada.","o":["seeing","be seen","saw","see"],"a":"A","e":"look forward to 的 to 是介系詞，後面接動名詞。"},{"n":8,"q":"The glass _____ when it fell off the table.","o":["has broken","broke","was broken","breaks"],"a":"B","e":"玻璃杯掉下桌子而碎了，是主動意義，用過去式 broke。"},{"n":9,"q":"She is the kind of person _____ never gives up.","o":["whose","who","which","what"],"a":"B","e":"先行詞是 person，作主詞，用 who。"},{"n":10,"q":"A: Are you free tomorrow? B: Yes, why do you ask? A: I wonder _____ you could help me with my homework.","o":["if","that","what","who"],"a":"A","e":"wonder if 表示「想知道是否」。"},{"n":11,"q":"The boy ran _____ the street without looking and almost got hit by a car.","o":["between","among","along","across"],"a":"D","e":"run across the street 表示跑過街。"},{"n":12,"q":"I'd rather _____ at home than go out in this weather.","o":["staying","to stay","stayed","stay"],"a":"D","e":"would rather + 原形動詞。"},{"n":13,"q":"Judy was _____ tired that she fell asleep during the movie.","o":["very","so","such","too"],"a":"B","e":"so + 形容詞 + that 子句。"},{"n":14,"q":"Do you know the girl _____ is talking to Mr. Brown?","o":["who","whose","whom","which"],"a":"A","e":"先行詞是人 the girl，作主詞，用 who。"},{"n":15,"q":"Mom was cooking dinner _____ the phone rang.","o":["since","after","while","when"],"a":"D","e":"媽媽正在做飯，這時電話響了，用 when 連接長動作與短動作。"},{"n":16,"q":"The mountain is _____ of snow in winter.","o":["fulfilled","full","fill","filled"],"a":"B","e":"be full of 表示「充滿……」。"},{"n":17,"q":"This road is closed _____ repairs. Please use the other one.","o":["on","at","for","by"],"a":"C","e":"closed for repairs 表示因整修而封閉。"},{"n":18,"q":"Neither Amy nor her sisters _____ at the party yesterday.","o":["is","were","was","are"],"a":"B","e":"Neither...nor 的動詞與靠近的 her sisters（複數）一致，yesterday 是過去，用 were。"},{"n":19,"q":"A poster at a school gate says: \"Walk your bike inside the school.\" What should students do?","o":["Push their bikes.","Take bikes to class.","Leave bikes at home.","Ride their bikes fast."],"a":"A","e":"Walk your bike 表示牽著腳踏車走。"}],"groups":[{"from":20,"to":22,"type":"廣告","title":"Art Class","text":"Little Painters Art Class\nFor children aged 5 to 12\nClasses: Saturday 10:00 - 11:30 or Sunday 2:00 - 3:30\nPrice: $600 per class, or $2,000 for four classes\nWhat you will learn: drawing, painting, and making clay animals\nThe first class is free if you bring a friend!\nAll materials are provided, but please bring your own apron.\nCall 2468-1357 to make a reservation.","qs":[{"n":20,"q":"How old must children be to join the class?","o":["Over twelve.","Under five.","Between 5 and 12.","Any age."],"a":"C","e":"課程是為 5 到 12 歲的孩子設計。"},{"n":21,"q":"How much can a child save by paying for four classes together?","o":["$200","$300","$400","$600"],"a":"C","e":"單堂 $600，四堂原價 $2,400，團購 $2,000，省 $400。"},{"n":22,"q":"What should students bring?","o":["Paint.","Clay.","Their own apron.","A friend."],"a":"C","e":"所有材料由教室提供，但需要自備圍裙。"}]},{"from":23,"to":24,"type":"短文","title":"Early Bird","text":"Peter always went to school late. His teacher often scolded him, but he never changed. One day, he saw an old man who was sweeping the street early in the morning. The old man said, \"I get up at four every day. When I work early, I have more time for myself later.\" This made Peter think. The next day, he got up half an hour earlier and found that he did not have to rush. He had time for breakfast and was never late again. He told his friends about it, and they started to get up earlier, too.","qs":[{"n":23,"q":"What did Peter learn from the old man?","o":["Sweeping the street is fun.","Old people get up late.","Teachers like early birds.","Getting up early gives you more time."],"a":"D","e":"老人說早點工作，之後就有更多自己的時間。"},{"n":24,"q":"What happened after Peter got up earlier?","o":["He had time for breakfast and was on time.","He quarreled with his friends.","He lost his breakfast.","He was late for school."],"a":"A","e":"他有時間吃早餐，也不再遲到。"}]},{"from":25,"to":27,"type":"對話","title":"Planning a Birthday Party","text":"Nora: Dad's fiftieth birthday is next Sunday. Should we hold a party at home or at a restaurant?\nBrian: A restaurant might be easier. We won't have to cook or clean.\nNora: But it'll cost more. And Dad prefers a quiet dinner at home.\nBrian: You're right. How about ordering food from a restaurant and having it delivered?\nNora: Good idea! Then we can spend our time decorating the house.\nBrian: I'll make a birthday cake. I've been practicing baking this month.\nNora: Really? That's great. Dad will be so happy.\nBrian: Just don't tell him. I want it to be a surprise.","qs":[{"n":25,"q":"Why doesn't Nora want to hold the party at a restaurant?","o":["The restaurant is too far.","The restaurant is closed on Sunday.","Dad dislikes restaurant food.","It costs more and Dad likes quiet dinners at home."],"a":"D","e":"Nora 說餐廳花費較高，而且爸爸喜歡在家吃安靜的晚餐。"},{"n":26,"q":"What will Brian do for the party?","o":["Cook dinner.","Buy a gift.","Make a cake.","Decorate the house."],"a":"C","e":"Brian 說他要做生日蛋糕。"},{"n":27,"q":"What does Brian want?","o":["To make the party a surprise.","To change the date.","To invite many friends.","To ask Dad to cook."],"a":"A","e":"Brian 說不要告訴爸爸，要給他驚喜。"}]},{"from":28,"to":29,"type":"電子郵件","title":"Library Card","text":"To: Ms. Yang\nFrom: Tony Huang\nSubject: Lost library card\nDear Ms. Yang,\nI lost my library card last Friday, and I cannot find it anywhere. I think I may have left it on the bus. I have a few books to return next week, and I also want to borrow some new ones. Could you please tell me how to get a new card? Do I need to pay for it? If so, how much is it? I'll come to the library this Saturday afternoon, if possible. Thank you for your help.\nTony Huang","qs":[{"n":28,"q":"What is Tony's problem?","o":["He can't find the library.","He broke a book.","He lost his library card.","He forgot to return books."],"a":"C","e":"他弄丟了借書證。"},{"n":29,"q":"What does Tony want to know?","o":["How to return books.","Which books are popular.","How to get a new card and how much it costs.","When the library closes."],"a":"C","e":"他詢問如何補辦新卡以及是否要付費、費用多少。"}]},{"from":30,"to":32,"type":"資訊表","title":"Recycling Guide","text":"Recycling Guide\nPaper (newspapers, boxes): Monday and Thursday\nPlastic bottles (clean and dry): Tuesday\nGlass bottles: Wednesday (the first week of each month)\nMetal cans: Friday\nFood waste: Every day, put it in the brown bin\nNote: Put your recycling outside before 7:00 a.m. on collection days.\nItems that are not cleaned will not be taken.","qs":[{"n":30,"q":"When should people put out newspapers?","o":["On Wednesday.","On Friday.","On Tuesday only.","On Monday and Thursday."],"a":"D","e":"報紙屬紙類，週一和週四回收。"},{"n":31,"q":"How often are glass bottles collected?","o":["Once a week.","Once a month.","Every Wednesday.","Every day."],"a":"B","e":"玻璃瓶只在每月第一週的星期三，也就是一個月一次。"},{"n":32,"q":"What will happen if the bottles are not cleaned?","o":["They will be put in the brown bin.","People will pay a fine.","They will not be taken.","They will be taken the next day."],"a":"C","e":"沒有清洗的物品不會被收走。"}]},{"from":33,"to":34,"type":"公告","title":"Parent Meeting","text":"Parent Meeting\nDate: Thursday, March 14\nTime: 6:30 p.m. - 8:00 p.m.\nPlace: School Hall\nTopics: The coming exams and the school trip\nPlease be on time. If you cannot come, please call the class teacher before Wednesday.\nRefreshments will be provided. Parking is limited, so we suggest that you walk or use public transport.\nMs. Tsai\nClass 9-4","qs":[{"n":33,"q":"What will be talked about at the meeting?","o":["Parking problems.","A new school uniform.","The exams and the school trip.","Sports Day and school lunches."],"a":"C","e":"會議主題是即將到來的考試與校外旅行。"},{"n":34,"q":"What should parents do if they cannot go?","o":["Call the teacher before Wednesday.","Write a letter after the meeting.","Come the next day.","Send their children."],"a":"A","e":"不能出席的家長請在週三前打電話給導師。"}]},{"from":35,"to":37,"type":"短文","title":"Words That Heal","text":"A hospital in a small town decided to try something new. Next to every patient's bed, they put a small box. Visitors, nurses, and even strangers could write short messages on cards and put them in the box. The messages were simple: \"Get well soon,\" \"You are stronger than you think,\" and \"We are thinking of you.\" The hospital found that patients who read these cards often felt less lonely and more hopeful. Some patients even said that the cards made them forget their pain for a while. Now, other hospitals are copying the idea. The director of the hospital says, \"Medicine can heal the body, but kind words can heal the heart.\"","qs":[{"n":35,"q":"What did the hospital put next to every bed?","o":["A flower.","A telephone.","A television.","A small box for cards."],"a":"D","e":"醫院在每位病人床邊放了一個放卡片的小箱子。"},{"n":36,"q":"How did the cards help the patients?","o":["They gave patients free medicine.","They made patients leave early.","They helped patients sleep.","They made patients feel less lonely."],"a":"D","e":"卡片讓病人比較不孤單，也更有希望。"},{"n":37,"q":"What does the director mean?","o":["Doctors should talk less.","Kind words can comfort people's hearts.","Kind words are more useful than medicine.","Patients should write more cards."],"a":"B","e":"院長的意思是醫藥治療身體，而善意的話語可以撫慰心靈。"}]},{"from":38,"to":43,"type":"填空","title":"My Hometown","text":"I come from a small town __38__ is known for its hot springs. Many tourists visit it every winter. When I was a child, I often went to the springs with my grandfather. He __39__ me many stories about the town. For example, the first hot spring was found by a farmer by accident. Today, the town has changed a lot. There are __40__ hotels and shops than before. Some people worry that too many tourists will hurt the environment. I think we should find a way to protect the town __41__ still welcoming visitors. If we work together, I believe we can solve this problem __42__. After all, a town is not only a place for tourists, but also a place __43__ people live.","qs":[{"n":38,"q":"","o":["what","who","whose","which"],"a":"D","e":"先行詞是物 a small town，作主詞，用 which。"},{"n":39,"q":"","o":["has told","tells","told","telling"],"a":"C","e":"描述小時候的事，用過去式 told。"},{"n":40,"q":"","o":["much","many","most","more"],"a":"D","e":"後面有 than，用比較級；hotels and shops 是複數，所以用 more。"},{"n":41,"q":"","o":["so","unless","while","because"],"a":"C","e":"while 在此表示「同時」，保護小鎮同時仍歡迎遊客。"},{"n":42,"q":"","o":["easily","easy","easier","ease"],"a":"A","e":"修飾動詞 solve，用副詞 easily。"},{"n":43,"q":"","o":["who","which","what","where"],"a":"D","e":"先行詞是地點 a place，關係副詞用 where。"}]}]},{"n":15,"kind":"會考模擬（五）","scope":"第1～6冊全範圍：詞彙、文法、對話、圖表與短文閱讀、綜合測驗","singles":[{"n":1,"q":"The coach told the players to _____ hard before the big game.","o":["practicing","practice","practiced","practices"],"a":"B","e":"tell + 人 + to V，to 後面接原形動詞 practice。"},{"n":2,"q":"A: Would you like to have some more soup? B: _____. I'm full.",
