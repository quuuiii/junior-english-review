adius:12px;background:#fff}.grp h3{margin:0 0 8px;font-size:1rem;color:#4b6378}.passage{background:#f6f9fc;border-radius:10px;padding:12px 14px;white-space:pre-line;margin-bottom:6px;font-family:Georgia,"Times New Roman",serif;line-height:1.7}.q{padding:14px 0;border-bottom:1px solid #e3ecf4;scroll-margin-top:80px}.q:last-child{border-bottom:0}.q .stem{margin:0 0 8px;color:var(--ink);font-weight:600}.q .no{color:#2876a7;margin-right:6px}.opts{display:grid;gap:6px}.opt{display:flex;gap:8px;text-align:left;border:1px solid #cad8e5;background:#fff;border-radius:10px;padding:8px 12px;color:var(--ink);width:100%}.opt b{min-width:1.4em;color:#2876a7}.opt.chosen{border-color:#168e86;background:#e6f6f3}.opt.ok{border-color:#2a9d5c;background:#e4f7ea}.opt.bad{border-color:#d1493f;background:#fdeceb}.opt:disabled{cursor:default}.expl{margin-top:8px;padding:8px 12px;border-radius:8px;background:#fff9eb;font-size:.92rem;color:#5a4a1d}.blank{display:inline-block;min-width:2.6em;text-align:center;border-bottom:2px solid #2876a7;font-weight:700;color:#2876a7;font-family:system-ui}.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}.sc{border:1px solid var(--line);border-radius:8px;background:#fff;padding:6px 2px;text-align:center;font-size:.85rem;color:var(--ink)}.sc.done{background:#e6f6f3;border-color:#168e86}.sc.ok{background:#e4f7ea;border-color:#2a9d5c}.sc.bad{background:#fdeceb;border-color:#d1493f}.result{background:linear-gradient(120deg,#f1f8ff,#eefaf3);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}.result .big{font-size:2rem;font-weight:800;color:#168e86}.notice{background:#fff9eb;padding:12px;border-radius:10px;margin:12px 0;font-size:.9rem;color:#5a4a1d}@media(max-width:620px){.panel,.hero{padding:14px}.grp{padding:8px;margin-left:-6px;margin-right:-6px}}.sitenav{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap}.sitenav .logo{font-weight:850;color:#286ec0;text-decoration:none;margin-right:6px}.sitenav .logo span{color:#16a79e}.sitenav .links{display:flex;gap:6px;flex-wrap:wrap}.sitenav .links a{font-weight:750;color:#1b7c83;text-decoration:none;white-space:nowrap;padding:4px 12px;border-radius:20px}.sitenav .links a:hover{background:#f0f7ff}.sitenav .links a.active{background:#e1f2ff;color:#1d5fa6}</style></head><body>

<div id="choose"><div class="hero"><h1>📝 會考英語模擬試題｜共 16 回</h1><p>參照《會考 3800+ 應用題彙編》的回數與編排：分冊複習 10 回、會考模擬 6 回。每回 43 題（單題 19 題＋題組 24 題），題目全部為原創，並附答案與中文解析。聽力題因需音檔，本頁未收錄。</p></div><div id="cards"></div><p class="muted">答案儲存在此裝置的瀏覽器，不會上傳。成績僅供自我檢視。</p></div>

<script>
const DATA=[{"n":1,"kind":"分冊複習・第1冊","scope":"祈使句、現在進行式、be 動詞問答句、時間／場所介系詞、形容詞、名詞單複數、可數與不可數名詞、人稱代名詞、指示代名詞、Wh- 疑問詞、There is/are、連接詞 and/but","singles":[{"n":1,"q":"Amy is in the kitchen. She is _____ a cake for her mother.","o":["make","to make","making","makes"],"a":"C","e":"is 後面接現在分詞 V-ing，表示正在進行。"},{"n":2,"q":"_____ the window, please. It's very hot in here.","o":["Opens","Opening","Opened","Open"],"a":"D","e":"祈使句以原形動詞開頭。"},{"n":3,"q":"A: Is your brother at home? B: No, he _____. He is at school.","o":["not","doesn't","aren't","isn't"],"a":"D","e":"主詞 he 搭配 be 動詞 is，否定為 isn't。"},{"n":4,"q":"The movie starts _____ seven o'clock.","o":["on","in","at","of"],"a":"C","e":"幾點鐘前面用 at。"},{"n":5,"q":"Our English class is _____ Monday morning.","o":["at","on","for","in"],"a":"B","e":"星期幾（含星期幾的早上）前面用 on。"},{"n":6,"q":"There are two _____ on the table. They are for Dad's birthday.","o":["box","boxs","boxes","boxies"],"a":"C","e":"名詞字尾為 x 時，複數加 es。"},{"n":7,"q":"I want to eat some _____ for breakfast.","o":["bread","a bread","breads","an egg"],"a":"A","e":"bread 是不可數名詞，前面可用 some，不加 a 也不加 s。"},{"n":8,"q":"This is my sister. _____ name is Lily.","o":["He","Hers","Her","She"],"a":"C","e":"名詞 name 前面用所有格形容詞 her。"},{"n":9,"q":"Look at those boys. _____ are my classmates.","o":["It","This","That","Those"],"a":"D","e":"指遠處的複數人物用 those，動詞 are 也呼應複數。"},{"n":10,"q":"A: _____ is your English teacher? B: Mr. Brown.","o":["Who","When","Where","What"],"a":"A","e":"回答是人名，所以問「誰」用 Who。"},{"n":11,"q":"A: _____ is the library? B: It's next to the post office.","o":["Where","When","Who","What"],"a":"A","e":"回答是位置，所以用 Where 問地點。"},{"n":12,"q":"I have a pen _____ two books in my bag.","o":["or","and","at","but"],"a":"B","e":"兩個都是「我有」的東西，用 and 連接。"},{"n":13,"q":"There _____ a cat under the chair.","o":["is","be","am","are"],"a":"A","e":"a cat 是單數，用 There is。"},{"n":14,"q":"What time _____ it? It's half past nine.","o":["am","be","are","is"],"a":"D","e":"問時間的固定句型是 What time is it?"},{"n":15,"q":"A: Is that your dog? B: Yes, _____.","o":["it isn't","it is","they are","I am"],"a":"B","e":"問句主詞是 that，回答時用 it is。"},{"n":16,"q":"Tina has two _____. They are very cute.","o":["childs","children","childrens","child"],"a":"B","e":"child 的複數是不規則變化 children。"},{"n":17,"q":"Please _____ late for school again, Ken.","o":["no","don't be","don't","not be"],"a":"B","e":"否定祈使句：Don't + 原形動詞；be 動詞原形為 be。"},{"n":18,"q":"A: How are you today? B: _____","o":["I'm Tom.","I'm fine, thanks.","It's Monday.","Yes, I am."],"a":"B","e":"How are you? 是問候語，要回答近況。"},{"n":19,"q":"Dan sees this sign in the park: \"Don't feed the ducks.\" What does it mean?","o":["The ducks are hungry.","People can't give food to the ducks.","People should look at the ducks.","The ducks can't swim here."],"a":"B","e":"feed 是「餵食」，Don't feed 表示不可以餵。"}],"groups":[{"from":20,"to":22,"type":"海報","title":"Sunshine Zoo Open Day","text":"Sunshine Zoo Open Day\nCome and see the animals with your family!\nDate: Saturday, June 10\nTime: 9:00 a.m. - 4:00 p.m.\nTickets: Children $5, Adults $10. Children under three are free.\nToday's fun:\n10:30 - Washing the elephants\n1:30 - Feeding the monkeys\n3:00 - Panda show\nPlease do not bring food into the panda house.","qs":[{"n":20,"q":"When is the Open Day?","o":["At nine o'clock at night.","On Sunday.","On Saturday.","On June 1."],"a":"C","e":"海報寫 Date: Saturday, June 10。"},{"n":21,"q":"Mr. Lee wants to take his two children to the zoo. They are eight and two years old. How much money does he need?","o":["$10","$20","$25","$15"],"a":"D","e":"大人 $10 + 八歲小孩 $5；兩歲小孩免費，共 $15。"},{"n":22,"q":"What can people do at 1:30?","o":["Give food to the monkeys.","See the elephants take a bath.","Eat lunch in the panda house.","Watch the panda show."],"a":"A","e":"1:30 的活動是 Feeding the monkeys。"}]},{"from":23,"to":24,"type":"短文","title":"My Pet","text":"Hi, I'm Kim. I have a pet dog. His name is Coco. He is white and very small. Coco likes balls. Every day after school, I play with him in the park. We are very happy there. Now Coco is sleeping under my bed. He is tired.","qs":[{"n":23,"q":"What is Coco like?","o":["He is small and white.","He is tall and thin.","He is old and black.","He is big and brown."],"a":"A","e":"文中提到 white and very small。"},{"n":24,"q":"What is Coco doing now?","o":["He is eating.","He is running in the park.","He is playing with a ball.","He is sleeping."],"a":"D","e":"Now Coco is sleeping under my bed。"}]},{"from":25,"to":27,"type":"對話","title":"After School","text":"Ben: Mom, where is my schoolbag?\nMom: It's on the sofa, Ben. Are your books in it?\nBen: Yes, they are. Oh, my pencil case is not here.\nMom: Look! There is a pencil case under the table. Is it yours?\nBen: No, it isn't. Mine is blue. That one is red.\nMom: Maybe it's your sister's. Ask her.\nBen: OK. Lisa, is this pencil case yours?\nLisa: Yes, it is! Thank you, Ben. Where is your pencil case?\nBen: Oh, it's in my pocket. I'm so silly!","qs":[{"n":25,"q":"Where is Ben's schoolbag?","o":["In his pocket.","On the sofa.","In Lisa's room.","Under the table."],"a":"B","e":"Mom 說 It's on the sofa。"},{"n":26,"q":"Whose pencil case is red?","o":["Lisa's.","Ben's.","Mom's.","The teacher's."],"a":"A","e":"紅色的鉛筆盒在 Lisa 回答 Yes, it is 之後確認是她的。"},{"n":27,"q":"Why does Ben say, \"I'm so silly!\"?","o":["He can't find his sister.","His books are not in his schoolbag.","His pencil case is in his pocket.","He doesn't like the red pencil case."],"a":"C","e":"他到處找鉛筆盒，卻發現在自己口袋裡，所以說自己很傻。"}]},{"from":28,"to":29,"type":"電子郵件","title":"Hello from Taipei","text":"To: Jenny\nFrom: Mike\nSubject: My new school\nHi Jenny,\nI'm in Taipei now. My new school is big and beautiful. There are twenty classes and eight hundred students. My classroom is on the second floor. My teacher is Ms. Wu. She is kind and funny. I have a new friend, Leo. He is from Taichung. We sit together and eat lunch together. What are you doing now? Please write to me soon.\nMike","qs":[{"n":28,"q":"What is Mike's email about?","o":["His new school.","His trip to Taichung.","His old friend.","His favorite teacher."],"a":"A","e":"信中主要介紹新學校、老師和新朋友，主題是新學校。"},{"n":29,"q":"Which is true about Mike's school?","o":["It is small.","Leo is Mike's teacher.","Mike's classroom is on the first floor.","It has twenty classes."],"a":"D","e":"文中寫 There are twenty classes。"}]},{"from":30,"to":32,"type":"菜單","title":"Daisy Café","text":"Daisy Café\nSandwich $4\nHamburger $5\nSalad $3\nOrange juice $2\nMilk $1\nTea $1\nOpen: Monday to Friday, 8:00 - 5:00","qs":[{"n":30,"q":"Which is the cheapest?","o":["A glass of milk.","A salad.","A glass of orange juice.","A hamburger."],"a":"A","e":"牛奶和茶都是 $1，選項中只有牛奶是 $1，最便宜。"},{"n":31,"q":"Tina has $8. What can she buy?","o":["A hamburger and a sandwich.","A sandwich, a salad, and orange juice.","A hamburger and a salad.","Two hamburgers."],"a":"C","e":"漢堡 $5 + 沙拉 $3 = $8，剛好。"},{"n":32,"q":"When is Daisy Café open?","o":["On weekends.","On Monday evenings.","From Monday to Friday.","Every day of the week."],"a":"C","e":"菜單寫 Monday to Friday。"}]},{"from":33,"to":34,"type":"公告","title":"Lost Dog","text":"Lost Dog!\nMy dog Lucky is not at home. He is small and brown. He has a red ball in his mouth. He is only two years old. He likes people very much. Please call me at 0912-345-678 if you see him.\nTom Chen","qs":[{"n":33,"q":"What does Lucky look like?","o":["He is old and thin.","He is big and white.","He has a blue hat.","He is small and brown."],"a":"D","e":"公告寫 small and brown。"},{"n":34,"q":"What should people do if they see Lucky?","o":["Look for Tom's house.","Call Tom.","Give him a red ball.","Take him home."],"a":"B","e":"公告最後請看到的人打電話給 Tom。"}]},{"from":35,"to":37,"type":"短文","title":"A Day at the Park","text":"Today is Sunday. The weather is sunny, so Anna and her family are at the park. Her father is under a big tree. He is reading a newspaper. Her mother is taking pictures of the flowers. Anna's little brother, Joe, is playing with a kite. He is running in the grass, but the kite isn't flying. Anna is helping him. At noon, they eat lunch on the grass. There are sandwiches, apples, and milk. Everyone is very happy.","qs":[{"n":35,"q":"Who is reading a newspaper?","o":["Anna's mother.","Joe.","Anna.","Anna's father."],"a":"D","e":"Her father ... is reading a newspaper。"},{"n":36,"q":"What is Anna doing?","o":["She is eating lunch alone.","She is flying a kite.","She is helping Joe.","She is taking pictures."],"a":"C","e":"文中寫 Anna is helping him。"},{"n":37,"q":"What do they have for lunch?","o":["Hamburgers and juice.","Sandwiches, apples, and milk.","Rice and eggs.","Noodles and tea."],"a":"B","e":"文中列出 sandwiches, apples, and milk。"}]},{"from":38,"to":43,"type":"填空","title":"Dear Grandma","text":"Dear Grandma,\nHow __38__ you? I'm very well. Today I'm at Aunt Lisa's house. It is __39__ Taipei. __40__ house is big, and it has a garden. There __41__ many flowers in the garden. My cousin Amy and I are playing games __42__ the garden now. Aunt Lisa is cooking dinner. We like her food, __43__ my cousin doesn't like fish.\nLove,\nJim","qs":[{"n":38,"q":"","o":["am","be","is","are"],"a":"D","e":"you 搭配 are。"},{"n":39,"q":"","o":["on","to","in","at"],"a":"C","e":"在某個城市用 in。"},{"n":40,"q":"","o":["Hers","He","Her","She"],"a":"C","e":"house 前面需要所有格形容詞，指 Aunt Lisa 的房子，用 Her。"},{"n":41,"q":"","o":["are","am","is","be"],"a":"A","e":"many flowers 是複數，用 There are。"},{"n":42,"q":"","o":["of","at","on","in"],"a":"D","e":"在花園「裡面」玩，用 in the garden。"},{"n":43,"q":"","o":["or","but","and","so"],"a":"B","e":"前句「我們喜歡她的菜」，後句「表妹不喜歡魚」，語意轉折，用 but。"}]}]},{"n":2,"kind":"分冊複習・第2冊","scope":"現在簡單式、過去簡單式（be 動詞）、助動詞 can 問答句、數量形容詞、When／Which 問答句、How many／How much、連接詞 or、詢問時間和星期、序數、頻率副詞","singles":[{"n":1,"q":"My father _____ up at six every morning and makes breakfast for us.","o":["getting","get","to get","gets"],"a":"D","e":"主詞 My father 是第三人稱單數，現在簡單式動詞加 s。"},{"n":2,"q":"A: _____ you play the piano? B: Yes, I can. I play it every day.","o":["Do","Are","Does","Can"],"a":"D","e":"回答 Yes, I can，所以問句是 Can you...?"},{"n":3,"q":"The weather _____ cold yesterday, so we stayed at home.","o":["be","were","is","was"],"a":"D","e":"yesterday 表示過去，the weather 是單數，用 was。"},{"n":4,"q":"There is _____ juice in the bottle. Let's buy some more.","o":["little","any","a few","many"],"a":"A","e":"juice 是不可數名詞，且「所以要多買一些」表示幾乎沒有，用 little。"},{"n":5,"q":"A: _____ do you have your piano lesson? B: On Wednesday afternoon.","o":["Which","Who","When","Where"],"a":"C","e":"回答是時間，用 When 詢問。"},{"n":6,"q":"A: _____ books do you have in your bag? B: Five.","o":["How old","How long","How much","How many"],"a":"D","e":"books 是可數名詞，問數量用 How many。"},{"n":7,"q":"A: _____ do you like better, tea or coffee? B: Tea, please.","o":["Which","Who","When","What"],"a":"A","e":"在 tea 與 coffee 兩者之間選擇，用 Which。"},{"n":8,"q":"You can take the bus _____ ride a bike to school. Both ways are fast.","o":["so","but","and","or"],"a":"D","e":"兩種方式選一種，用 or。"},{"n":9,"q":"February is the _____ month of the year.","o":["twelve","two","second","twice"],"a":"C","e":"表示順序用序數 second。"},{"n":10,"q":"Ann _____ goes to the library on Sundays. She goes there almost every week.","o":["seldom","often","hardly","never"],"a":"B","e":"almost every week 表示頻率高，用 often。"},{"n":11,"q":"A: What day is it today? B: It's _____. Tomorrow is Saturday.","o":["Sunday","Monday","Friday","Thursday"],"a":"C","e":"明天是星期六，所以今天是星期五。"},{"n":12,"q":"Peter wasn't at school yesterday. He _____ sick.","o":["was","weren't","is","be"],"a":"A","e":"yesterday 表示過去，he 搭配 was。"},{"n":13,"q":"We _____ any money in our pockets now. Let's ask Dad for some.","o":["don't have","have","has","doesn't have"],"a":"A","e":"後面有 any 且語意為「沒有錢」，主詞 We 用 don't have。"},{"n":14,"q":"Does Linda have _____ brothers?","o":["a","any","much","some"],"a":"B","e":"疑問句中表示「一些」用 any，brothers 是複數可數名詞。"},{"n":15,"q":"A: What time does the movie start? B: At a _____ to eight.","o":["past","clock","half","quarter"],"a":"D","e":"a quarter to eight 是七點四十五分。"},{"n":16,"q":"I have _____ friends in this city, so I feel lonely.","o":["a little","little","few","a few"],"a":"C","e":"因為覺得孤單，表示朋友幾乎沒有，用 few（可數、否定意味）。"},{"n":17,"q":"A: Which bag is yours, the red one or the blue one? B: _____","o":["It's Mary's.","Yes, it is.","I like red.","The blue one."],"a":"D","e":"Which 問句要從選項中選一個來回答。"},{"n":18,"q":"They _____ in Japan last year. Now they are in Taiwan.","o":["were","be","are","was"],"a":"A","e":"last year 表示過去，主詞 They 用 were。"},{"n":19,"q":"The sign in front of the shop says: \"Open 10 a.m. - 8 p.m. every day except Tuesday.\" When is the shop closed?","o":["At 9 a.m. only.","Every day.","On weekends.","On Tuesday."],"a":"D","e":"except Tuesday 表示星期二以外都開，所以星期二休息。"}],"groups":[{"from":20,"to":22,"type":"傳單","title":"Green Library Book Sale","text":"Green Library Book Sale\nDo you have a lot of old books at home? Bring them to Green Library, and give them a second life!\nDates: August 12, 13, and 14\nHours: 9:00 a.m. - 5:00 p.m.\nPrice: Storybooks $2, Dictionaries $5, Comic books $1\nBring ten books, and you can get one storybook for free.\nAll the money goes to the children's hospital.","qs":[{"n":20,"q":"How long is the book sale?","o":["Four days.","One day.","Three days.","Two days."],"a":"C","e":"8 月 12、13、14 日，共三天。"},{"n":21,"q":"Ben buys two comic books and one dictionary. How much does he pay?","o":["$6","$7","$8","$12"],"a":"B","e":"兩本漫畫 $2 加一本字典 $5，共 $7。"},{"n":22,"q":"What can people do with the money from the sale?","o":["Help the children's hospital.","Buy more books for Green Library.","Give a free storybook to everyone.","Open a new bookstore."],"a":"A","e":"傳單最後說所有收入給兒童醫院。"}]},{"from":23,"to":24,"type":"短文","title":"Kevin's Saturday","text":"Kevin usually gets up at eight o'clock on Saturday. After breakfast, he often plays basketball with his friends in the park. They play for two hours. Then he goes home and takes a shower. In the afternoon, he sometimes does his homework or watches TV. But today is different. It is rainy, and Kevin is at home all day. He is bored, so he reads an English book. It is very interesting, and he can't stop reading.","qs":[{"n":23,"q":"What does Kevin usually do on Saturday morning?","o":["He plays basketball.","He watches TV.","He reads an English book.","He does his homework."],"a":"A","e":"文中說 he often plays basketball with his friends。"},{"n":24,"q":"Why does Kevin read an English book today?","o":["He needs it for his homework.","It is rainy, and he is bored.","His friends are not at home.","His teacher asks him to read it."],"a":"B","e":"今天下雨，他在家很無聊，所以讀書。"}]},{"from":25,"to":27,"type":"對話","title":"Planning a Party","text":"Amy: Lucy's birthday is next Friday. Let's have a party for her.\nJack: Good idea! Which place is better, her house or the park?\nAmy: The park is better. It's big, and the weather is nice in October.\nJack: OK. What time is the party?\nAmy: At four o'clock. School ends at three, so we have enough time.\nJack: How many people are coming?\nAmy: About ten. Can you bring some drinks?\nJack: Sure. How many bottles do we need?\nAmy: Two or three bottles are enough. Oh, and I can make a cake.\nJack: Great! Lucy will love it.","qs":[{"n":25,"q":"Where will they have the party?","o":["At Lucy's house.","In the park.","At school.","At Jack's house."],"a":"B","e":"Amy 說公園比較好，兩人決定在公園。"},{"n":26,"q":"What will Jack do for the party?","o":["Call ten people.","Make a cake.","Bring some drinks.","Buy a present."],"a":"C","e":"Amy 請 Jack 帶一些飲料。"},{"n":27,"q":"Which is true about the party?","o":["About ten people are coming.","It starts at three.","It is on Saturday.","They need ten bottles."],"a":"A","e":"Jack 問人數，Amy 回答 About ten。"}]},{"from":28,"to":29,"type":"規則","title":"Swimming Pool Rules","text":"Swimming Pool Rules\n1. Take a shower before you swim.\n2. Do not run around the pool.\n3. Children under ten must swim with an adult.\n4. Do not eat or drink in the water.\n5. The pool is open from 9:00 a.m. to 6:00 p.m. It is closed on the first Monday of every month.","qs":[{"n":28,"q":"Who must swim with an adult?","o":["People who are ten or older.","Children under ten.","Anyone who can't swim.","Teachers."],"a":"B","e":"規則 3 說十歲以下的小孩要有大人陪同。"},{"n":29,"q":"Which is NOT allowed at the pool?","o":["Going there on the second Monday of the month.","Running around the pool.","Swimming at five o'clock.","Taking a shower before swimming."],"a":"B","e":"規則 2 禁止在池邊奔跑；A、B、C 都是允許的。"}]},{"from":30,"to":32,"type":"課表","title":"After-School Clubs","text":"After-School Clubs\nMonday: Art Club, 3:30 - 4:30\nTuesday: Basketball Club, 3:30 - 5:00\nWednesday: Music Club, 4:00 - 5:00\nThursday: Cooking Club, 3:30 - 5:30\nFriday: No clubs\nTip: Students can join two clubs. Please bring a bottle of water.","qs":[{"n":30,"q":"Which club meets for the longest time?","o":["Art Club.","Cooking Club.","Music Club.","Basketball Club."],"a":"B","e":"Cooking Club 有兩小時，最長。"},{"n":31,"q":"On which day are there no clubs?","o":["Friday.","Thursday.","Wednesday.","Monday."],"a":"A","e":"課表寫 Friday: No clubs。"},{"n":32,"q":"What should students bring to the clubs?","o":["A ball.","Some food.","Some books.","A bottle of water."],"a":"D","e":"Tip 中要求帶一瓶水。"}]},{"from":33,"to":34,"type":"電子郵件","title":"Come to My House","text":"To: Sally\nFrom: Emma\nSubject: Weekend party\nDear Sally,\nAre you free this weekend? I'm having a small party at my house on Saturday. It starts at two in the afternoon. There are five of us: Mia, Joy, Cathy, you, and me. We can watch a movie and eat pizza. My mom can make a big chocolate cake, too. Please tell me if you can come.\nEmma","qs":[{"n":33,"q":"Why does Emma write to Sally?","o":["To ask her to bring a cake.","To say sorry to her.","To tell her about a movie.","To invite her to a party."],"a":"D","e":"信中邀請 Sally 週末到家裡參加聚會。"},{"n":34,"q":"How many people are at the party?","o":["Five.","Six.","Seven.","Four."],"a":"A","e":"文中說 There are five of us。"}]},{"from":35,"to":37,"type":"短文","title":"Grandpa's Garden","text":"My grandpa has a small garden behind his house. He grows vegetables and fruit there. There are many tomatoes, some carrots, and a few apple trees. Grandpa works in the garden every morning. He often says, \"A garden needs your time.\" This summer, I am at his house for two weeks. It is very hot, but I like the days here. I help him water the plants and pick the tomatoes. In the evening, we eat fresh vegetables for dinner. They taste so good! Next year, I want to come here again.","qs":[{"n":35,"q":"Where is Grandpa's garden?","o":["In the park.","Next to a school.","In front of his house.","Behind his house."],"a":"D","e":"文中第一句 behind his house。"},{"n":36,"q":"How often does Grandpa work in the garden?","o":["Every evening.","Every morning.","On summer days only.","Once a week."],"a":"B","e":"Grandpa works in the garden every morning。"},{"n":37,"q":"What can we learn about the writer?","o":["He grows apple trees.","He doesn't like fresh vegetables.","He is staying with Grandpa for two weeks.","He never helps Grandpa."],"a":"C","e":"文中說 I am at his house for two weeks。"}]},{"from":38,"to":43,"type":"填空","title":"A Trip to Kenting","text":"I am in Kenting with my family now. We are here __38__ three days. Today we are at the beach. The sea __39__ blue, and the sand is white. My little sister __40__ swim, but she likes to play in the sand. Tomorrow we visit a famous night market. There __41__ always a lot of people there, so we must wait a long time for food. I want ten pieces of fried chicken, __42__ my brother wants two bowls of noodles. __43__ is your favorite place in Taiwan? Please write to me.","qs":[{"n":38,"q":"","o":["in","at","for","on"],"a":"C","e":"for three days 表示「為期三天」。"},{"n":39,"q":"","o":["am","is","are","be"],"a":"B","e":"the sea 是單數，現在式 be 動詞用 is。"},{"n":40,"q":"","o":["can't","can not to","doesn't can","not can"],"a":"A","e":"can 的否定是 can't，後面接原形動詞 swim。"},{"n":41,"q":"","o":["am","are","is","be"],"a":"B","e":"a lot of people 指許多人，動詞用複數 are。"},{"n":42,"q":"","o":["if","or","and","so"],"a":"C","e":"我想吃雞排，弟弟想吃麵，是並列關係，用 and。"},{"n":43,"q":"","o":["Who","When","What","Where"],"a":"C","e":"What is your favorite place...? 是「你最喜歡的地方是什麼」。"}]}]},{"n":3,"kind":"分冊複習・第1～2冊","scope":"祈使句、現在進行式與現在簡單式、過去簡單式（be 動詞）、can 問答句、時間／場所介系詞、數量形容詞、名詞單複數、可數與不可數名詞、人稱／指示代名詞、Wh- 疑問詞、How many／How much、and／but／or、There is/are、時間與星期、序數、頻率副詞","singles":[{"n":1,"q":"Please _____ quiet in the library. Some students are reading.","o":["being","are","be","is"],"a":"C","e":"祈使句要用原形動詞，be 動詞的原形是 be。"},{"n":2,"q":"Look! The girls _____ in the park. They are having a good time.","o":["dance","danced","dances","are dancing"],"a":"D","e":"Look! 提示動作正在進行，用現在進行式。"},{"n":3,"q":"My uncle _____ in a bank. He works from Monday to Friday.","o":["is work","work","working","works"],"a":"D","e":"描述固定的工作，主詞是第三人稱單數，動詞加 s。"},{"n":4,"q":"Mr. Chen _____ a teacher five years ago. Now he is a doctor.","o":["was","be","were","is"],"a":"A","e":"five years ago 表示過去，主詞 Mr. Chen 用 was。"},{"n":5,"q":"A: _____ is your birthday? B: It's on September 18.","o":["How","When","Who","Where"],"a":"B","e":"回答是日期，問「何時」用 When。"},{"n":6,"q":"My house is _____ the bank and the post office. It's easy to find.","o":["between","across","behind","from"],"a":"A","e":"between A and B 表示在兩者之間。"},{"n":7,"q":"There aren't _____ eggs in the fridge. Let's go and buy some.","o":["much","any","a","some"],"a":"B","e":"否定句中表示「任何」用 any，eggs 是複數。"},{"n":8,"q":"_____ is my English teacher. I like _____ very much.","o":["She; she","She; her","Her; her","He; he"],"a":"B","e":"第一格用主格 She，第二格作動詞 like 的受詞，用受格 her。"},{"n":9,"q":"These _____ my friends. Those _____ my brother's friends.","o":["is; are","is; is","are; are","are; is"],"a":"C","e":"These 和 Those 都是複數，要搭配 are。"},{"n":10,"q":"A: _____ does your mother go shopping? B: Twice a week.","o":["How many","How much","How long","How often"],"a":"D","e":"回答是頻率 twice a week，用 How often。"},{"n":11,"q":"Jerry can't _____ a bike, but he can ride a horse.","o":["ride","rides","to ride","riding"],"a":"A","e":"can't 後面接原形動詞。"},{"n":12,"q":"It's ten _____ six. We have to go now.","o":["to","of","in","at"],"a":"A","e":"ten to six 是五點五十分。"},{"n":13,"q":"Two _____ are playing basketball on the court.","o":["men","mens","man","mans"],"a":"A","e":"man 的複數是不規則變化 men。"},{"n":14,"q":"We have _____ homework today, so we can go out and play.","o":["many","an","a few","a little"],"a":"D","e":"homework 是不可數名詞，「一點點」用 a little。"},{"n":15,"q":"Dad _____ the newspaper every morning. He doesn't watch TV.","o":["read","is reading","reading","reads"],"a":"D","e":"every morning 表示習慣，第三人稱單數用 reads。"},{"n":16,"q":"The fifth month of the year is _____.","o":["June","March","May","April"],"a":"C","e":"一年的第五個月是五月。"},{"n":17,"q":"A: Is there a bank near here? B: _____","o":["Yes, there is.","Yes, there are.","Yes, it is.","Yes, they are."],"a":"A","e":"問句是 Is there...?，肯定回答用 Yes, there is."},{"n":18,"q":"I like my room, _____ it is a little small.","o":["but","or","so","and"],"a":"A","e":"喜歡房間，但房間有點小，語意轉折，用 but。"},{"n":19,"q":"A shop has a sign: \"Buy one hamburger, get one free.\" Mary wants two hamburgers. How many does she pay for?","o":["Two.","One.","None.","Three."],"a":"B","e":"買一送一，要兩個只需付一個的錢。"}],"groups":[{"from":20,"to":22,"type":"廣告","title":"Happy Pet Shop","text":"Happy Pet Shop\nDogs, cats, birds, and fish - we have them all!\nOpening Hours: Tuesday to Sunday, 10:00 a.m. - 8:00 p.m.\nClosed on Mondays\nSpecial Offer: Buy a fish bowl and get three goldfish for free!\nDog food: $12 per bag\nCat food: $10 per bag\nBird food: $6 per bag\nFree class for new pet owners every Saturday at 3:00 p.m.","qs":[{"n":20,"q":"When is the pet shop closed?","o":["On Sundays.","After 6 p.m.","On Saturdays.","On Mondays."],"a":"D","e":"廣告寫 Closed on Mondays。"},{"n":21,"q":"Tom has a dog and a bird. He buys food for them. How much does he pay?","o":["$16","$18","$20","$22"],"a":"B","e":"狗飼料 $12 加鳥飼料 $6，共 $18。"},{"n":22,"q":"What can new pet owners do on Saturday?","o":["Get a free fish bowl.","Take a free class.","Buy a pet for half price.","Play with the dogs for free."],"a":"B","e":"每週六下午三點有新手飼主的免費課程。"}]},{"from":23,"to":24,"type":"短文","title":"Sally's Family","text":"There are five people in Sally's family: her parents, her older brother, her little sister, and Sally. Sally's father is a bus driver. He gets up at five o'clock every morning. Her mother is a nurse. She works at night, so she sleeps in the morning. Sally's brother, Jack, is fifteen. He is a good basketball player. Sally's little sister is only three. She is very cute. Sally loves her family very much.","qs":[{"n":23,"q":"Which of the following is true?","o":["Jack is three years old.","Sally's mother works at night.","Sally's father gets up late.","Sally's sister is a basketball player."],"a":"B","e":"文中說媽媽晚上工作，所以早上睡覺。"},{"n":24,"q":"Who is the youngest in Sally's family?","o":["Jack.","Sally.","Sally's little sister.","Sally's mother."],"a":"C","e":"小妹妹只有三歲，是年紀最小的。"}]},{"from":25,"to":27,"type":"對話","title":"In the Library","text":"Tina: Excuse me, where is the English dictionary?\nMr. Lin: It's on the third floor, next to the computers.\nTina: Thanks. Can I read it here?\nMr. Lin: Yes, you can. But you can't take it home.\nTina: That's OK. I only need it for ten minutes. By the way, what time does the library close?\nMr. Lin: At six on weekdays. But on Saturday and Sunday, it closes at four.\nTina: Is it open on Monday?\nMr. Lin: Yes, it is. It is closed only on national holidays.\nTina: Thank you very much!","qs":[{"n":25,"q":"Where is the English dictionary?","o":["On the first floor.","Next to the door.","On the third floor.","Behind Mr. Lin."],"a":"C","e":"Mr. Lin 說在三樓，電腦旁邊。"},{"n":26,"q":"What can Tina do with the dictionary?","o":["Buy it from Mr. Lin.","Give it to a friend.","Read it in the library.","Take it home."],"a":"C","e":"Can I read it here? Yes, you can。"},{"n":27,"q":"When does the library close on Sunday?","o":["At seven.","At five.","At four.","At six."],"a":"C","e":"週末是四點閉館。"}]},{"from":28,"to":29,"type":"電子郵件","title":"My New Pet","text":"To: Aunt May\nFrom: Ken\nSubject: A new friend\nDear Aunt May,\nHow are you? I have a new pet now! It is a rabbit. Her name is Snow. She is white, and she has two big ears. She likes carrots and lettuce. Every afternoon, I play with her in the yard. My sister doesn't like her because Snow eats her flowers! Please come to see Snow this weekend.\nLove, Ken","qs":[{"n":28,"q":"Why does Ken write to Aunt May?","o":["To invite her to a birthday party.","To say hello and tell her about his pet.","To say sorry to his sister.","To ask her for some carrots."],"a":"B","e":"信中問候並介紹新寵物，最後邀請她來看。"},{"n":29,"q":"Why doesn't Ken's sister like Snow?","o":["Snow is very big.","Snow bites people.","Snow eats her flowers.","Snow is always noisy."],"a":"C","e":"文中說 Snow eats her flowers。"}]},{"from":30,"to":32,"type":"天氣表","title":"Weather This Week","text":"Weather This Week\nMonday: sunny, 30°C\nTuesday: cloudy, 27°C\nWednesday: rainy, 24°C\nThursday: rainy, 23°C\nFriday: sunny, 29°C\nSaturday: windy, 26°C\nSunday: sunny, 31°C","qs":[{"n":30,"q":"Which day is the coldest?","o":["Tuesday.","Wednesday.","Saturday.","Thursday."],"a":"D","e":"Thursday 是 23°C，最低。"},{"n":31,"q":"How many rainy days are there this week?","o":["Two.","Three.","One.","Four."],"a":"A","e":"Wednesday 和 Thursday 兩天是雨天。"},{"n":32,"q":"Anna wants to fly a kite. Which day is the best?","o":["Saturday.","Friday.","Wednesday.","Monday."],"a":"A","e":"放風箏需要有風，Saturday 是 windy。"}]},{"from":33,"to":34,"type":"公告","title":"School Trip","text":"Notice\nOur class trip is next Friday, October 20. We are going to the Science Museum.\nThe bus leaves school at 8:00 a.m. Please be at school at 7:45.\nBring: lunch, water, and a notebook.\nDo not bring: snacks or phones.\nWe come back to school at 4:30 p.m.\nMr. Wang","qs":[{"n":33,"q":"What time should students be at school on October 20?","o":["At 7:30.","At 8:00.","At 7:45.","At 4:30."],"a":"C","e":"公告要求七點四十五分到校。"},{"n":34,"q":"What can students bring?","o":["A notebook.","A phone.","Some snacks.","A game."],"a":"A","e":"公告列出可帶 lunch, water, notebook。"}]},{"from":35,"to":37,"type":"短文","title":"A Busy Morning","text":"It is seven o'clock in the morning. The Lee family is very busy. Mr. Lee is making breakfast in the kitchen. He is cooking eggs and making sandwiches. Mrs. Lee is looking for her car keys. She can't find them. Their son, Dan, is brushing his teeth. Their daughter, Amy, is still sleeping. Mr. Lee says, \"Amy, get up! It's time for school!\" Amy opens her eyes and says, \"Dad, is it Sunday?\" Mr. Lee laughs. \"No, it isn't. Today is Monday.\"","qs":[{"n":35,"q":"What is Mr. Lee doing?","o":["He is looking for his keys.","He is cooking breakfast.","He is waking up.","He is brushing his teeth."],"a":"B","e":"爸爸正在廚房煮蛋、做三明治。"},{"n":36,"q":"What is Mrs. Lee looking for?","o":["Her bag.","Her keys.","Her phone.","Her son."],"a":"B","e":"She is looking for her car keys。"},{"n":37,"q":"What does Amy think?","o":["She thinks breakfast is ready.","She thinks it is Sunday.","She thinks she is late.","She thinks it is time for school."],"a":"B","e":"Amy 問 is it Sunday?，表示她以為是星期天。"}]},{"from":38,"to":43,"type":"填空","title":"My Best Friend","text":"Hello! My name is Kelly. I want to tell you about my best friend, Joy. She is thirteen years old, and she is in my class. Joy __38__ a lot of books. She is very smart, __39__ she is not proud. There __40__ many books in her room. Last week, she was sick, but this week she is fine. __41__ Saturday, we usually go to the library together. __42__ do we read there? We read story books and magazines. After that, we often have lunch __43__ a small restaurant near the library.","qs":[{"n":38,"q":"","o":["read","reading","to read","reads"],"a":"D","e":"Joy 是第三人稱單數，現在簡單式動詞加 s。"},{"n":39,"q":"","o":["or","because","but","so"],"a":"C","e":"她很聰明，但不驕傲，語意轉折，用 but。"},{"n":40,"q":"","o":["are","be","is","am"],"a":"A","e":"many books 是複數，用 There are。"},{"n":41,"q":"","o":["For","On","In","At"],"a":"B","e":"星期幾前面用 on。"},{"n":42,"q":"","o":["Where","When","What","Who"],"a":"C","e":"回答是 story books and magazines，所以問 What do we read there?"},{"n":43,"q":"","o":["of","in","on","at"],"a":"D","e":"在餐廳用餐，表示場所用 at a small restaurant。"}]}]},{"n":4,"kind":"分冊複習・第3冊","scope":"過去簡單式（一般動詞）、過去進行式、未來式（will／be going to）、比較級與最高級、不定詞、動名詞、助動詞（should／must／have to／may）、連接詞（when／because／if／before／after）、不規則動詞","singles":[{"n":1,"q":"Last Sunday, my family _____ to the beach by car.","o":["goes","go","going","went"],"a":"D","e":"Last Sunday 表示過去，go 的過去式是 went。"},{"n":2,"q":"A: What were you doing at nine last night? B: I _____ a movie with my sister.","o":["watch","watched","was watching","am watching"],"a":"C","e":"過去某一時間點正在進行的動作，用過去進行式。"},{"n":3,"q":"Look at those dark clouds. It _____ rain soon.","o":["was going to","is going to","goes to","went to"],"a":"B","e":"根據眼前的烏雲預測即將下雨，用 be going to，現在時間用 is。"},{"n":4,"q":"Tom is _____ than his brother, but his brother runs faster.","o":["tall","tallest","taller","the tallest"],"a":"C","e":"兩人比較，用比較級 taller。"},{"n":5,"q":"My grandmother wants _____ a trip to Japan next month.","o":["to take","taking","take","takes"],"a":"A","e":"want 後面接不定詞 to + 原形動詞。"},{"n":6,"q":"Mary enjoys _____ pictures of flowers in the park.","o":["took","taking","to take","take"],"a":"B","e":"enjoy 後面接動名詞 V-ing。"},{"n":7,"q":"You _____ eat too much candy. It's bad for your teeth.","o":["may","can","shouldn't","should"],"a":"C","e":"糖果對牙齒不好，所以「不應該」吃太多，用 shouldn't。"},{"n":8,"q":"I was washing the dishes _____ the phone rang.","o":["so","because","if","when"],"a":"D","e":"洗碗的時候電話響了，用 when 連接兩個動作。"},{"n":9,"q":"Jack didn't _____ his homework yesterday, so the teacher was angry.","o":["does","did","doing","do"],"a":"D","e":"didn't 後面要接原形動詞 do。"},{"n":10,"q":"Of the three boys, Peter is _____ student in our class.","o":["best","better","the best","good"],"a":"C","e":"三者以上的比較用 the + 最高級，good 的最高級是 the best。"},{"n":11,"q":"We will have a picnic tomorrow if it _____ rain.","o":["doesn't","didn't","isn't","won't"],"a":"A","e":"if 子句表示未來的條件時用現在式，所以用 doesn't rain。"},{"n":12,"q":"A: Did you see Amy at the party? B: No, I _____.","o":["didn't","wasn't","don't","haven't"],"a":"A","e":"問句用 Did，簡答也用 didn't。"},{"n":13,"q":"This movie is _____ interesting than that one. Let's watch it.","o":["most","much","more","very"],"a":"C","e":"interesting 是多音節形容詞，比較級用 more interesting。"},{"n":14,"q":"After he _____ breakfast, he went to school.","o":["having","has","have","had"],"a":"D","e":"過去的兩個連續動作，用過去式 had。"},{"n":15,"q":"It is dangerous _____ in the river. You must not do that.","o":["swim","swims","swam","to swim"],"a":"D","e":"It is + 形容詞 + to V，用不定詞 to swim。"},{"n":16,"q":"A: Why was Ben late for school? B: _____ he missed the bus.","o":["If","Because","But","Before"],"a":"B","e":"回答原因，用 Because。"},{"n":17,"q":"My sister bought a dress, but she _____ buy any shoes.","o":["didn't","wasn't","doesn't","isn't"],"a":"A","e":"前面 bought 是過去式，所以否定用 didn't。"},{"n":18,"q":"Don't worry. I _____ help you with your English tomorrow.","o":["did","was","am","will"],"a":"D","e":"tomorrow 表示未來，要用 will。"},{"n":19,"q":"A sign in a park says: \"Please do not feed the ducks.\" What does the sign mean?","o":["You should take the ducks home.","You can give food to the ducks.","You have to feed the ducks.","You must not give food to the ducks."],"a":"D","e":"do not feed 表示禁止餵鴨子。"}],"groups":[{"from":20,"to":22,"type":"海報","title":"Summer Swimming Camp","text":"Summer Swimming Camp\nDo you want to learn to swim? Join our camp this July!\nDates: July 10 - July 14 (Monday to Friday)\nTime: 9:00 a.m. - 11:00 a.m.\nPlace: Sunshine Swimming Pool\nFee: $1,200 for one student\nSpecial offer: Two friends sign up together, and each pays only $1,000.\nBring a swimming cap, a towel, and a bottle of water.\nSign up before June 30. Call Ms. Hsu at 2345-6789.","qs":[{"n":20,"q":"How long does the camp last?","o":["Five days.","Two days.","Seven days.","Three days."],"a":"A","e":"從 Monday 到 Friday，共五天。"},{"n":21,"q":"Amy and her friend sign up together. How much does Amy pay?","o":["$1,000","$1,200","$2,000","$2,400"],"a":"A","e":"兩人一起報名，每人只付 $1,000。"},{"n":22,"q":"What should students do before June 30?","o":["Buy a swimming cap.","Sign up for the camp.","Bring a towel to the pool.","Learn to swim."],"a":"B","e":"海報寫 Sign up before June 30。"}]},{"from":23,"to":24,"type":"短文","title":"Dave's Weekend","text":"Last Saturday, Dave got up early. He wanted to ride his bike to a lake with his friends. But when he opened the door, it was raining hard. Dave was sad. He called his friends and they decided to meet at the movie theater instead. They watched a funny movie and had pizza after that. In the evening, the rain stopped. Dave went home and played video games. He thought it was a great day.","qs":[{"n":23,"q":"Why did Dave and his friends go to the movie theater?","o":["Dave's bike was broken.","They wanted to eat pizza.","It was raining hard.","They didn't like the lake."],"a":"C","e":"因為下大雨，原本騎車去湖邊的計畫改變。"},{"n":24,"q":"What did Dave do after he got home?","o":["He played video games.","He had pizza.","He watched a movie.","He rode his bike."],"a":"A","e":"晚上回家後他玩電動。"}]},{"from":25,"to":27,"type":"對話","title":"Planning a Trip","text":"Lisa: Are you going to do anything this weekend, Ben?\nBen: Yes. I'm going to visit my grandparents in Tainan. How about you?\nLisa: I'm going to stay at home. My cat is sick, so I have to take her to the animal hospital.\nBen: I'm sorry to hear that. I hope she gets better soon.\nLisa: Thanks. Are you going to take the train to Tainan?\nBen: No. The train tickets are sold out. I'll take the bus. It takes about four hours.\nLisa: That's a long ride. You should bring some snacks and a book.\nBen: Good idea! I'll do that.","qs":[{"n":25,"q":"What is Ben going to do this weekend?","o":["Take his cat to the hospital.","Buy some train tickets.","Visit his grandparents.","Stay at home."],"a":"C","e":"Ben 說要去台南看祖父母。"},{"n":26,"q":"Why will Ben take the bus?","o":["The bus is cheaper.","The train tickets are sold out.","The bus is faster.","He doesn't like the train."],"a":"B","e":"火車票賣完了，所以搭巴士。"},{"n":27,"q":"What does Lisa suggest Ben do?","o":["Bring snacks and a book.","Buy a gift for his grandparents.","Take the cat with him.","Go to Tainan by train."],"a":"A","e":"Lisa 說 You should bring some snacks and a book。"}]},{"from":28,"to":29,"type":"電子郵件","title":"A New School","text":"To: Cindy\nFrom: Emma\nSubject: My first week\nHi Cindy,\nI miss you! My new school in Taichung is bigger than our old school. There are more than 1,000 students here. At first, I was nervous because I didn't know anyone. But on the second day, a girl named Grace sat next to me at lunch. She was very friendly. Now we are good friends. She is going to take me to the school's art club tomorrow. I hope I can make more friends there. Write back soon!\nEmma","qs":[{"n":28,"q":"What is Emma's letter mainly about?","o":["Her trip to Taichung.","Her new school life.","Her old school.","Her art class."],"a":"B","e":"信中介紹新學校的生活與交朋友。"},{"n":29,"q":"What will Emma do tomorrow?","o":["Meet her old teacher.","Write a letter to Grace.","Go to the art club with Grace.","Eat lunch with Cindy."],"a":"C","e":"Grace 明天要帶她去美術社。"}]},{"from":30,"to":32,"type":"時間表","title":"Bus Schedule","text":"Bus No. 5 Schedule (From City Hall to the Zoo)\nCity Hall: 8:00 / 9:00 / 10:00 / 11:00\nCentral Park: 8:15 / 9:15 / 10:15 / 11:15\nZoo: 8:40 / 9:40 / 10:40 / 11:40\nThe bus ride from City Hall to the zoo takes forty minutes.\nTickets: $20 for adults, $10 for children","qs":[{"n":30,"q":"Tina is at Central Park at 9:00. When can she take the next bus to the zoo?","o":["At 9:40.","At 9:15.","At 10:15.","At 10:00."],"a":"B","e":"公車 9:15 抵達中央公園，是 Tina 可以搭的下一班。"},{"n":31,"q":"How much do two adults and one child pay?","o":["$30","$40","$50","$60"],"a":"C","e":"兩位大人 $40 加一位小孩 $10，共 $50。"},{"n":32,"q":"What time does the bus get to the zoo if it leaves City Hall at 10:00?","o":["At 10:40.","At 10:15.","At 11:40.","At 10:30."],"a":"A","e":"十點出發，經過四十分鐘，抵達動物園是 10:40。"}]},{"from":33,"to":34,"type":"公告","title":"Lost Dog","text":"Lost Dog\nMy dog, Coco, was lost yesterday afternoon near Green Park. She is a small brown dog with a red collar. She is two years old and very friendly. She likes to play with children and eat bananas. If you see her, please call me at 0912-345-678. I will give you $500 to say thank you.\nJenny Lin","qs":[{"n":33,"q":"What is Coco like?","o":["An old yellow dog.","A small brown dog.","A small black cat.","A big white dog."],"a":"B","e":"公告描述 Coco 是一隻小棕色狗。"},{"n":34,"q":"What will Jenny do if someone finds Coco?","o":["Take Coco to the park.","Give the person a banana.","Buy a new collar.","Give the person some money."],"a":"D","e":"她會給找到的人 $500 作為謝禮。"}]},{"from":35,"to":37,"type":"短文","title":"The Best Pizza in Town","text":"Mr. Rossi came to Taiwan from Italy ten years ago. At first, he worked in a hotel kitchen. But he missed the pizza from his hometown, so he decided to open his own pizza shop. It was not easy. He didn't have much money, and people in Taiwan didn't know much about real Italian pizza. Mr. Rossi worked fourteen hours a day, and he never gave up. Slowly, more and more people came to his shop. Today, his pizza is the most popular in the town. Mr. Rossi says, \"If you work hard, your dream will come true.\"","qs":[{"n":35,"q":"Why did Mr. Rossi open a pizza shop?","o":["He missed the pizza in Italy.","He needed a job in a hotel.","He wanted to make money fast.","He wanted to teach people Italian."],"a":"A","e":"他想念家鄉的披薩，所以決定開自己的披薩店。"},{"n":36,"q":"Which of the following is true about Mr. Rossi?","o":["He opened a shop in Italy.","He is from Taiwan.","He had a lot of money at first.","He worked very hard."],"a":"D","e":"他每天工作十四小時，從未放棄。"},{"n":37,"q":"What does Mr. Rossi mean by \"your dream will come true\"?","o":["You should open a pizza shop.","You can get what you want by working hard.","You will be a rich person.","You will move to Italy."],"a":"B","e":"他的意思是努力工作，夢想就能實現。"}]},{"from":38,"to":43,"type":"填空","title":"A Rainy Day","text":"Yesterday was a rainy day. I wanted __38__ outside, but my mother said, \"You should stay at home.\" So I decided to clean my room. While I __39__ my desk, I found my old camera. I was very happy because I thought it was lost. I took a lot of pictures of my room. They were __40__ than the pictures of my pet, so I laughed. Then I called my best friend. We talked about our plans for the next vacation. We are going to visit the zoo __41__ the weather is good. After the phone call, I __42__ homework and went to bed. Although it was a rainy day, it was one of the __43__ days of my week.","qs":[{"n":38,"q":"","o":["went","going","go","to go"],"a":"D","e":"want 後面接不定詞 to go。"},{"n":39,"q":"","o":["clean","was cleaning","cleaned","cleans"],"a":"B","e":"打掃書桌的過程中發現相機，用過去進行式表示過去正在進行的動作。"},{"n":40,"q":"","o":["the funniest","funnier","funny","more funny"],"a":"B","e":"與寵物照片比較，後面有 than，用比較級 funnier。"},{"n":41,"q":"","o":["if","but","so","because"],"a":"A","e":"如果天氣好就去動物園，用 if 表示條件。"},{"n":42,"q":"","o":["did","doing","do","does"],"a":"A","e":"睡覺前做完功課，與 went to bed 同為過去式，用 did。"},{"n":43,"q":"","o":["good","better","best","well"],"a":"C","e":"one of the + 最高級 + 複數名詞，good 的最高級是 best。"}]}]},{"n":5,"kind":"分冊複習・第1～3冊","scope":"第1～3冊綜合：現在簡單式與進行式、過去簡單式與過去進行式、未來式、比較級與最高級、不定詞與動名詞、助動詞、連接詞、介系詞、名詞與代名詞","singles":[{"n":1,"q":"Sam _____ his homework when his mother came home.","o":["does","was doing","is doing","did"],"a":"B","e":"when 子句用過去式 came，主要子句描述當時正在進行的動作，用過去進行式。"},{"n":2,"q":"A: How _____ do you play the piano? B: Three times a week.","o":["long","much","often","many"],"a":"C","e":"回答次數 three times a week，問頻率用 How often。"},{"n":3,"q":"The weather is getting _____. Let's take a jacket with us.","o":["colder","cold","the coldest","coldest"],"a":"A","e":"get + 比較級表示「越來越……」，這裡用 colder。"},{"n":4,"q":"My brother and I _____ to the same school, but we are in different classes.","o":["go","goes","going","went"],"a":"A","e":"主詞是 My brother and I（複數），敘述事實用現在簡單式 go。"},{"n":5,"q":"Mom told me _____ the window before I went to bed.","o":["closes","close","to close","closing"],"a":"C","e":"tell + 人 + to V，用不定詞 to close。"},{"n":6,"q":"There _____ a lot of people in the night market last Friday.","o":["was","are","is","were"],"a":"D","e":"a lot of people 是複數，last Friday 是過去，用 were。"},{"n":7,"q":"Ann is good at _____ cakes. Everyone loves her cakes.","o":["make","making","makes","to make"],"a":"B","e":"be good at 後面接動名詞 making。"},{"n":8,"q":"A: Is that your umbrella? B: No, it isn't _____. Mine is blue.","o":["my","mine","I","me"],"a":"B","e":"空格後面沒有名詞，要用所有格代名詞 mine（我的），表示「不是我的」。"},{"n":9,"q":"Nick can't come to the party _____ he is sick.","o":["if","because","but","so"],"a":"B","e":"不能參加派對的原因是生病，用 because。"},{"n":10,"q":"We _____ visit the museum this Sunday. Do you want to come with us?","o":["were going to","are going to","went to","going to"],"a":"B","e":"this Sunday 表示未來，主詞 We 用 are going to。"},{"n":11,"q":"Of all the animals in the zoo, the elephant is _____.","o":["the biggest","bigger","big","more big"],"a":"A","e":"在所有動物中比較，用 the + 最高級 the biggest。"},{"n":12,"q":"Please _____ your cell phone off in the movie theater.","o":["turn","turning","to turn","turns"],"a":"A","e":"祈使句用原形動詞 turn。"},{"n":13,"q":"How _____ water do you drink every day?","o":["much","old","many","long"],"a":"A","e":"water 是不可數名詞，問數量用 How much。"},{"n":14,"q":"When I got home, my sister _____ TV in the living room.","o":["was watching","is watching","watched","watches"],"a":"A","e":"我到家的那一刻，妹妹正在看電視，用過去進行式。"},{"n":15,"q":"The little boy is too short _____ the book on the top shelf.","o":["to reach","reaching","reaches","reach"],"a":"A","e":"too + 形容詞 + to V，表示「太……而不能……」。"},{"n":16,"q":"A: Would you like some tea? B: _____. I don't like hot drinks.","o":["Sure","All right","No, thanks","Yes, please"],"a":"C","e":"後面說不喜歡熱飲，所以是婉拒，用 No, thanks。"},{"n":17,"q":"You look tired. You _____ go to bed early tonight.","o":["shouldn't","should","won't","mustn't"],"a":"B","e":"看起來很累，建議今晚早點睡，用 should。"},{"n":18,"q":"My father is a bus driver. He gets up _____ five o'clock every morning.","o":["at","for","on","in"],"a":"A","e":"表示幾點鐘的時間點，介系詞用 at。"},{"n":19,"q":"A card in a restaurant says: \"Wait here to be seated.\" What should customers do?","o":["Order food at once.","Go to the kitchen.","Sit down anywhere they like.","Wait for a table."],"a":"D","e":"標示要求客人在此等候帶位。"}],"groups":[{"from":20,"to":22,"type":"海報","title":"Reading Club","text":"Join Our Reading Club!\nDo you love stories? Come and share them with us!\nWhen: Every Wednesday, 4:00 p.m. - 5:00 p.m.\nWhere: Room 205, School Library\nWho: Students in Grade 7 and Grade 8\nThis month's book: The Little Prince\nPlease read Chapters 1 to 5 before the first meeting on March 6.\nSnacks and drinks are free for everyone!\nTo join, tell Ms. Lai in the library.","qs":[{"n":20,"q":"Who can join the reading club?","o":["Everyone in the town.","Students in Grade 9.","Only teachers.","Students in Grade 7 and Grade 8."],"a":"D","e":"海報寫明對象是七年級和八年級學生。"},{"n":21,"q":"What should members do before March 6?","o":["Buy some snacks.","Bring some drinks.","Read the first five chapters.","Tell stories to Ms. Lai."],"a":"C","e":"第一次聚會前要讀完第 1 到 5 章。"},{"n":22,"q":"Which is true about the club?","o":["It meets in the classroom.","It meets once a week.","It meets after dinner.","It meets on Fridays."],"a":"B","e":"每週三聚會，所以一週一次。"}]},{"from":23,"to":24,"type":"短文","title":"Ellen's Piano","text":"Ellen started to learn the piano when she was six. At first, she didn't like to practice. She only played for ten minutes a day. One day, her teacher said, \"Ellen, you can play very well. Why don't you play for your classmates?\" Ellen was afraid, but she tried. Everyone clapped their hands after her show. After that, she wanted to play every day. Now she practices for an hour every evening. She wants to be a famous piano player in the future.","qs":[{"n":23,"q":"How long did Ellen practice every day at first?","o":["For one hour.","For ten minutes.","For two hours.","For six minutes."],"a":"B","e":"一開始她每天只彈十分鐘。"},{"n":24,"q":"Why did Ellen want to play every day after the show?","o":["She wanted to buy a new piano.","Her teacher told her to.","Her classmates asked her to.","She enjoyed playing for others."],"a":"D","e":"演出後大家鼓掌，她因此想要每天彈琴，表示她享受為別人演奏。"}]},{"from":25,"to":27,"type":"對話","title":"At the Clothes Store","text":"Clerk: Hello. Can I help you?\nNina: Yes, please. I'm looking for a jacket for my brother. He is fourteen.\nClerk: How about this blue one? It's $900.\nNina: It's nice, but a little expensive. Do you have a cheaper one?\nClerk: This green one is only $700.\nNina: Oh, I like it more! Does it come in a bigger size?\nClerk: Yes. I'll go and check. Please wait a moment... Here you are.\nNina: Great. I'll take it. Can I pay by credit card?\nClerk: Sorry, we only take cash.\nNina: OK. Here you are.","qs":[{"n":25,"q":"Why doesn't Nina buy the blue jacket?","o":["It is too small.","It is for a girl.","It is too expensive for her.","She doesn't like blue."],"a":"C","e":"Nina 說藍色那件有點貴，並詢問較便宜的。"},{"n":26,"q":"How much does Nina pay for the jacket?","o":["$700","$900","$1,600","$1,800"],"a":"A","e":"她買了綠色夾克，要價 $700。"},{"n":27,"q":"How does Nina pay?","o":["With cash.","With a gift card.","By credit card.","By phone."],"a":"A","e":"店員說只收現金，Nina 於是付現。"}]},{"from":28,"to":29,"type":"電子郵件","title":"Thank You","text":"To: Mr. Smith\nFrom: Alice\nSubject: Thank you for last week\nDear Mr. Smith,\nThank you very much for teaching our class last week. We all enjoyed your class on American food. I was surprised to learn that hamburgers did not come from the United States. I also loved the apple pie you brought. After class, I told my mother about it, and she wants to make one this weekend. Would you like to share your recipe with us? We hope you can visit our school again soon.\nBest wishes,\nAlice","qs":[{"n":28,"q":"Why did Alice write this e-mail?","o":["To say sorry to Mr. Smith.","To thank Mr. Smith and ask for a recipe.","To invite Mr. Smith to dinner.","To ask for a new teacher."],"a":"B","e":"她感謝老師的課，並請他分享食譜。"},{"n":29,"q":"What does Alice's mother want to do this weekend?","o":["Visit Mr. Smith.","Make an apple pie.","Buy hamburgers.","Teach a class."],"a":"B","e":"媽媽想在這個週末做一個蘋果派。"}]},{"from":30,"to":32,"type":"菜單","title":"Lunch Menu","text":"Lucky Lunch Box\nSet A: Chicken and rice - $90\nSet B: Fish and noodles - $85\nSet C: Vegetable curry and rice (no meat) - $80\nAll sets come with a free drink (tea or juice).\nAdd $15 for a dessert (cake or ice cream).\nFree delivery if your order is over $500.","qs":[{"n":30,"q":"Which set is for people who don't eat meat?","o":["Set A.","Set B.","Set C.","None of them."],"a":"C","e":"Set C 是無肉的蔬菜咖哩飯。"},{"n":31,"q":"Ken orders Set B and a dessert. How much does he pay?","o":["$85","$95","$100","$105"],"a":"C","e":"Set B $85 加甜點 $15，共 $100。"},{"n":32,"q":"When can customers get free delivery?","o":["When they order two sets.","When they order a dessert.","When they order a drink.","When they spend more than $500."],"a":"D","e":"訂單超過 $500 就能免費外送。"}]},{"from":33,"to":34,"type":"公告","title":"Sports Day","text":"Notice: Sports Day\nDate: Friday, November 10\nTime: 8:30 a.m. - 3:00 p.m.\nEvents: running, jumping, and basketball\nStudents should wear their sports clothes and bring their own water bottles.\nIf it rains, we will have Sports Day on Monday, November 13.\nPlease tell your parents. They are welcome to watch!","qs":[{"n":33,"q":"What should students bring?","o":["Umbrellas.","Lunch boxes.","Water bottles.","Basketballs."],"a":"C","e":"公告要求學生帶自己的水壺。"},{"n":34,"q":"When will Sports Day be if it rains on November 10?","o":["On November 11.","On November 12.","On November 13.","On November 14."],"a":"C","e":"如果下雨，運動會改在 11 月 13 日星期一。"}]},{"from":35,"to":37,"type":"短文","title":"A Quiet Neighbor","text":"Mr. Wu lives next to my house. He is seventy years old and lives alone. At first, we didn't talk to each other because he never smiled. One day, I saw him carrying a heavy box up the stairs, so I helped him. He thanked me and gave me some tea. After that, we became friends. Now I visit him every weekend. He tells me stories about his life, and I help him with his garden. My mother says Mr. Wu is a good friend to our family. I think I am also lucky to have him as my neighbor.","qs":[{"n":35,"q":"Why didn't the writer talk to Mr. Wu at first?","o":["Mr. Wu was too busy.","Mr. Wu lived far away.","Mr. Wu was always angry.","Mr. Wu never smiled."],"a":"D","e":"文中說一開始因為他從不微笑，所以沒有交談。"},{"n":36,"q":"How did the writer and Mr. Wu become friends?","o":["The writer helped Mr. Wu carry a box.","They worked in the same garden.","Mr. Wu helped the writer with homework.","They met at school."],"a":"A","e":"作者幫他搬重箱子，之後成為朋友。"},{"n":37,"q":"What does the writer do now?","o":["He drinks tea alone every day.","He plants flowers in his garden.","He teaches Mr. Wu English.","He talks with Mr. Wu and helps him on weekends."],"a":"D","e":"他每個週末拜訪吳先生，聽故事也幫忙整理花園。"}]},{"from":38,"to":43,"type":"填空","title":"My Favorite Season","text":"My favorite season is spring. In spring, the weather is warm and it __38__ rain very much. Flowers are everywhere. Last spring, my family went to the mountains. We __39__ a picnic under a big tree. My dad took many pictures __40__ the flowers. My brother wanted __41__ a butterfly, but he couldn't. He ran very fast, __42__ the butterfly was faster than he was. We were all very tired but happy. I am looking forward to __43__ spring again.","qs":[{"n":38,"q":"","o":["didn't","don't","isn't","doesn't"],"a":"D","e":"it 是第三人稱單數，現在簡單式否定用 doesn't。"},{"n":39,"q":"","o":["have","has","having","had"],"a":"D","e":"Last spring 是過去式，have 的過去式是 had。"},{"n":40,"q":"","o":["for","with","in","of"],"a":"D","e":"take pictures of 是「拍……的照片」。"},{"n":41,"q":"","o":["catches","catching","to catch","catch"],"a":"C","e":"want 後面接不定詞 to catch。"},{"n":42,"q":"","o":["so","and","or","but"],"a":"D","e":"跑得很快卻沒追到，因為蝴蝶更快，語意轉折，用 but。"},{"n":43,"q":"","o":["seeing","saw","to see","see"],"a":"A","e":"look forward to 的 to 是介系詞，後面接動名詞 seeing。"}]}]},{"n":6,"kind":"分冊複習・第4冊","scope":"現在完成式（for／since／already／yet／ever／never）、被動語態、關係代名詞（who／which／that）、間接問句、感官動詞與連綴動詞、as...as 比較、副詞、附加問句","singles":[{"n":1,"q":"Lucy has _____ in Taipei for ten years.","o":["lived","live","living","lives"],"a":"A","e":"has 後面接過去分詞，live 的過去分詞是 lived。"},{"n":2,"q":"A: Have you finished your homework _____? B: Not yet.","o":["already","yet","never","ever"],"a":"B","e":"完成式疑問句詢問「是否已經」用 yet，與回答 Not yet 相呼應。"},{"n":3,"q":"This temple _____ in 1890. It is more than one hundred years old.","o":["is building","has built","built","was built"],"a":"D","e":"廟是被建造的，用被動語態；1890 是過去時間，用 was built。"},{"n":4,"q":"The girl _____ is singing on the stage is my cousin.","o":["what","which","who","whose"],"a":"C","e":"先行詞是人 The girl，關係代名詞作主詞用 who。"},{"n":5,"q":"Do you know where _____?","o":["Tom lives","does Tom live","Tom live","is Tom living"],"a":"A","e":"間接問句用肯定句語序，主詞在動詞前，且動詞配合主詞變化為 lives。"},{"n":6,"q":"The soup smells _____. I want to have some.","o":["good","goodly","nicely","well"],"a":"A","e":"smell 是感官動詞，後面接形容詞 good。"},{"n":7,"q":"Peter has _____ been to Japan, so he wants to go there someday.","o":["yet","already","never","ever"],"a":"C","e":"因為沒去過所以想去，用 never。"},{"n":8,"q":"This bag is not as _____ as that one. It's cheaper.","o":["most expensive","expensively","expensive","more expensive"],"a":"C","e":"not as ... as 中間用形容詞原級 expensive。"},{"n":9,"q":"The window _____ by the boy yesterday.","o":["has broken","was broken","is broken","broke"],"a":"B","e":"窗戶被打破，用被動語態；yesterday 表示過去，用 was broken。"},{"n":10,"q":"Tom is a good player, _____?","o":["doesn't he","is he","wasn't he","isn't he"],"a":"D","e":"前面是肯定句，附加問句用否定形式 isn't he。"},{"n":11,"q":"The book _____ I bought yesterday is very interesting.","o":["who","where","which","what"],"a":"C","e":"先行詞是物 The book，作受詞的關係代名詞用 which。"},{"n":12,"q":"My brother has _____ his bike since last Sunday.","o":["has","having","have","had"],"a":"D","e":"has 後面接過去分詞，have 的過去分詞是 had。"},{"n":13,"q":"Please speak _____. I can't hear you.","o":["the loudest","louder","loudest","loud"],"a":"B","e":"請說大聲一點，用比較級 louder。"},{"n":14,"q":"She looked _____ when she heard the bad news.","o":["sadness","sadder","sad","sadly"],"a":"C","e":"look 是連綴動詞，後面接形容詞 sad。"},{"n":15,"q":"A: Can you tell me _____? B: It's next to the bank.","o":["where is the post office","where the post office is","is the post office where","the post office is where"],"a":"B","e":"間接問句使用肯定句語序：where + 主詞 + 動詞。"},{"n":16,"q":"English _____ in many countries around the world.","o":["is spoken","is speaking","speaks","spoke"],"a":"A","e":"英語被許多國家使用，用被動語態 is spoken。"},{"n":17,"q":"They have lived in this house _____ 2015.","o":["for","since","at","in"],"a":"B","e":"後面接過去的時間點 2015，用 since。"},{"n":18,"q":"The man _____ is wearing a blue shirt is our new teacher.","o":["whose","that","whom","which"],"a":"B","e":"先行詞 The man 是人，作主詞的關係代名詞可用 that，which 用於物。"},{"n":19,"q":"A sign at the beach says: \"Swimming is not allowed after 6 p.m.\" What does it mean?","o":["People can swim at any time.","People should go to the beach at 6 p.m.","People must swim before 6 p.m.","People cannot swim after 6 p.m."],"a":"D","e":"not allowed 表示不被允許，所以六點之後不可游泳。"}],"groups":[{"from":20,"to":22,"type":"傳單","title":"Used Book Sale","text":"Used Book Sale\nBooks are not only for reading. They can also help others!\nDate: Saturday, May 20, and Sunday, May 21\nTime: 10:00 a.m. - 6:00 p.m.\nPlace: Hope Community Center\nStory books: $20 each\nComic books: $15 each\nDictionaries: $50 each\nAll money from the sale will be given to children in the mountain areas.\nWe also need volunteers. If you want to help, call Mr. Chang at 8765-4321.","qs":[{"n":20,"q":"How long does the sale last?","o":["One week.","One day.","Three days.","Two days."],"a":"D","e":"五月 20 日和 21 日，共兩天。"},{"n":21,"q":"Amy wants to buy two story books and one comic book. How much will she pay?","o":["$35","$40","$55","$70"],"a":"C","e":"兩本故事書 $40 加一本漫畫書 $15，共 $55。"},{"n":22,"q":"What will happen to the money from the sale?","o":["It will be given to children in the mountain areas.","It will be used to pay volunteers.","It will be given to Mr. Chang.","It will be used to buy new books for the center."],"a":"A","e":"傳單寫所有收入會捐給山區的孩子。"}]},{"from":23,"to":24,"type":"短文","title":"The Old Bridge","text":"The old bridge in our town was built in 1950. For many years, people crossed it to go to the market. It was made of wood, and it was very beautiful. However, last year a big storm damaged it. The town did not have enough money to build a new one, so many people were sad. Then a group of students started a project. They sold cookies and held music shows to raise money. After six months, they collected enough money, and the bridge has been fixed. Now it looks as good as new.","qs":[{"n":23,"q":"Why were many people sad last year?","o":["The bridge was too old to use.","The storm damaged the bridge.","The market was closed.","The students left town."],"a":"B","e":"去年暴風雨損壞了橋，大家因此難過。"},{"n":24,"q":"How did the students get the money?","o":["They sold the old bridge.","They sold cookies and held music shows.","They asked the town for help.","They worked at the market."],"a":"B","e":"他們賣餅乾、辦音樂表演籌款。"}]},{"from":25,"to":27,"type":"對話","title":"After the Concert","text":"Jack: Have you been to a concert before, Eva?\nEva: Yes, I have. I've been to three. But this is my first time to see Mayday.\nJack: Me too! I've been a fan of the band since I was twelve.\nEva: Really? I've only heard some of their songs. Which one is your favorite?\nJack: \"Stars in the Sky\". It's the song that makes me feel brave.\nEva: I love that song, too. The singer's voice is amazing.\nJack: The tickets are very expensive, but I think it was worth it.\nEva: I agree. Let's come again next year!","qs":[{"n":25,"q":"How many concerts has Eva been to before this one?","o":["Three.","One.","Two.","Four."],"a":"A","e":"Eva 說她以前去過三場演唱會。"},{"n":26,"q":"How long has Jack been a fan of the band?","o":["For one month.","Since last year.","Since he was twelve.","For three years."],"a":"C","e":"Jack 說他從十二歲起就是樂團的粉絲。"},{"n":27,"q":"What do Jack and Eva think about the concert?","o":["It was too short.","It was too noisy.","It was boring.","It was worth the money."],"a":"D","e":"Jack 認為票價雖貴但值得，Eva 表示同意。"}]},{"from":28,"to":29,"type":"電子郵件","title":"Bike Trip","text":"To: Dad\nFrom: Henry\nSubject: Greetings from Hualien\nHi Dad,\nI have been in Hualien for two days. The weather has been great! Yesterday, my friends and I rode our bikes along the sea. It was one of the most exciting things I have ever done. We stopped at a small shop and had some cold fruit tea. It tasted so good. Today, I'm going to visit Taroko Gorge. I haven't seen it before, so I'm looking forward to it. I'll call you tonight.\nHenry","qs":[{"n":28,"q":"How has the weather been in Hualien?","o":["Rainy.","Windy.","Cold.","Great."],"a":"D","e":"信中寫 The weather has been great。"},{"n":29,"q":"What will Henry do today?","o":["Ride a bike along the sea.","Have fruit tea.","Go home.","Visit Taroko Gorge."],"a":"D","e":"今天他要去太魯閣峽谷。"}]},{"from":30,"to":32,"type":"資訊表","title":"Library Rules","text":"Hillside Library\nOpening hours: 9:00 a.m. - 8:00 p.m. (Closed on Mondays)\nEach person can borrow up to five books for two weeks.\nLate return: $5 per day for each book.\nPlease keep quiet. Food is not allowed, but water is OK.\nComputers can be used for one hour each time.\nReturn books in the box at the front door when the library is closed.","qs":[{"n":30,"q":"What can people do in the library?","o":["Drink water.","Borrow ten books.","Talk loudly.","Eat lunch."],"a":"A","e":"規定不能吃東西，但可以喝水。"},{"n":31,"q":"Ben returned one book three days late. How much does he need to pay?","o":["$5","$10","$15","$20"],"a":"C","e":"每本每天罰 $5，遲三天，共 $15。"},{"n":32,"q":"What can people do when the library is closed?","o":["Read in the front yard.","Use the computers.","Return books in the box.","Borrow more books."],"a":"C","e":"閉館時可把書投進大門口的還書箱。"}]},{"from":33,"to":34,"type":"公告","title":"Science Fair","text":"Science Fair\nOur school's science fair will be held on Thursday, December 7, in the gym. Every student in Grade 8 has to take part. You can work alone or with a partner. Your project must be handed in to Mr. Hsu by Friday, November 24. The best three projects will win prizes. Last year's winner made a small robot that cleaned desks. What will you make this year?","qs":[{"n":33,"q":"Who has to join the science fair?","o":["Parents of the students.","Only students who want to.","All the students in Grade 8.","All the teachers."],"a":"C","e":"公告說每位八年級學生都必須參加。"},{"n":34,"q":"What is true about the science fair?","o":["The robot from last year was a prize.","Three projects will get prizes.","Students must work alone.","It will be held in a classroom."],"a":"B","e":"最好的三件作品會獲得獎項。"}]},{"from":35,"to":37,"type":"短文","title":"Water for Everyone","text":"In many parts of the world, people do not have clean water. Some children must walk for hours to get water from a river, and the water is often dirty. Because of this, many of them get sick. Last year, a group of engineers built a small water system in a village in Africa. Now clean water is delivered to every house in the village by pipes. The children no longer have to walk far, so they can spend more time at school. The engineers hope that more villages can be helped in the future.","qs":[{"n":35,"q":"Why do many children get sick?","o":["They don't have houses.","They walk too much.","They don't go to school.","They drink dirty water."],"a":"D","e":"他們從河裡取的水常常是髒的，因此生病。"},{"n":36,"q":"What did the engineers do?","o":["They built a school.","They built a water system.","They cleaned the river.","They taught the children to swim."],"a":"B","e":"工程師在村子裡建了一個小型供水系統。"},{"n":37,"q":"What is the result of the new system?","o":["The river is cleaner.","The village is bigger.","Children can spend more time at school.","Children don't need to study."],"a":"C","e":"孩子不必再走遠路，所以有更多時間上學。"}]},{"from":38,"to":43,"type":"填空","title":"A Dream Job","text":"Sandy has wanted to be a chef __38__ she was a little girl. She learned to cook from her grandmother, __39__ was a great cook. When Sandy was fifteen, she was asked __40__ her school to cook for a party. Everyone said the food was delicious. Since then, she has cooked for many people. Last month, she __41__ a chance to work in a famous restaurant. She was very excited, but she didn't know __42__ she should take the job. Her grandmother told her, \"Follow your heart, and you will be __43__ in the end.\"","qs":[{"n":38,"q":"","o":["when","for","after","since"],"a":"D","e":"since + 過去的時間點（she was a little girl），與現在完成式 has wanted 搭配。"},{"n":39,"q":"","o":["who","what","whose","which"],"a":"A","e":"先行詞是 her grandmother，補充說明人，用 who。"},{"n":40,"q":"","o":["by","at","in","on"],"a":"A","e":"被動語態中動作的執行者用 by。"},{"n":41,"q":"","o":["having","had","have","has"],"a":"B","e":"Last month 表示過去，用過去式 had。"},{"n":42,"q":"","o":["if","who","that","what"],"a":"A","e":"know if she should take the job 表示「是否」，用 if 引導間接問句。"},{"n":43,"q":"","o":["happy","happiness","happily","happier"],"a":"A","e":"be 動詞後接形容詞 happy 作補語。"}]}]},{"n":7,"kind":"分冊複習・第3～4冊","scope":"過去簡單式與過去進行式、未來式、比較級與最高級、不定詞與動名詞、助動詞、現在完成式、被動語態、關係代名詞、間接問句、感官動詞、附加問句、連接詞","singles":[{"n":1,"q":"We _____ in the middle of dinner when the lights went out.","o":["are","will be","were","have been"],"a":"C","e":"when 子句用過去式 went out，當時的狀態用過去式 were（were in the middle of 表示正在……的過程中）。"},{"n":2,"q":"Have you ever _____ a horse before?","o":["ridden","riding","ride","rode"],"a":"A","e":"ever 搭配現在完成式，ride 的過去分詞是 ridden。"},{"n":3,"q":"The movie was _____ than I thought. I almost fell asleep.","o":["boring","the most boring","most boring","more boring"],"a":"D","e":"後面有 than，用比較級 more boring。"},{"n":4,"q":"My mother asked me _____ out the trash before dinner.","o":["taking","take","took","to take"],"a":"D","e":"ask + 人 + to V。"},{"n":5,"q":"This song is loved _____ many young people around the world.","o":["by","with","in","for"],"a":"A","e":"被動語態中動作的執行者用 by。"},{"n":6,"q":"Judy has lived in Kaohsiung _____ she was born.","o":["since","for","when","after"],"a":"A","e":"since 後面接過去的時間點或子句，與 has lived 搭配。"},{"n":7,"q":"A: Did you go to the baseball game? B: No. I _____ to the game, but I was too busy.","o":["have gone","would go","went","was going to go"],"a":"D","e":"was going to 表示過去原本打算做但沒做到的事。"},{"n":8,"q":"Do you know when _____ for the trip?","o":["we will leave","are we leaving","will we leave","did we leave"],"a":"A","e":"間接問句用肯定句語序：疑問詞 + 主詞 + 動詞。"},{"n":9,"q":"The man _____ lives next door is a famous painter.","o":["whose","what","which","who"],"a":"D","e":"先行詞是人 The man，作主詞用 who。"},{"n":10,"q":"Mark was too tired _____ his homework last night.","o":["finishing","to finish","finishes","finish"],"a":"B","e":"too ... to V 表示「太……而無法……」。"},{"n":11,"q":"The cake looks _____, but I don't like sweet food.","o":["deliciously","more deliciously","deliciousness","delicious"],"a":"D","e":"look 是連綴動詞，後面接形容詞 delicious。"},{"n":12,"q":"You have to wear a helmet when you ride a motorcycle, _____ you?","o":["don't","haven't","have","do"],"a":"A","e":"前面是肯定句，附加問句用否定；have to 是一般動詞，用 don't you。"},{"n":13,"q":"A: How long has your uncle _____ a teacher? B: For about twenty years.","o":["being","been","be","was"],"a":"B","e":"has 後面接過去分詞 been。"},{"n":14,"q":"When I was walking along the river, I _____ an old friend.","o":["met","meet","meets","was meeting"],"a":"A","e":"走路是持續中的動作，另一個短暫動作「遇見」用過去簡單式 met。"},{"n":15,"q":"Jason is the _____ boy in my class. Nobody runs faster than him.","o":["fast","faster","fastest","more fast"],"a":"C","e":"the + 最高級，沒有人比他快，所以是最快的。"},{"n":16,"q":"The window is open. Who _____ it?","o":["has been opened","opened","was opened","opens"],"a":"B","e":"問「誰打開的」，主詞是 Who，用主動語態過去式 opened。"},{"n":17,"q":"She sounds _____ on the phone. Maybe she has a cold.","o":["tiring","tired","tire","tiredly"],"a":"B","e":"sound 是連綴動詞，後面接形容詞；tired 表示感到疲倦。"},{"n":18,"q":"I'm sorry I'm late. I _____ the wrong bus.","o":["am taking","took","will take","take"],"a":"B","e":"說明遲到的原因是過去搭錯了車，用過去式 took。"},{"n":19,"q":"A sign in front of a shop says: \"Open from 9 a.m. to 9 p.m., seven days a week.\" What does it mean?","o":["The shop is open for seven hours a day.","The shop is open every day.","The shop opens at 9 p.m.","The shop is closed on Sundays."],"a":"B","e":"seven days a week 表示每天都營業。"}],"groups":[{"from":20,"to":22,"type":"海報","title":"Bake with Us","text":"Bake with Us!\nLearn to make cookies, bread, and cakes at the Sweet Home Bakery.\nClass 1: Cookies (Saturday, 10:00 - 12:00) - $400\nClass 2: Bread (Saturday, 2:00 - 4:00) - $500\nClass 3: Cakes (Sunday, 10:00 - 12:00) - $600\nStudents aged 12 or under need a parent to come with them.\nIf you take all three classes, you only pay $1,200.\nPlease sign up one week before the class. You will take home what you make!","qs":[{"n":20,"q":"Which class is on Sunday?","o":["Cookies.","Bread.","Cakes.","All of them."],"a":"C","e":"只有 Class 3 蛋糕課在星期日。"},{"n":21,"q":"Mike takes all three classes. How much money does he save?","o":["$100","$200","$300","$400"],"a":"B","e":"三堂課原價 $400+$500+$600=$1,500，優惠價 $1,200，省下 $300。"},{"n":22,"q":"What is true about the classes?","o":["Students can take home what they make.","All the classes are in the morning.","Parents cannot join the classes.","Students can sign up on the same day."],"a":"A","e":"海報最後說學生可以帶走自己做的成品。"}]},{"from":23,"to":24,"type":"短文","title":"Tom and the Robot","text":"Tom's school held a robot contest last month. Tom wanted to join, but he didn't know how to build a robot. He asked his uncle, who is an engineer, for help. His uncle taught him how to use a small computer. Every night after dinner, Tom worked on his robot for two hours. On the day of the contest, his robot could walk and pick up a ball. It did not win first place, but Tom was very proud. He learned that hard work is more important than winning.","qs":[{"n":23,"q":"Who helped Tom build the robot?","o":["His father.","His teacher.","His uncle.","His classmate."],"a":"C","e":"Tom 請當工程師的叔叔幫忙。"},{"n":24,"q":"What did Tom learn from the contest?","o":["Hard work is more important than winning.","He can win first place easily.","He should ask for help every time.","Robots are better than people."],"a":"A","e":"文末說他學到努力比獲勝更重要。"}]},{"from":25,"to":27,"type":"對話","title":"At the Train Station","text":"Passenger: Excuse me. How can I get to the National Museum?\nOfficer: You can take the MRT Red Line and get off at Central Station. It's about twenty minutes.\nPassenger: Is it far from the station to the museum?\nOfficer: No, it isn't. You can walk there in five minutes. Just go straight on Park Road and turn left at the bank.\nPassenger: Thank you. By the way, how much is the ticket?\nOfficer: It's $30 for adults. But if you buy a day pass for $100, you can ride as many times as you want.\nPassenger: I'm going to visit three places today. I think I'll buy the day pass.\nOfficer: Good idea!","qs":[{"n":25,"q":"How will the passenger go to the museum?","o":["By taxi.","By MRT.","On foot only.","By bus."],"a":"B","e":"警員建議搭捷運紅線到中央車站。"},{"n":26,"q":"Where should the passenger turn left?","o":["At the museum.","At the park.","At the bank.","At the station."],"a":"C","e":"沿公園路直走，在銀行處左轉。"},{"n":27,"q":"Why will the passenger buy the day pass?","o":["He doesn't have enough cash.","It is cheaper than a ticket.","The officer told him to.","He will go to several places."],"a":"D","e":"他今天要去三個地方，所以買一日票。"}]},{"from":28,"to":29,"type":"電子郵件","title":"Moving Away","text":"To: Sophie\nFrom: Daniel\nSubject: Big news\nDear Sophie,\nI have some news for you. My family is going to move to Kaohsiung next month because my dad has found a new job there. I'm sad because I have lived here since I was born. I have known you for ten years, and you are my best friend. I'm going to miss our walks after school. But I promise we will keep in touch. I'll send you pictures of my new school, and maybe you can come to visit me in the summer.\nYour friend,\nDaniel","qs":[{"n":28,"q":"Why is Daniel's family moving?","o":["Daniel's school is closing.","Daniel wants a bigger house.","Daniel's dad has a new job.","Daniel's friends are moving."],"a":"C","e":"因為爸爸在高雄找到了新工作。"},{"n":29,"q":"What does Daniel hope Sophie will do?","o":["Write to his dad.","Move to Kaohsiung with him.","Send him pictures.","Visit him in the summer."],"a":"D","e":"Daniel 希望 Sophie 夏天能去看他。"}]},{"from":30,"to":32,"type":"時間表","title":"Movie Times","text":"Starlight Cinema - Today's Movies\n\"Sea Adventure\": 1:00 p.m., 4:00 p.m., 7:00 p.m. (120 minutes)\n\"The Lost City\": 2:30 p.m., 6:00 p.m., 9:30 p.m. (90 minutes)\nTickets: $280 for adults, $200 for students\nChildren under 6 cannot see \"The Lost City\".\nBuy online and save $30 per ticket.","qs":[{"n":30,"q":"What time does the 6:00 p.m. showing of \"The Lost City\" finish?","o":["At 8:30 p.m.","At 8:00 p.m.","At 7:30 p.m.","At 7:00 p.m."],"a":"C","e":"影片長 90 分鐘，六點開始，七點半結束。"},{"n":31,"q":"Two students buy tickets online. How much do they pay in total?","o":["$340","$370","$400","$460"],"a":"A","e":"學生票 $200，線上購票每張省 $30，所以一張 $170，兩張共 $340。"},{"n":32,"q":"Who can NOT see \"The Lost City\"?","o":["Students.","People who bought tickets online.","Children under six.","Adults."],"a":"C","e":"六歲以下兒童不能觀看。"}]},{"from":33,"to":34,"type":"公告","title":"Beach Cleanup","text":"Beach Cleanup Day\nOur town's beaches have become dirty because of too much trash. Let's clean them together!\nDate: Sunday, June 4, 8:00 a.m. - 11:00 a.m.\nMeeting point: North Beach parking lot\nBring: gloves, a hat, and sunscreen. Bags will be provided.\nEveryone who takes part will get a free T-shirt and a cold drink.\nChildren under twelve must be with an adult.","qs":[{"n":33,"q":"What will the volunteers get?","o":["Gloves and hats.","A T-shirt and a drink.","Some sunscreen.","Trash bags."],"a":"B","e":"參加者可獲得免費 T 恤與冷飲。"},{"n":34,"q":"Which of the following is true?","o":["Volunteers must bring their own bags.","Young children must come with an adult.","The event is in the afternoon.","The meeting point is the beach café."],"a":"B","e":"十二歲以下兒童要有大人陪同。"}]},{"from":35,"to":37,"type":"短文","title":"A Cup of Tea","text":"There was once a young man named Leo. He was always in a hurry and never listened to others. One day he went to visit a wise old teacher. The teacher began to pour tea into Leo's cup. The cup became full, but the teacher kept pouring, and tea ran all over the table. \"Stop! The cup is full!\" Leo shouted. The teacher smiled and said, \"Like this cup, your mind is full of your own ideas. If you want to learn something new, you must first make some room.\" Leo understood and bowed to the teacher.","qs":[{"n":35,"q":"What was Leo like at first?","o":["He was a wise man.","He was kind and quiet.","He was a tea teacher.","He was always in a hurry."],"a":"D","e":"文中第二句說他總是匆匆忙忙，也不聽別人說話。"},{"n":36,"q":"Why did the teacher keep pouring tea?","o":["He was angry at Leo.","He didn't see the cup was full.","He wanted to show Leo something.","He wanted Leo to drink more tea."],"a":"C","e":"老師用倒茶的動作比喻，讓 Leo 明白道理。"},{"n":37,"q":"What does the teacher want to tell Leo?","o":["Leo should make room in his mind.","Leo should drink less tea.","The cup is too small.","Tea is good for learning."],"a":"A","e":"老師說想學新東西，必須先讓心中有空間。"}]},{"from":38,"to":43,"type":"填空","title":"Learning Chinese","text":"Jim is an American boy. He has been in Taiwan __38__ two years. At first, it was hard for him to learn Chinese because the characters __39__ very difficult. Many people helped him, and now he can talk with his classmates in Chinese. His teacher, __40__ is very kind, says he is making great progress. Last week, Jim was asked __41__ a speech in Chinese at school. He was so nervous __42__ he forgot some words. But everyone clapped for him. He is going to keep practicing so that he can speak Chinese __43__ than he does now.","qs":[{"n":38,"q":"","o":["for","when","since","at"],"a":"A","e":"後面接一段時間 two years，與 has been 搭配，用 for。"},{"n":39,"q":"","o":["looked","look","looks","looking"],"a":"A","e":"「漢字看起來很難」，背景是過去，用過去式 looked 作連綴動詞。"},{"n":40,"q":"","o":["which","whom","whose","who"],"a":"D","e":"先行詞是 His teacher，補充說明人並作主詞，用 who。"},{"n":41,"q":"","o":["gives","to give","give","giving"],"a":"B","e":"be asked to V，被要求做某事。"},{"n":42,"q":"","o":["because","but","that","if"],"a":"C","e":"so + 形容詞 + that 子句，表示「如此……以至於……」。"},{"n":43,"q":"","o":["well","better","best","good"],"a":"B","e":"後面有 than，用比較級；well 的比較級是 better。"}]}]},{"n":8,"kind":"分冊複習・第1～4冊","scope":"第1～4冊綜合：各種時態（現在、過去、未來、進行、完成）、被動語態、關係代名詞、間接問句、比較級與最高級、不定詞與動名詞、助動詞、連接詞、附加問句","singles":[{"n":1,"q":"Alice _____ in London for three years before she moved to Taipei.","o":["lives","has lived","lived","is living"],"a":"C","e":"before she moved 表示過去的時間，主要子句也用過去式 lived。"},{"n":2,"q":"The tickets for the concert _____ out in two hours yesterday.","o":["sell","were sold","sold","was sold"],"a":"B","e":"票是被賣掉的，主詞 tickets 是複數，過去被動用 were sold。"},{"n":3,"q":"I'm not sure whether he _____ to the party tonight.","o":["come","will come","coming","comes"],"a":"B","e":"tonight 表示未來，whether 子句用 will come。"},{"n":4,"q":"Mom told us to stop _____ video games and go to bed.","o":["playing","played","to play","play"],"a":"A","e":"stop + V-ing 表示停止正在做的事。"},{"n":5,"q":"The girl _____ hair is very long is my classmate.","o":["that","who","whose","which"],"a":"C",
