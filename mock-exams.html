"o":["Yes, please","Of course","Sure","No, thanks"],"a":"D","e":"說「我飽了」，表示婉拒，用 No, thanks。"},{"n":3,"q":"The singer became _____ after she won the contest.","o":["famously","fames","famous","fame"],"a":"C","e":"become 是連綴動詞，後面接形容詞 famous。"},{"n":4,"q":"I can't hear the teacher. Please turn the radio _____.","o":["in","down","on","up"],"a":"B","e":"聽不到老師說話，是因為收音機太吵，所以要把音量轉小，用 turn down。"},{"n":5,"q":"My uncle _____ in New York for ten years before he moved back to Taiwan.","o":["has lived","is living","lives","lived"],"a":"D","e":"before he moved back 是過去，主要子句也用過去式 lived。"},{"n":6,"q":"Mom said, \"Don't forget _____ the lights before you leave.\"","o":["to turn off","turned off","turn off","turning off"],"a":"A","e":"forget to V 表示忘記去做某事，這裡是提醒別忘了關燈。"},{"n":7,"q":"This is the museum _____ we visited last summer.","o":["whose","who","where","which"],"a":"D","e":"先行詞是物，作 visited 的受詞，用 which；若用 where，後面不應再有 visited 的受詞。"},{"n":8,"q":"She talked _____ she knew everything about the topic.","o":["as long as","as if","even though","so that"],"a":"B","e":"as if 表示「好像……」，她說得好像什麼都知道。"},{"n":9,"q":"It is important for students _____ enough sleep.","o":["get","got","to get","getting"],"a":"C","e":"It is + 形容詞 + for + 人 + to V。"},{"n":10,"q":"The boy is _____ to reach the book on the top shelf.","o":["tall enough","enough tall","too tall","so tall"],"a":"A","e":"形容詞 + enough + to V，enough 要放在形容詞後面。"},{"n":11,"q":"A: What did the teacher say? B: She asked us _____ our books.","o":["opened","opening","to open","open"],"a":"C","e":"ask + 人 + to V。"},{"n":12,"q":"When I _____ the gym, I saw some boys playing basketball.","o":["walking into","walk","have walked into","walked into"],"a":"D","e":"兩個過去動作依序發生，walked into 後面直接接地點。"},{"n":13,"q":"No one knows _____ the thief ran away.","o":["that","which","when","what"],"a":"C","e":"間接問句缺少時間，用 when 表示「什麼時候」。"},{"n":14,"q":"The shirt is _____ expensive for me to buy.","o":["so","enough","very","too"],"a":"D","e":"too + 形容詞 + for + 人 + to V。"},{"n":15,"q":"Jenny is proud _____ her son. He won the first prize.","o":["of","with","at","in"],"a":"A","e":"be proud of 表示「以……為傲」。"},{"n":16,"q":"If it hadn't been for your help, I _____ the project on time.","o":["won't finish","can't finish","couldn't have finished","didn't finish"],"a":"C","e":"與過去事實相反的假設，主要子句用 would/could have + 過去分詞。"},{"n":17,"q":"The workers have been working here _____ eight o'clock this morning.","o":["for","in","at","since"],"a":"D","e":"since 後面接過去的時間點 eight o'clock。"},{"n":18,"q":"Lisa is really good _____ solving math problems.","o":["at","of","in","for"],"a":"A","e":"be good at 表示「擅長……」。"},{"n":19,"q":"A sign at a bus stop says: \"Please let passengers get off first.\" What does it ask people to do?","o":["Stand on the bus.","Wait until others leave the bus.","Pay before getting on.","Get on the bus quickly."],"a":"B","e":"請讓乘客先下車，所以要等別人下車後再上車。"}],"groups":[{"from":20,"to":22,"type":"廣告","title":"Science Day Camp","text":"Young Scientists Day Camp\nFor students in Grades 5 to 9\nDate: July 24 - July 28\nTime: 9:00 a.m. - 4:00 p.m.\nPlace: Hope Science Center\nActivities: building rockets, growing crystals, and robot games\nCost: $3,500 (lunch included)\nEarly bird discount: Register before June 15 and pay only $3,000.\nEach group has ten students and one teacher.\nVisit www.hopescience.com to register.","qs":[{"n":20,"q":"How long is the camp?","o":["Three days.","Five days.","Seven days.","Two days."],"a":"B","e":"7 月 24 日到 28 日，共五天。"},{"n":21,"q":"When can students get the early bird price?","o":["On July 24.","Before June 15.","Before June 30.","After July 28."],"a":"B","e":"在 6 月 15 日以前報名，只要 $3,000。"},{"n":22,"q":"Which of the following is true?","o":["There are ten students in each group.","Students will build cars.","Only teachers can join.","Lunch is not included."],"a":"A","e":"每組有十位學生和一位老師。"}]},{"from":23,"to":24,"type":"短文","title":"The Shy Cat","text":"When Ms. Lee adopted a cat named Milo, he was very shy. He hid under the bed for days and only came out at night. Ms. Lee didn't push him. She sat quietly near the bed and read books aloud. Slowly, Milo came out and sat beside her. A month later, he began to sleep on her lap. Ms. Lee realized that it takes time to make a new friend, whether it is a person or a cat. Now Milo greets her at the door every day when she comes home from work.","qs":[{"n":23,"q":"What did Ms. Lee do when Milo was shy?","o":["She sent him back.","She pushed him out from under the bed.","She read quietly near him.","She gave him a new bed."],"a":"C","e":"她靜靜坐在床邊大聲朗讀，沒有逼他。"},{"n":24,"q":"What does the passage show?","o":["Making friends takes time and patience.","Cats like to hide.","Reading helps cats sleep.","Cats are not friendly."],"a":"A","e":"文末說交朋友需要時間，無論是人或貓，也需要耐心。"}]},{"from":25,"to":27,"type":"對話","title":"Choosing a Phone","text":"Salesperson: Hello. May I help you?\nCustomer: I'm looking for a phone for my daughter. She's twelve.\nSalesperson: What does she need it for?\nCustomer: Mainly to call me and to take pictures.\nSalesperson: Then I recommend this one. It's $5,000 and has a very good camera.\nCustomer: Hmm, it's a little expensive. Do you have anything cheaper?\nSalesperson: This model is $3,500. The camera is not as good, but it's easy to use.\nCustomer: I'll take that one. Does it come with a case?\nSalesperson: Yes. It also has a one-year warranty.","qs":[{"n":25,"q":"Who is the phone for?","o":["The customer's husband.","The customer.","The salesperson.","The customer's daughter."],"a":"D","e":"顧客要替十二歲的女兒買手機。"},{"n":26,"q":"Why does the customer choose the $3,500 phone?","o":["It is cheaper.","It has a better camera.","It is smaller.","It is on sale."],"a":"A","e":"顧客覺得 $5,000 的有點貴，改買較便宜的 $3,500 手機。"},{"n":27,"q":"What does the $3,500 phone come with?","o":["A case and a one-year warranty.","A free camera.","A gift card.","A free phone call."],"a":"A","e":"店員說附手機殼，還有一年保固。"}]},{"from":28,"to":29,"type":"電子郵件","title":"Change of Plan","text":"To: All club members\nFrom: Mr. Hsiao\nSubject: Change of plan\nDear members,\nBecause of the heavy rain forecast for this Saturday, the hiking trip to Mt. Alishan will be moved to next Saturday, April 22. The meeting time and place will stay the same: 6:30 a.m. at the school gate. Please remember to bring rain jackets in case it rains again. If you cannot go on April 22, please let me know by Wednesday. We are sorry for the trouble.\nMr. Hsiao","qs":[{"n":28,"q":"Why was the trip changed?","o":["Many members are busy.","Mr. Hsiao is ill.","The weather will be bad.","The mountain is closed."],"a":"C","e":"因為預報週六會下大雨。"},{"n":29,"q":"What should members do if they can't go on April 22?","o":["Tell Mr. Hsiao by Wednesday.","Bring rain jackets.","Go on Saturday instead.","Come to the school gate at 6:30."],"a":"A","e":"不能參加 4 月 22 日的人，要在週三前告知老師。"}]},{"from":30,"to":32,"type":"圖表","title":"Weekly Screen Time","text":"A school survey asked students how many hours they spend on their phones each day. The results:\nLess than 1 hour: 10%\n1 to 2 hours: 25%\n2 to 4 hours: 40%\nMore than 4 hours: 25%\nExperts suggest that teenagers should spend no more than 2 hours a day on screens for fun.","qs":[{"n":30,"q":"What percentage of students spend 2 to 4 hours a day?","o":["10%","25%","40%","65%"],"a":"C","e":"表格中 2 到 4 小時的比例是 40%。"},{"n":31,"q":"What percentage of students spend more than 2 hours a day?","o":["25%","40%","65%","75%"],"a":"C","e":"2 到 4 小時 40% 加上超過 4 小時 25%，共 65%。"},{"n":32,"q":"What can we learn from the survey?","o":["Most students use phones too little.","Many students use phones longer than experts suggest.","Students never use phones.","Experts want students to use phones more."],"a":"B","e":"超過一半的學生每天用手機超過 2 小時，高於專家建議。"}]},{"from":33,"to":34,"type":"公告","title":"Bike Safety","text":"Bike Safety Reminder\nMore and more students ride bikes to school. For your safety, please follow these rules:\n- Always wear a helmet.\n- Stop at red lights.\n- Do not use your phone while riding.\n- Use lights at night.\nLast month, three students were hurt in bike accidents. Two of them were not wearing helmets. Remember: a few seconds of care can save a life.","qs":[{"n":33,"q":"What are students asked to do?","o":["Follow safety rules.","Ride faster.","Buy new bikes.","Stop riding bikes."],"a":"A","e":"公告要求學生遵守騎車安全規則。"},{"n":34,"q":"What can we learn from the notice?","o":["Phones are useful on bikes.","Helmets can protect riders.","Lights are not needed at night.","No one was hurt last month."],"a":"B","e":"兩位受傷學生沒戴安全帽，可見安全帽能保護騎士。"}]},{"from":35,"to":37,"type":"短文","title":"The Library on Wheels","text":"In a remote part of Colombia, there is a teacher named Luis who owns a very special library. It is a truck full of books. Every weekend, he drives it to small villages where children have never had enough books to read. At first, Luis used only a few books from his own bookshelf. Then people from other cities heard about him and began to send him more. Today, there are over 4,000 books on his truck. Luis says, \"A book can take you anywhere. Even if you can't travel, you can see the whole world.\" The children wait for him every weekend with big smiles.","qs":[{"n":35,"q":"What does Luis do every weekend?","o":["He writes children's books.","He teaches at a school.","He drives a truck of books to villages.","He sells books in the city."],"a":"C","e":"他每週末開著裝滿書的卡車到偏遠小村莊。"},{"n":36,"q":"How did Luis get more books?","o":["He bought them from a bookstore.","He wrote them himself.","He borrowed them from a school.","People sent them to him."],"a":"D","e":"其他城市的人聽說後開始寄書給他。"},{"n":37,"q":"What does Luis mean by \"A book can take you anywhere\"?","o":["Reading lets you learn about the whole world.","Books are heavy to carry.","Books can fly.","You can travel without books."],"a":"A","e":"他的意思是即使不能旅行，也能透過閱讀看見全世界。"}]},{"from":38,"to":43,"type":"填空","title":"Saving Energy","text":"In many homes, a lot of electricity is wasted every day. For example, some people forget __38__ the lights off when they leave a room. Others leave their computers on all night. If we pay attention to small things, we can save a lot of energy. Last year, our school started a \"Save Energy\" project. Every class was asked __39__ the air conditioner at 26°C. The project has been successful, and the school __40__ more than $100,000 in electricity bills so far. Teachers say that students have become __41__ aware of the importance of saving energy. They even remind their parents __42__ the lights at home. This shows that young people can make a big __43__ in protecting the earth.","qs":[{"n":38,"q":"","o":["turn","turned","to turn","turning"],"a":"C","e":"forget to V 表示忘記去做某事。"},{"n":39,"q":"","o":["setting","set","to set","sets"],"a":"C","e":"be asked to V，被要求做某事。"},{"n":40,"q":"","o":["will save","saved","saves","has saved"],"a":"D","e":"so far 搭配現在完成式 has saved。"},{"n":41,"q":"","o":["much","more","most","very"],"a":"B","e":"become more aware of 表示「變得更加意識到」。"},{"n":42,"q":"","o":["turned off","to turn off","turn off","turning off"],"a":"B","e":"remind + 人 + to V，提醒某人去做某事。"},{"n":43,"q":"","o":["differently","difference","different","differences"],"a":"B","e":"make a big difference 表示「產生很大的影響」。"}]}]},{"n":16,"kind":"會考模擬（六）","scope":"第1～6冊全範圍：詞彙、文法、對話、圖表與短文閱讀、綜合測驗（含素養題材）","singles":[{"n":1,"q":"Please _____ your seat belt. The plane is going to take off soon.","o":["cover","fix","fasten","hang"],"a":"C","e":"fasten a seat belt 表示繫好安全帶。"},{"n":2,"q":"The little boy was _____ when he heard a strange noise in the dark.","o":["frightening","frightens","frightened","frighten"],"a":"C","e":"主詞是人，表示「感到害怕的」，用過去分詞 frightened。"},{"n":3,"q":"Sandy has a strong _____ for music. She started playing the violin at the age of four.","o":["pressure","power","passion","promise"],"a":"C","e":"have a passion for 表示對……充滿熱情。"},{"n":4,"q":"The news that our school team won the game _____ everyone happy.","o":["got","made","found","let"],"a":"B","e":"make + 受詞 + 形容詞，表示「使……」。"},{"n":5,"q":"You should _____ your teeth after every meal to keep them healthy.","o":["brush","paint","wash","clean up"],"a":"A","e":"刷牙用 brush。"},{"n":6,"q":"The new shopping mall, _____ opened last month, is always crowded.","o":["who","that","where","which"],"a":"D","e":"非限定子句，逗號後面不能用 that，先行詞是物，用 which。"},{"n":7,"q":"I have no idea _____ I should do to improve my English.","o":["who","what","whose","that"],"a":"B","e":"what I should do 作 idea 的內容，表示「我應該做什麼」。"},{"n":8,"q":"Jim spent two hours _____ the report last night.","o":["write","wrote","to write","writing"],"a":"D","e":"spend + 時間 + V-ing。"},{"n":9,"q":"The movie is worth _____ again.","o":["see","seeing","seen","to see"],"a":"B","e":"be worth + V-ing。"},{"n":10,"q":"A: I got an A on my science test! B: _____! You studied so hard.","o":["That's too bad","Never mind","Take it easy","Congratulations"],"a":"D","e":"對方考了 A，恭喜用 Congratulations。"},{"n":11,"q":"By the time I got to the party, all the cake _____.","o":["had been eaten","has eaten","is eaten","was eating"],"a":"A","e":"到達之前蛋糕就已被吃完，用過去完成式被動 had been eaten。"},{"n":12,"q":"Tom, _____ the bus, was late for school.","o":["to miss","missing","missed","misses"],"a":"B","e":"分詞構句，Tom 主動錯過公車，用現在分詞 missing（= Because he missed the bus）。"},{"n":13,"q":"Not only Mary but also her brothers _____ going to the party.","o":["am","are","be","is"],"a":"B","e":"not only...but also 的動詞與靠近的 her brothers 一致，用 are。"},{"n":14,"q":"The girl was _____ shy that she couldn't say a word in front of the class.","o":["very","too","so","such"],"a":"C","e":"so + 形容詞 + that 子句。"},{"n":15,"q":"If I _____ a million dollars, I would travel around the world.","o":["had","have","will have","would have"],"a":"A","e":"與現在事實相反的假設，if 子句用過去式 had。"},{"n":16,"q":"We can see that the earth _____ warmer and warmer these days.","o":["has got","got","gets","is getting"],"a":"D","e":"近來地球越來越暖，用現在進行式表示正在持續的變化。"},{"n":17,"q":"It's difficult for me _____ the meaning of this sentence.","o":["understood","to understand","understanding","understand"],"a":"B","e":"It is + 形容詞 + for + 人 + to V。"},{"n":18,"q":"My cousin asked me whether I _____ him with his homework.","o":["could help","am helping","help","helped"],"a":"A","e":"間接問句詢問「能不能幫他」，用 could help 表示可能性。"},{"n":19,"q":"A poster in the school says: \"Think before you share online.\" What does it want students to do?","o":["Share only with teachers.","Check information before posting.","Stop using the Internet.","Share everything quickly."],"a":"B","e":"先思考再分享，要確認資訊後再發佈。"}],"groups":[{"from":20,"to":22,"type":"廣告","title":"Eco Bags for Sale","text":"Eco Bags - Made from Recycled Bottles\nEach bag uses about 10 old plastic bottles!\nSmall bag: $150\nMedium bag: $250\nLarge bag: $350\nBuy any two bags and get 10% off.\nBring your own old bottles to our shop, and we'll give you $20 off for every 10 bottles.\nOpen daily: 10:00 a.m. - 8:00 p.m.\nTogether, we can make the earth cleaner!","qs":[{"n":20,"q":"What are the bags made from?","o":["Recycled bottles.","Old clothes.","Paper.","Cloth from farms."],"a":"A","e":"這些袋子由回收瓶子製成。"},{"n":21,"q":"Anna buys one medium bag and one large bag. How much does she pay?","o":["$450","$540","$600","$500"],"a":"B","e":"兩個袋子 $250+$350=$600，打九折是 $540。"},{"n":22,"q":"How can people get $20 off?","o":["By buying two bags.","By telling a friend.","By visiting on Sundays.","By bringing ten old bottles."],"a":"D","e":"帶來十個舊瓶子就可折抵 $20。"}]},{"from":23,"to":24,"type":"短文","title":"The Wrong Direction","text":"Ben was driving to his friend's wedding when his GPS told him to turn left. But Ben knew a shorter way, so he ignored it and turned right. Ten minutes later, he found that the road was closed. He had to go back and take the way the GPS had shown. By the time he arrived, the wedding had already started. Everyone turned and looked at him. Ben felt embarrassed. Afterwards, his friend laughed and said, \"It's okay. Even smart people sometimes need help from a machine.\" Ben learned that being too sure of himself is not always a good thing.","qs":[{"n":23,"q":"Why was Ben late for the wedding?","o":["He ignored the GPS and took a closed road.","He forgot the address.","His car broke down.","He stopped to buy a gift."],"a":"A","e":"他不聽導航，選了一條封閉的路，只好繞回來。"},{"n":24,"q":"What did Ben learn?","o":["GPS is always wrong.","He should not drive alone.","He shouldn't be too sure of himself.","Weddings start late."],"a":"C","e":"他學到太過自信不一定是好事。"}]},{"from":25,"to":27,"type":"對話","title":"Online Shopping","text":"Eric: Did you see the sale on the website? Everything is 50% off today!\nFiona: Really? That sounds too good to be true.\nEric: It's a well-known brand, so it should be real. I'm going to buy a pair of shoes.\nFiona: Be careful. Last week, my friend bought a bag from a similar website. It never arrived.\nEric: Oh no. How can I know if the website is safe?\nFiona: First, check whether the web address begins with \"https.\" Second, read other customers' reviews. If many people complain, don't buy.\nEric: Good advice. I'll check before I pay.","qs":[{"n":25,"q":"What did Fiona's friend experience?","o":["The bag she ordered never arrived.","She bought shoes at half price.","The website closed.","She was given a free bag."],"a":"A","e":"她朋友買的包包從未送達。"},{"n":26,"q":"What does Fiona mean by \"too good to be true\"?","o":["She doubts the sale is real.","She will buy something.","She is sure the sale is real.","She wants to share the news."],"a":"A","e":"太好了反而不像真的，表示她對促銷有所懷疑。"},{"n":27,"q":"What should Eric do before paying?","o":["Call the brand.","Ask Fiona to buy for him.","Wait for a week.","Read reviews and check the web address."],"a":"D","e":"Fiona 建議他先檢查網址，並閱讀其他顧客的評價。"}]},{"from":28,"to":29,"type":"電子郵件","title":"Volunteering Abroad","text":"To: Mom and Dad\nFrom: Alex\nSubject: Greetings from Nepal\nDear Mom and Dad,\nI've been in Nepal for one week now. I'm staying in a small village and teaching English to children at the local school. The classrooms are very simple, but the children are eager to learn. I was worried about the food at first, but the family I'm staying with cooks wonderful dishes. Tomorrow, we will hike to a nearby temple with some students. I miss you both, but this experience is changing the way I see the world. I'll send photos soon.\nLove, Alex","qs":[{"n":28,"q":"What is Alex doing in Nepal?","o":["Traveling alone.","Teaching English to children.","Working in a restaurant.","Studying at a university."],"a":"B","e":"他在村裡的學校教孩子英文。"},{"n":29,"q":"How does Alex feel about the experience?","o":["It is too simple.","It is boring.","It is dangerous.","It is changing his view of the world."],"a":"D","e":"他說這個經驗正在改變他看世界的方式。"}]},{"from":30,"to":32,"type":"圖表","title":"Recycling Rates","text":"The table shows how much plastic waste was recycled in four cities last year.\nCity A: 60%\nCity B: 45%\nCity C: 30%\nCity D: 15%\nExperts say that cities with more recycling bins and better education have higher recycling rates.","qs":[{"n":30,"q":"Which city recycled the most plastic?","o":["City B.","City C.","City A.","City D."],"a":"C","e":"City A 的回收率 60%，最高。"},{"n":31,"q":"How much higher is City B's recycling rate than City D's?","o":["15%","30%","45%","60%"],"a":"B","e":"45% 減 15% 等於 30%。"},{"n":32,"q":"What can we learn from the experts?","o":["City D has the best education.","Education can help increase recycling.","Big cities recycle less.","Recycling bins are not important."],"a":"B","e":"專家說有更多回收桶與更好教育的城市回收率較高。"}]},{"from":33,"to":34,"type":"公告","title":"Fire Drill","text":"Fire Drill Notice\nOur school will hold a fire drill on Wednesday, May 3, at 10:20 a.m. When you hear the bell, stop what you are doing and walk quickly and quietly to the playground. Do not run, and do not take your bags. Teachers will check the number of students. The drill will take about fifteen minutes. This is only a practice, but please take it seriously. In a real fire, knowing what to do can save lives.","qs":[{"n":33,"q":"What should students do when they hear the bell?","o":["Call their parents.","Stay in the classroom.","Take their bags and run.","Walk to the playground."],"a":"D","e":"聽到鈴聲後要快速、安靜地走到操場。"},{"n":34,"q":"Why does the school hold the drill?","o":["To make students late.","To let students know what to do in a fire.","To test the bell.","To clean the playground."],"a":"B","e":"演習讓學生在真正的火災中知道怎麼做。"}]},{"from":35,"to":37,"type":"短文","title":"Fake News","text":"Every day we see news on social media, but not all of it is true. Fake news can spread quickly because it is often shocking or exciting, and people share it before thinking. In 2013, a false report said that a famous company was going to close, and its stock price fell sharply within an hour. Later, people found that the report was made by someone who wanted to make money. To avoid being fooled, experts suggest we ask three questions: Who wrote it? Where did the information come from? Do other reliable news sources report the same thing? If we cannot answer these questions, we should not share it.","qs":[{"n":35,"q":"Why does fake news spread quickly?","o":["It is written by experts.","It is free.","It is shocking or exciting, so people share it quickly.","It is always long."],"a":"C","e":"假新聞常令人震驚或興奮，大家沒細想就分享。"},{"n":36,"q":"What happened after the false report about the company?","o":["The company opened a new shop.","The company's stock price fell sharply.","The stock price went up.","The company was sold."],"a":"B","e":"假報導出現後，該公司股價在一小時內暴跌。"},{"n":37,"q":"According to the passage, what should we do if we can't check the source?","o":["Write a comment.","Believe it.","Not share it.","Share it with friends."],"a":"C","e":"如果無法回答這些問題，就不應該分享。"}]},{"from":38,"to":43,"type":"填空","title":"The Value of Time","text":"Time is the most valuable thing we have, but many of us __38__ it without noticing. A student once told me that he spent about five hours a day playing games. He felt tired and __39__ behind in school. I asked him, \"What would you do __40__ you had two more hours every day?\" He thought for a moment and said, \"I would learn to play the guitar.\" I told him that he __41__ have those two hours if he cut down on game time. A few weeks later, he told me he had started to learn the guitar, and he felt __42__ than before. The lesson is clear: if we use our time wisely, we can do things __43__ really matter to us.","qs":[{"n":38,"q":"","o":["wasted","wasting","wastes","waste"],"a":"D","e":"many of us 是複數，現在簡單式用原形動詞 waste。"},{"n":39,"q":"","o":["got","get","was getting","gets"],"a":"A","e":"描述過去的情況，與 felt 並列，用過去式 got behind。"},{"n":40,"q":"","o":["if","until","unless","because"],"a":"A","e":"假設語氣，如果每天多兩小時，用 if。"},{"n":41,"q":"","o":["can","will","could","must"],"a":"C","e":"配合 told 的過去時態，並表示可能，用 could。"},{"n":42,"q":"","o":["more happily","happiest","happy","happier"],"a":"D","e":"後面有 than before，用比較級 happier。"},{"n":43,"q":"","o":["who","what","which","whose"],"a":"C","e":"先行詞是 things，作 matter 的主詞，用 which（或 that）。"}]}]}];
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=t=>esc(t).replace(/__(\d+)__/g,'<span class="blank">$1</span>');
const KEY=n=>'mock-exam-v1-'+n;
let cur=null,state=null,clock=null;
function allQs(s){const a=s.singles.map(q=>({...q}));s.groups.forEach(g=>g.qs.forEach(q=>a.push({...q})));return a.sort((x,y)=>x.n-y.n)}
function load(n){try{return JSON.parse(localStorage.getItem(KEY(n)))||null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY(cur.n),JSON.stringify(state))}catch(e){}}
function cards(){const box=$('#cards');box.innerHTML='';[['分冊複習（回 1～10）',s=>s.n<=10],['會考模擬（回 11～16）',s=>s.n>10]].forEach(([h,f])=>{const t=document.createElement('h2');t.className='sect';t.textContent=h;box.appendChild(t);const g=document.createElement('div');g.className='grid';DATA.filter(f).forEach(s=>{const st=load(s.n);const done=st?Object.keys(st.ans||{}).length:0;const b=document.createElement('button');b.className='exam';b.innerHTML='<strong>第 '+s.n+' 回</strong><em>'+esc(s.kind)+'</em><span>'+esc(s.scope.length>34?s.scope.slice(0,34)+'…':s.scope)+'</span>'+(st&&st.done?'<span>✅ 已交卷：'+st.score+' / 43</span>':done?'<span>作答中：'+done+' / 43</span>':'');b.onclick=()=>open(s.n);g.appendChild(b)});box.appendChild(g)})}
function open(n){cur=DATA.find(s=>s.n===n);state=load(n)||{ans:{},elapsed:0,done:false};state.ans=state.ans||{};$('#choose').classList.add('hidden');$('#workspace').classList.remove('hidden');$('#title').textContent='第 '+n+' 回｜'+cur.kind;$('#scope').textContent='範圍：'+cur.scope;render();stopClock();tick();window.scrollTo(0,0)}
function render(){const qs=allQs(cur),paper=$('#paper');let h='<div class="part">一、單題（1～19 題）</div>';cur.singles.forEach(q=>h+=qHtml(q));h+='<div class="part">二、題組（20～43 題）</div>';cur.groups.forEach(g=>{h+='<div class="grp"><h3>第 '+g.from+(g.to>g.from?'～'+g.to:'')+' 題｜'+esc(g.type)+'：'+esc(g.title)+'</h3><div class="passage">'+fmt(g.text)+'</div>';g.qs.forEach(q=>h+=qHtml(q));h+='</div>'});paper.innerHTML=h;$('#sheet').innerHTML=qs.map(q=>'<button class="sc" data-n="'+q.n+'" id="sc'+q.n+'">'+q.n+'<br><span>-</span></button>').join('');$('#jump').innerHTML='<option value="">跳至題號</option>'+qs.map(q=>'<option value="'+q.n+'">第 '+q.n+' 題</option>').join('');paper.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n,b.dataset.l));$('#sheet').querySelectorAll('.sc').forEach(b=>b.onclick=()=>go(+b.dataset.n));refresh()}
function qHtml(q){const L='ABCD';const stem=q.q?'<p class="stem"><span class="no">'+q.n+'.</span>'+fmt(q.q)+'</p>':'<p class="stem"><span class="no">'+q.n+'.</span>請選出最適合第 <span class="blank">'+q.n+'</span> 格的答案。</p>';return '<div class="q" id="q'+q.n+'">'+stem+'<div class="opts">'+q.o.map((o,i)=>'<button class="opt" data-n="'+q.n+'" data-l="'+L[i]+'"><b>('+L[i]+')</b><span>'+esc(o)+'</span></button>').join('')+'</div><div class="expl hidden" id="ex'+q.n+'"></div></div>'}
function choose(n,l){if(state.done)return;if(state.ans[n]===l)delete state.ans[n];else state.ans[n]=l;save();refresh()}
function refresh(){const qs=allQs(cur),L='ABCD';let c=0;qs.forEach(q=>{const a=state.ans[q.n];if(a)c++;const el=$('#q'+q.n);el.querySelectorAll('.opt').forEach(b=>{const l=b.dataset.l;b.className='opt';b.disabled=!!state.done;if(state.done){if(l===q.a)b.classList.add('ok');else if(l===a)b.classList.add('bad')}else if(l===a)b.classList.add('chosen')});const ex=$('#ex'+q.n);if(state.done){ex.classList.remove('hidden');ex.innerHTML='<b>'+(a===q.a?'✅ 答對':'❌ 你的答案：'+(a||'未作答')+'｜正確答案：'+q.a)+'</b><br>'+esc(q.e)}else ex.classList.add('hidden');const sc=$('#sc'+q.n);sc.className='sc'+(state.done?(a===q.a?' ok':' bad'):(a?' done':''));sc.lastChild.textContent=a||'-'});$('#count').textContent=c+' / 43 題';$('#fill').style.width=(c/43*100)+'%';$('#wrongWrap').classList.toggle('hidden',!state.done);if(state.done)showResult()}
function go(n){const e=$('#q'+n);if(e)e.scrollIntoView({behavior:'smooth',block:'center'})}
function showResult(){const qs=allQs(cur);const ok=qs.filter(q=>state.ans[q.n]===q.a).length;const no=qs.filter(q=>!state.ans[q.n]).length;state.score=ok;save();const r=$('#result');r.classList.remove('hidden');r.innerHTML='<div class="result"><div class="big">'+ok+' / 43</div><div>答對 '+ok+' 題・答錯 '+(43-ok-no)+' 題・未作答 '+no+' 題・用時 '+fmtT(state.elapsed)+'</div><div class="muted">單題 '+qs.filter(q=>q.n<=19&&state.ans[q.n]===q.a).length+' / 19・題組 '+qs.filter(q=>q.n>19&&state.ans[q.n]===q.a).length+' / 24。各題解析已顯示於題目下方。</div></div>'}
function fmtT(s){s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function tick(){const left=Math.max(0,3600-state.elapsed);$('#timer').textContent=fmtT(left)}
function startClock(){if(clock||state.done)return;let t0=Date.now()-state.elapsed*1000;clock=setInterval(()=>{state.elapsed=(Date.now()-t0)/1000;tick();if(state.elapsed%10<1)save()},500);$('#clockBtn').textContent='暫停計時'}
function stopClock(){if(clock){clearInterval(clock);clock=null;save()}$('#clockBtn').textContent='開始計時'}
$('#clockBtn').onclick=()=>clock?stopClock():startClock();
$('#finish').onclick=()=>{const un=allQs(cur).filter(q=>!state.ans[q.n]).length;if(state.done)return;if(un&&!confirm('還有 '+un+' 題未作答，確定交卷？'))return;stopClock();state.done=true;save();refresh();$('#result').scrollIntoView({behavior:'smooth'})};
$('#missing').onclick=()=>{const q=allQs(cur).find(q=>!state.ans[q.n]);if(q)go(q.n);else alert('全部題目都已作答！')};
$('#resetBtn').onclick=()=>{if(!confirm('清除本回所有作答並重新開始？'))return;stopClock();state={ans:{},elapsed:0,done:false};save();$('#result').classList.add('hidden');$('#onlyWrong').checked=false;filterWrong();render();tick()};
$('#jump').onchange=e=>{if(e.target.value)go(+e.target.value);e.target.value=''};
function filterWrong(){const on=$('#onlyWrong').checked;allQs(cur).forEach(q=>{$('#q'+q.n).classList.toggle('hidden',on&&state.ans[q.n]===q.a)})}
$('#onlyWrong').onchange=filterWrong;
$('#back').onclick=()=>{stopClock();$('#workspace').classList.add('hidden');$('#choose').classList.remove('hidden');cards();window.scrollTo(0,0)};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&clock)save()});
cards();
</script></body></html>
