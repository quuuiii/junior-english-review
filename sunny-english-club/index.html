<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff7e6">
<title>Sunny English Club ☀️</title>
<style>
:root{--ink:#30405c;--cream:#fff8e9;--yellow:#ffe08b;--sky:#bde6fb;--green:#c4efd1;--pink:#ffd0c6;--purple:#e4d8ff;--shadow:0 8px 0 #dce1e6;--line:#e6e9ed}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{touch-action:manipulation}body{margin:0;background:radial-gradient(circle at 10% 8%,#fff0c4,transparent 28%),radial-gradient(circle at 92% 20%,#e2f4ff,transparent 30%),var(--cream);color:var(--ink);font-family:ui-rounded,'Trebuchet MS',system-ui,Arial,sans-serif;-webkit-user-select:none;user-select:none}button{touch-action:manipulation;min-height:52px;font:inherit;color:inherit;cursor:pointer;border:0}button:focus-visible{outline:4px solid #477bd0;outline-offset:4px}button:disabled{cursor:default;opacity:.65}.shell{width:min(1100px,100%);margin:auto;padding:16px clamp(12px,3vw,30px) 55px}.header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;background:#ffffffd9;border:2px solid white;border-radius:28px;padding:14px 22px;box-shadow:0 5px 0 #ecdfc9}.brand h1{font-size:clamp(25px,4.6vw,43px);margin:0;line-height:1.15}.brand p{font-size:clamp(13px,2vw,17px);margin:6px 0 0;color:#718095}.scores{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.score{border-radius:20px;background:var(--yellow);padding:12px 17px;font-size:20px;font-weight:900;box-shadow:0 4px 0 #e8c161}.iconbtn{width:54px;height:54px;border-radius:18px;background:var(--sky);box-shadow:0 4px 0 #8dc3dd;font-size:23px}.hero{text-align:center;margin:28px auto 18px}.hero h2{font-size:clamp(26px,5vw,42px);margin:4px}.muted{color:#6f7f94}.topicgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:17px;margin-top:18px}.tile{border-radius:26px;padding:24px 14px;text-align:center;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s;position:relative;background:white;border:2px solid #fff}.tile:hover,.card-button:hover,.choice:hover{transform:translateY(-3px)}.tile:active,.choice:active,.pill:active{transform:translateY(3px);box-shadow:0 3px 0 #cad5db}.tile .art{font-size:64px;display:block;margin:0 0 7px}.tile strong{display:block;font-size:24px}.tile small{display:block;font-size:15px;margin-top:7px}.tile:nth-child(4n+1){background:var(--pink)}.tile:nth-child(4n+2){background:var(--yellow)}.tile:nth-child(4n+3){background:var(--sky)}.tile:nth-child(4n){background:var(--green)}.panel{background:#fff;border:2px solid #f5f0e8;border-radius:30px;padding:clamp(17px,3vw,29px);box-shadow:var(--shadow);margin:20px 0}.topline{display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap}.pill{border-radius:20px;padding:12px 20px;background:var(--sky);box-shadow:0 4px 0 #93c1d9;font-weight:900;font-size:17px}.pill.pink{background:var(--pink);box-shadow:0 4px 0 #e6aca2}.pill.green{background:var(--green);box-shadow:0 4px 0 #92c9a5}.pill.yellow{background:var(--yellow);box-shadow:0 4px 0 #d7bb70}.tabbar{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:20px 0}.tab{min-height:70px;border-radius:22px;background:#eff1f5;font-size:clamp(15px,2vw,20px);font-weight:900;padding:10px}.tab[aria-selected=true]{background:var(--yellow);box-shadow:inset 0 -5px 0 #ecc56d}.flip-wrap{perspective:1000px;margin:25px auto;max-width:430px}.flashcard{width:100%;height:310px;background:transparent;position:relative;border-radius:28px;transform-style:preserve-3d;transition:transform .55s}.flashcard.is-flipped{transform:rotateY(180deg)}.side{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border-radius:28px;border:3px solid #fff;box-shadow:0 8px 0 #dbe5e9;background:var(--sky);padding:16px}.side.back{transform:rotateY(180deg);background:var(--green)}.side .art{font-size:85px;line-height:1.2}.side .word{font-size:clamp(30px,6vw,48px);font-weight:900}.side .cn{font-size:24px;font-weight:900}.side .example{font-size:20px}.actionrow{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:15px 0}.counter{font-weight:900;font-size:18px}.choicegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:22px}.choice{border-radius:24px;min-height:94px;background:var(--sky);box-shadow:0 5px 0 #91c8e3;font-size:clamp(21px,4vw,30px);font-weight:900;overflow-wrap:anywhere;padding:12px}.choice:nth-child(2){background:var(--pink);box-shadow:0 5px 0 #e7afa1}.choice:nth-child(3){background:var(--green);box-shadow:0 5px 0 #a0ccaa}.choice:nth-child(4){background:var(--yellow);box-shadow:0 5px 0 #e4c775}.choice.correct{background:#a5e9b1}.choice.wrong{animation:shake .35s}.prompt{text-align:center}.prompt .art{font-size:100px}.prompt h3{font-size:clamp(26px,5vw,36px);margin:12px}.feedback{text-align:center;min-height:42px;font-size:24px;font-weight:900;margin:12px}.matches{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;max-width:670px;margin:22px auto}.memory{height:clamp(82px,15vw,116px);border-radius:20px;background:var(--sky);box-shadow:0 5px 0 #91bdd5;position:relative;font-size:clamp(23px,5vw,35px);font-weight:900;overflow-wrap:anywhere;padding:5px}.memory.flipped,.memory.matched{background:var(--yellow)}.memory.matched{background:var(--green);box-shadow:0 5px 0 #92c9a5}.memory .word{font-size:clamp(15px,3vw,22px)}.memory .art{font-size:clamp(30px,6vw,48px)}.memory.wrong{animation:shake .35s}.banner{text-align:center;font-size:clamp(24px,4.5vw,36px);font-weight:900;background:var(--green);padding:20px;border-radius:25px}.banner .big{font-size:70px}.section-title{margin-top:35px;font-size:26px}.lesson-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:10px}.mini{border:2px solid #eee;border-radius:19px;background:#fff8ec;text-align:center;padding:10px;min-height:106px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.mini .art{font-size:38px}.mini span:last-child{font-size:18px;font-weight:900}footer{text-align:center;padding-top:16px;color:#77859b;font-size:15px}#confetti{position:fixed;pointer-events:none;inset:0;width:100%;height:100%;z-index:30}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}50%{transform:translateX(9px)}75%{transform:translateX(-5px)}}@media(max-width:570px){.header{justify-content:center;text-align:center}.topline{justify-content:center}.tab{font-size:14px}.panel{padding:14px}.matches{gap:7px}.memory{border-radius:14px}.score{font-size:17px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<canvas id="confetti" aria-hidden="true"></canvas>
<div class="shell"><header class="header"><div class="brand"><h1>☀️ Sunny English Club</h1><p>Look • Listen • Play • Learn</p></div><div class="scores"><div id="score" class="score" aria-live="polite">⭐ Score: 0</div><button id="soundBtn" class="iconbtn" aria-label="Sound on or off" type="button">🔊</button></div></header><main id="app"></main><footer>Little words, big smiles! 🌈</footer></div>
<script>
'use strict';
/* Topic data: English word, Traditional Chinese meaning, emoji, easy sentence. */
const topicData=[
{id:'animals',name:'Animals',icon:'🐻',items:[['cat','貓','🐱','The cat is cute.'],['dog','狗','🐶','The dog can run.'],['lion','獅子','🦁','The lion is big.'],['bear','熊','🐻','The bear is brown.'],['fish','魚','🐟','The fish can swim.'],['duck','鴨子','🦆','The duck is yellow.'],['frog','青蛙','🐸','The frog can jump.'],['rabbit','兔子','🐰','The rabbit can hop.']]},
{id:'fruits',name:'Colors & Fruits',icon:'🍎',items:[['apple','蘋果','🍎','I like red apples.'],['banana','香蕉','🍌','The banana is yellow.'],['orange','橘子','🍊','I have an orange.'],['grape','葡萄','🍇','The grapes are purple.'],['strawberry','草莓','🍓','This is a strawberry.'],['watermelon','西瓜','🍉','I like watermelon.'],['red','紅色','🟥','The apple is red.'],['blue','藍色','🟦','The sky is blue.']]},
{id:'objects',name:'Daily Objects',icon:'🎒',items:[['book','書','📘','This is my book.'],['pencil','鉛筆','✏️','I have a pencil.'],['bag','書包','🎒','My bag is blue.'],['chair','椅子','🪑','Sit on the chair.'],['bed','床','🛏️','This is my bed.'],['cup','杯子','🥤','The cup is red.'],['ball','球','⚽','I can kick the ball.'],['clock','時鐘','🕒','Look at the clock.']]}
];
const weeks=[
{n:1,emoji:'🐱',title:'Little Words',words:['the','in','on','is','big','little'],sentences:['The cat is in the box.','The dog is big.']},
{n:2,emoji:'😊',title:'Me & You',words:['I','am','you','are','he','she'],sentences:['I am happy.','You are sad.','She is happy.']},
{n:3,emoji:'🦊',title:'Numbers',words:['have','has','it','one','two','four'],sentences:['It has one tail.','I have two eyes.']},
{n:4,emoji:'🧸',title:'Let’s Play',words:['can','play','with','me','around','cannot'],sentences:['I cannot run around.','Can you play with me?']},
{n:5,emoji:'🌈',title:'Let’s Go',words:['do','like','to','go','went','see'],sentences:['Do you like to go to the zoo?','I see a rainbow.','They went to the supermarket.']},
{n:6,emoji:'🎁',title:'Kind Words',words:['please','give','get','come','down','up'],sentences:['Please, come down.','Please, get up now.','Please give me that book.']},
{n:7,emoji:'📖',title:'Here & There',words:['this','that','there','was','friend','here'],sentences:['This book was here.','That cup is pink.','My friend went to the beach.']},
{n:8,emoji:'🌸',title:'We & They',words:['we','they','smell','then','find','too'],sentences:['We smell the flowers, too.','They find the keys, then leave.','I brush my teeth, then go to sleep.']},
{n:9,emoji:'👨‍👩‍👧',title:'My Family',words:['your','my','mother','father','said','good'],sentences:['Your friends are good.','My mother said, “Go to bed.”','My father said, “Help me.”']},
{n:10,emoji:'🐈',title:'Where Is It?',words:['where','under','goes','at','against','from'],sentences:['Where is the cat?','It goes under the table.','I am from Taiwan.']},
{n:11,emoji:'🐢',title:'Animal Fun',words:['a','an','live','into','often','out'],sentences:['A turtle often lives in the sea.','An elephant walks into the cave.','A hamster always sleeps.']},
{n:12,emoji:'🍎',title:'Why & Because',words:['why','because','some','people','always','all'],sentences:['Why do all people eat?','Because they are always hungry.','Why are some children wearing masks?']}
];
const phonics=[
{sound:'a',emoji:'🐜',title:'Short A',words:['pat','tap','snap','hat','back','stand','bad','hand','flag','ant']},
{sound:'e',emoji:'🐔',title:'Short E',words:['red','pet','pen','hen','get','leg','neck','best','pest','test']},
{sound:'i',emoji:'🧱',title:'Short I',words:['in','tin','six','twin','kiss','drip','grill','sniff','brick','lick']},
{sound:'o',emoji:'🐸',title:'Short O',words:['pot','dog','soft','not','log','fox','frog','box','hot','spot']},
{sound:'ai',emoji:'🌧️',title:'Long A',words:['rain','train','wait','rainbow','paint','tail','snail','brain','raindrops','paintbrush']},
{sound:'ee',emoji:'🌳',title:'Long E',words:['jeep','feel','free','feet','green','creep','street','screen','asleep','coffee']},
{sound:'ie',emoji:'🥧',title:'Long I',words:['lie','tie','die','pie','cried','fries','magpie','untie','flies','dries']},
{sound:'oa',emoji:'⛵',title:'Long O',words:['boat','goat','float','moat','coat','road','coach','raincoat','unload','afloat']},
{sound:'ue',emoji:'🧻',title:'Long U',words:['cue','fuel','argue','hue','value','tissue','rescue','continue','statue','barbecue']}
];
const icons={the:'📖',in:'📦',on:'🔝',is:'✅',big:'🐘',little:'🐁',I:'🙋',am:'😊',you:'🫵',are:'👫',he:'👦',she:'👧',have:'🎒',has:'🧸',it:'🐱',one:'1️⃣',two:'2️⃣',four:'4️⃣',can:'💪',play:'🧩',with:'🤝',me:'🙋',around:'🔄',cannot:'🚫',do:'✅',like:'❤️',to:'➡️',go:'🏃',went:'🚶',see:'👀',please:'🙏',give:'🎁',get:'🫴',come:'👋',down:'👇',up:'👆',this:'👇',that:'👉',there:'📍',was:'⌛',friend:'🧑‍🤝‍🧑',here:'📌',we:'👫',they:'👬',smell:'🌸',then:'➡️',find:'🔎',too:'➕',your:'👉',my:'💛',mother:'👩',father:'👨',said:'💬',good:'👍',where:'❓',under:'🪑',goes:'🚶',at:'📍',against:'🧱',from:'🏠',a:'🍎',an:'🐘',live:'🏡',into:'📥',often:'🔁',out:'📤',why:'🤔',because:'💡',some:'🍪',people:'👨‍👩‍👧‍👦',always:'🔄',all:'🌎',pat:'🐱',tap:'👆',snap:'🫰',hat:'👒',back:'🔙',stand:'🧍',bad:'👎',hand:'✋',flag:'🚩',ant:'🐜',red:'🟥',pet:'🐶',pen:'🖊️',hen:'🐔',get:'🎁',leg:'🦵',neck:'👤',best:'🏆',pest:'🦟',test:'📝',tin:'🥫',six:'6️⃣',twin:'👭',kiss:'😘',drip:'💧',grill:'🍢',sniff:'👃',brick:'🧱',lick:'😋',pot:'🍲',dog:'🐕',soft:'🧸',not:'❌',log:'🪵',fox:'🦊',frog:'🐸',box:'📦',hot:'☀️',spot:'🐾',rain:'🌧️',train:'🚂',wait:'⏳',rainbow:'🌈',paint:'🎨',tail:'🐈',snail:'🐌',brain:'🧠',raindrops:'💧',paintbrush:'🖌️',jeep:'🚙',feel:'😊',free:'🕊️',feet:'🦶',green:'💚',creep:'🐆',street:'🛣️',screen:'🖥️',asleep:'😴',coffee:'☕',lie:'🤥',tie:'👔',die:'🎲',pie:'🥧',cried:'😭',fries:'🍟',magpie:'🐦',untie:'🪢',flies:'🪰',dries:'🌵',boat:'🚣',goat:'🐐',float:'🛟',moat:'🏰',coat:'🧥',road:'🛣️',coach:'⚽',raincoat:'🧥',unload:'📦',afloat:'🧑‍🚀',cue:'🎱',fuel:'⛽',argue:'🗣️',hue:'🌈',value:'💎',tissue:'🧻',rescue:'🚒',continue:'▶️',statue:'🗽',barbecue:'🍖'};

const lessonGroups=[...weeks.map((v,i)=>({id:'week-'+(i+1),name:'Week '+(i+1),icon:v.emoji,items:v.words.map(w=>[w,'',icons[w]||'⭐',v.sentences.find(s=>s.toLowerCase().includes(w.toLowerCase()))||'Say: '+w+'.'])})),...phonics.map(v=>({id:'sound-'+v.sound,name:'Phonics '+v.sound.toUpperCase(),icon:v.emoji,items:v.words.map(w=>[w,'',icons[w]||'⭐','Say: '+w+'.'])}))];
const allTopics=[...topicData,...lessonGroups];
const app=document.getElementById('app');
const $=id=>document.getElementById(id);
const escapeHTML=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rand=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
let data={stars:0,completed:{}};
try{let saved=JSON.parse(localStorage.getItem('sunny-v3')||'null');if(saved&&typeof saved.stars==='number'&&saved.completed&&typeof saved.completed==='object')data=saved}catch(e){}
function save(){try{localStorage.setItem('sunny-v3',JSON.stringify(data))}catch(e){}$('score').textContent='⭐ Score: '+data.stars}
let sound=true,selected=topicData[0],mode='flash',idx=0,flipped=false,quiz=[],qpos=0,quizLocked=false,pairs=[],opened=[],matchLocked=false,matched=0,session=0;
function speak(text){if(!sound||!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.78;u.pitch=1.08;speechSynthesis.speak(u)}catch(e){}}
let ctx;function beep(ok=true){if(!sound)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(ok?600:250,ctx.currentTime);if(ok)o.frequency.exponentialRampToValueAtTime(950,ctx.currentTime+.16);g.gain.setValueAtTime(.13,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.24);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+.25)}catch(e){}}
$('soundBtn').onclick=()=>{sound=!sound;$('soundBtn').textContent=sound?'🔊':'🔇';if(!sound&&'speechSynthesis'in window)speechSynthesis.cancel()};
function award(n){data.stars+=n;save();beep(true)}
function complete(modeName){const key=selected.id+':'+modeName;data.completed[key]=(data.completed[key]||0)+1;save()}
function button(label,fn,cl='pill'){return `<button type="button" class="${cl}" data-act="${fn}">${label}</button>`}
function home(){session++;app.innerHTML=`<section class="hero"><h2>Pick a happy place! 🌈</h2><p class="muted">Tap a topic. Learn new words. Win stars!</p></section><div class="topicgrid">${topicData.map(t=>tile(t)).join('')}</div><h2 class="section-title">📚 Sight Words</h2><div class="topicgrid">${lessonGroups.slice(0,12).map(t=>tile(t)).join('')}</div><h2 class="section-title">🔤 Phonics</h2><div class="topicgrid">${lessonGroups.slice(12).map(t=>tile(t)).join('')}</div>`}
function tile(t){return `<button type="button" class="tile" data-open="${escapeHTML(t.id)}"><span class="art">${t.icon}</span><strong>${escapeHTML(t.name)}</strong><small>${t.items.length} words ${Object.keys(data.completed).some(k=>k.startsWith(t.id+':'))?'• 🏅':''}</small></button>`}
function choose(id){const t=allTopics.find(t=>t.id===id);if(!t)return;session++;selected=t;mode='flash';idx=0;flipped=false;render()}
function render(){app.innerHTML=`<section class="panel"><div class="topline">${button('← All Topics','home','pill pink')}<h2>${selected.icon} ${escapeHTML(selected.name)}</h2><span class="muted">${selected.items.length} words</span></div><div class="tabbar" role="tablist" aria-label="Play modes">${[['flash','🃏 Flashcards'],['quiz','⭐ Quiz Challenge'],['match','🧩 Matching Game']].map(([id,label])=>`<button role="tab" aria-selected="${mode===id}" type="button" class="tab" data-tab="${id}">${label}${data.completed[selected.id+':'+id]?' ✅':''}</button>`).join('')}</div><div id="activity" role="tabpanel"></div></section>`;if(mode==='flash')renderFlash();else if(mode==='quiz')startQuiz();else startMatching()}
function changeMode(m){if(!['flash','quiz','match'].includes(m))return;session++;mode=m;idx=0;flipped=false;render()}
function renderFlash(){const item=selected.items[idx],act=$('activity');act.innerHTML=`<p class="muted prompt">Tap the card to flip it!</p><div class="flip-wrap"><button type="button" id="flash" class="flashcard${flipped?' is-flipped':''}" aria-label="Flip card"><span class="side front"><span class="art">${item[2]}</span><span class="word">${escapeHTML(item[0])}</span><span class="muted">Tap to flip ↻</span></span><span class="side back"><span class="cn">${escapeHTML(item[1]||item[0])}</span><span class="example">${escapeHTML(item[3])}</span><span class="muted">Tap to turn back ↻</span></span></button></div><p class="counter prompt">${idx+1} / ${selected.items.length}</p><div class="actionrow">${button('⬅ Back','prev','pill pink')}${button('🔊 Listen','listen','pill yellow')}${button('Next ➜','next','pill green')}</div><div class="lesson-grid">${selected.items.map((x,i)=>`<button type="button" class="mini" data-card="${i}" aria-label="Show ${escapeHTML(x[0])}"><span class="art">${x[2]}</span><span>${escapeHTML(x[0])}</span></button>`).join('')}</div><p class="feedback" id="flashNotice" aria-live="polite"></p>`;$('flash').onclick=()=>{flipped=!flipped;$('flash').classList.toggle('is-flipped',flipped);if(flipped)speak(item[3])}}
function nextCard(n){idx=(idx+n+selected.items.length)%selected.items.length;flipped=false;renderFlash();speak(selected.items[idx][0]);if(n>0&&idx===0){complete('flash');$('flashNotice').textContent='🌟 You saw all the cards!'}}
function startQuiz(){quiz=rand(selected.items).slice(0,Math.min(8,selected.items.length));qpos=0;quizLocked=false;drawQuestion()}
function drawQuestion(){if(qpos===quiz.length){complete('quiz');finish('Quiz complete! 🎉','You did it! Keep shining!',2);return}quizLocked=false;const item=quiz[qpos],options=rand([item,...rand(selected.items.filter(x=>x!==item)).slice(0,3)]);$('activity').innerHTML=`<div class="prompt"><p class="counter">Question ${qpos+1} / ${quiz.length}</p><div class="art" style="font-size:98px">${item[2]}</div><h3>What is it?</h3>${button('🔊 Listen','listenQuiz','pill yellow')}</div><div class="choicegrid">${options.map(x=>`<button class="choice" type="button" data-answer="${escapeHTML(x[0])}">${escapeHTML(x[0])}</button>`).join('')}</div><p id="feedback" class="feedback" role="status" aria-live="polite"></p>`}
function answer(word,el){if(quizLocked)return;const ok=quiz[qpos][0]===word;if(ok){quizLocked=true;el.classList.add('correct');$('feedback').textContent='Great job! ⭐ +1';award(1);confetti();const token=session;setTimeout(()=>{if(token!==session)return;qpos++;drawQuestion()},1100)}else{el.classList.remove('wrong');void el.offsetWidth;el.classList.add('wrong');$('feedback').textContent='Try again! 💛';beep(false)}}
function startMatching(){const items=rand(selected.items).slice(0,6);pairs=rand(items.flatMap((item,i)=>[{id:i,type:'pic',value:item[2],word:item[0]},{id:i,type:'word',value:item[0],word:item[0]}]));opened=[];matched=0;matchLocked=false;drawMatch()}
function drawMatch(){const card=(p,i)=>`<button type="button" class="memory${p.open?' flipped':''}${p.done?' matched':''}" data-memory="${i}" aria-label="Memory card ${i+1}" ${p.done?'disabled':''}>${p.open||p.done?(p.type==='pic'?`<span class="art">${p.value}</span>`:`<span class="word">${escapeHTML(p.value)}</span>`):'❔'}</button>`;$('activity').innerHTML=`<div class="prompt"><h3>Find the matching pairs! 🧩</h3><p class="muted">Match a picture with a word.</p><p class="counter">Pairs: ${matched} / 6</p></div><div class="matches">${pairs.map(card).join('')}</div><p id="feedback" class="feedback" aria-live="polite"></p>`}
function flipMatch(i){const p=pairs[i];if(matchLocked||p.open||p.done)return;p.open=true;opened.push(i);drawMatch();if(opened.length===2){matchLocked=true;const [a,b]=opened,yes=pairs[a].id===pairs[b].id&&pairs[a].type!==pairs[b].type;if(yes){pairs[a].done=pairs[b].done=true;matched++;beep();speak(pairs[a].word);$('feedback').textContent='A match! 🌟';const token=session;setTimeout(()=>{if(token!==session)return;opened=[];matchLocked=false;if(matched===6){complete('match');award(5);confetti(true);finish('All matched! 🏆','Bonus: ⭐ +5 stars!',5)}else drawMatch()},650)}else{beep(false);$('feedback').textContent='Try again! 💛';const token=session;setTimeout(()=>{if(token!==session)return;pairs[a].open=pairs[b].open=false;opened=[];matchLocked=false;drawMatch()},950)}}}
function finish(title,subtitle,bonus){$('activity').innerHTML=`<div class="banner" role="status"><div class="big">🏆🌈</div>${escapeHTML(title)}<p>${escapeHTML(subtitle)}</p><div class="actionrow">${button('🔁 Play Again','replay','pill yellow')}${button('🃏 Flashcards','toFlash','pill pink')}${button('🏠 All Topics','home','pill')}</div></div>`;confetti(true)}
function confetti(big=false){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const c=$('confetti'),context=c.getContext('2d');if(!context)return;const dpr=Math.min(devicePixelRatio||1,2),w=innerWidth,h=innerHeight;c.width=w*dpr;c.height=h*dpr;context.setTransform(dpr,0,0,dpr,0,0);let parts=Array.from({length:big?125:55},()=>({x:w*(.3+Math.random()*.4),y:h*.3,vx:(Math.random()-.5)*10,vy:-Math.random()*9-3,life:0,size:4+Math.random()*7,color:['#f9b5b5','#ffe08b','#9fd5fa','#a4e9b4','#c4aeff'][Math.floor(Math.random()*5)]}));let frame=0;function tick(){context.clearRect(0,0,w,h);for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=.27;p.life++;context.fillStyle=p.color;context.fillRect(p.x,p.y,p.size,p.size*.7)}if(++frame<105)requestAnimationFrame(tick);else context.clearRect(0,0,w,h)}requestAnimationFrame(tick)}
app.addEventListener('click',e=>{const open=e.target.closest('[data-open]');if(open){choose(open.dataset.open);return}const tab=e.target.closest('[data-tab]');if(tab){changeMode(tab.dataset.tab);return}const card=e.target.closest('[data-card]');if(card){idx=Number(card.dataset.card);flipped=false;renderFlash();speak(selected.items[idx][0]);return}const answerBtn=e.target.closest('[data-answer]');if(answerBtn){answer(answerBtn.dataset.answer,answerBtn);return}const mem=e.target.closest('[data-memory]');if(mem){flipMatch(Number(mem.dataset.memory));return}const action=e.target.closest('[data-act]');if(!action)return;switch(action.dataset.act){case'home':home();break;case'prev':nextCard(-1);break;case'next':nextCard(1);break;case'listen':speak(selected.items[idx][0]);break;case'listenQuiz':speak(quiz[qpos][0]);break;case'replay':session++;render();break;case'toFlash':changeMode('flash');break}});
save();home();
</script>
