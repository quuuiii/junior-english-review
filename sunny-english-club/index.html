};
function artFor(word,fallback){const shape=svgShapes[word.toLowerCase()];return shape?`<svg class="lesson-svg" viewBox="0 0 100 100" role="img" aria-label="${escapeHTML(word)}" xmlns="http://www.w3.org/2000/svg"><g stroke-linejoin="round" stroke-linecap="round">${shape}</g></svg>`:`<span class="text-art" aria-label="${escapeHTML(word)}">${escapeHTML(word)}</span>`}

let data={stars:0,completed:{}};
try{let saved=JSON.parse(localStorage.getItem('sunny-v3')||'null');if(saved&&typeof saved.stars==='number'&&saved.completed&&typeof saved.completed==='object')data=saved}catch(e){}
function save(){try{localStorage.setItem('sunny-v3',JSON.stringify(data))}catch(e){}$('score').textContent='⭐ Score: '+data.stars}
let sound=true,selected=topicData[0],mode='flash',idx=0,flipped=false,quiz=[],qpos=0,quizLocked=false,pairs=[],opened=[],matchLocked=false,matched=0,session=0;
function speak(text){if(!sound||!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.78;u.pitch=1.08;speechSynthesis.speak(u)}catch(e){}}
let ctx;function beep(ok=true){if(!sound)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(ok?600:250,ctx.currentTime);if(ok)o.frequency.exponentialRampToValueAtTime(950,ctx.currentTime+.16);g.gain.setValueAtTime(.13,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.24);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+.25)}catch(e){}}
$('soundBtn').onclick=()=>{sound=!sound;$('soundBtn').textContent=sound?'🔊':'🔇';if(!sound&&'speechSynthesis'in window)speechSynthesis.cancel()};
function award(n){data.stars+=n;save();beep(true)}
function complete(modeName){const key=selected.id+':'+modeName;data.completed[key]=(data.completed[key]||0)+1;save()}
function button(label,fn,cl='pill'){return `<button type="button" class="${cl}" data-act="${fn}">${label}</button>`}
function home(){session++;app.innerHTML=`<section class="hero"><h2>Pick a happy place! 🌈</h2><p class="muted">Tap a topic. Learn new words. Win stars!</p></section><div class="topicgrid">${topicData.map(t=>tile(t)).join('')}</div><h2 class="section-title">📚 Sight Words</h2><div class="topicgrid">${lessonGroups.slice(0,12).map(t=>tile(t)).join('')}</div><h2 class="section-title">🔤 Phonics</h2><div class="topicgrid">${lessonGroups.slice(12).map(t=>tile(t)).join('')}</div>`}
function tile(t){return `<button type="button" class="tile" data-open="${escapeHTML(t.id)}"><span class="art">${artFor(t.items[0][0],t.icon)}</span><strong>${escapeHTML(t.name)}</strong><small>${t.items.length} words ${Object.keys(data.completed).some(k=>k.startsWith(t.id+':'))?'• 🏅':''}</small></button>`}
function choose(id){const t=allTopics.find(t=>t.id===id);if(!t)return;session++;selected=t;mode='flash';idx=0;flipped=false;render()}
function render(){app.innerHTML=`<section class="panel"><div class="topline">${button('← All Topics','home','pill pink')}<h2>${selected.icon} ${escapeHTML(selected.name)}</h2><span class="muted">${selected.items.length} words</span></div><div class="tabbar" role="tablist" aria-label="Play modes">${[['flash','🃏 Flashcards'],['quiz','⭐ Quiz Challenge'],['match','🧩 Matching Game']].map(([id,label])=>`<button role="tab" aria-selected="${mode===id}" type="button" class="tab" data-tab="${id}">${label}${data.completed[selected.id+':'+id]?' ✅':''}</button>`).join('')}</div><div id="activity" role="tabpanel"></div></section>`;if(mode==='flash')renderFlash();else if(mode==='quiz')startQuiz();else startMatching()}
function changeMode(m){if(!['flash','quiz','match'].includes(m))return;session++;mode=m;idx=0;flipped=false;render()}
function renderFlash(){const item=selected.items[idx],act=$('activity');act.innerHTML=`<p class="muted prompt">Tap the card to flip it!</p><div class="flip-wrap"><button type="button" id="flash" class="flashcard${flipped?' is-flipped':''}" aria-label="Flip card"><span class="side front"><span class="art">${artFor(item[0],item[2])}</span><span class="word">${escapeHTML(item[0])}</span><span class="muted">Tap to flip ↻</span></span><span class="side back"><span class="cn">${escapeHTML(item[1]||item[0])}</span><span class="example">${escapeHTML(item[3])}</span><span class="muted">Tap to turn back ↻</span></span></button></div><p class="counter prompt">${idx+1} / ${selected.items.length}</p><div class="actionrow">${button('⬅ Back','prev','pill pink')}${button('🔊 Listen','listen','pill yellow')}${button('Next ➜','next','pill green')}</div><div class="lesson-grid">${selected.items.map((x,i)=>`<button type="button" class="mini" data-card="${i}" aria-label="Show ${escapeHTML(x[0])}"><span class="art">${artFor(x[0],x[2])}</span><span>${escapeHTML(x[0])}</span></button>`).join('')}</div><p class="feedback" id="flashNotice" aria-live="polite"></p>`;$('flash').onclick=()=>{flipped=!flipped;$('flash').classList.toggle('is-flipped',flipped);if(flipped)speak(item[3])}}
function nextCard(n){idx=(idx+n+selected.items.length)%selected.items.length;flipped=false;renderFlash();speak(selected.items[idx][0]);if(n>0&&idx===0){complete('flash');$('flashNotice').textContent='🌟 You saw all the cards!'}}
function startQuiz(){quiz=rand(selected.items).slice(0,Math.min(8,selected.items.length));qpos=0;quizLocked=false;drawQuestion()}
function drawQuestion(){if(qpos===quiz.length){complete('quiz');finish('Quiz complete! 🎉','You did it! Keep shining!',2);return}quizLocked=false;const item=quiz[qpos],options=rand([item,...rand(selected.items.filter(x=>x!==item)).slice(0,3)]);$('activity').innerHTML=`<div class="prompt"><p class="counter">Question ${qpos+1} / ${quiz.length}</p><div class="art" style="font-size:98px">${artFor(item[0],item[2])}</div><h3>What is it?</h3>${button('🔊 Listen','listenQuiz','pill yellow')}</div><div class="choicegrid">${options.map(x=>`<button class="choice" type="button" data-answer="${escapeHTML(x[0])}">${escapeHTML(x[0])}</button>`).join('')}</div><p id="feedback" class="feedback" role="status" aria-live="polite"></p>`}
function answer(word,el){if(quizLocked)return;const ok=quiz[qpos][0]===word;if(ok){quizLocked=true;el.classList.add('correct');$('feedback').textContent='Great job! ⭐ +1';award(1);confetti();const token=session;setTimeout(()=>{if(token!==session)return;qpos++;drawQuestion()},1100)}else{el.classList.remove('wrong');void el.offsetWidth;el.classList.add('wrong');$('feedback').textContent='Try again! 💛';beep(false)}}
function startMatching(){const items=rand(selected.items.filter(item=>svgShapes[item[0].toLowerCase()]));if(items.length<6){$('activity').innerHTML='<div class="banner">📖 This lesson uses word cards. Try Flashcards or Quiz Challenge!</div>';return}pairs=rand(items.flatMap((item,i)=>[{id:i,type:'pic',value:item[0],word:item[0]},{id:i,type:'word',value:item[0],word:item[0]}]));opened=[];matched=0;matchLocked=false;drawMatch()}
function drawMatch(){const card=(p,i)=>`<button type="button" class="memory${p.open?' flipped':''}${p.done?' matched':''}" data-memory="${i}" aria-label="Memory card ${i+1}" ${p.done?'disabled':''}>${p.open||p.done?(p.type==='pic'?`<span class="art">${artFor(p.word,p.value)}</span>`:`<span class="word">${escapeHTML(p.value)}</span>`):'❔'}</button>`;$('activity').innerHTML=`<div class="prompt"><h3>Find the matching pairs! 🧩</h3><p class="muted">Match a picture with a word.</p><p class="counter">Pairs: ${matched} / 6</p></div><div class="matches">${pairs.map(card).join('')}</div><p id="feedback" class="feedback" aria-live="polite"></p>`}
function flipMatch(i){const p=pairs[i];if(matchLocked||p.open||p.done)return;p.open=true;opened.push(i);drawMatch();if(opened.length===2){matchLocked=true;const [a,b]=opened,yes=pairs[a].id===pairs[b].id&&pairs[a].type!==pairs[b].type;if(yes){pairs[a].done=pairs[b].done=true;matched++;beep();speak(pairs[a].word);$('feedback').textContent='A match! 🌟';const token=session;setTimeout(()=>{if(token!==session)return;opened=[];matchLocked=false;if(matched===6){complete('match');award(5);confetti(true);finish('All matched! 🏆','Bonus: ⭐ +5 stars!',5)}else drawMatch()},650)}else{beep(false);$('feedback').textContent='Try again! 💛';const token=session;setTimeout(()=>{if(token!==session)return;pairs[a].open=pairs[b].open=false;opened=[];matchLocked=false;drawMatch()},950)}}}
function finish(title,subtitle,bonus){$('activity').innerHTML=`<div class="banner" role="status"><div class="big">🏆🌈</div>${escapeHTML(title)}<p>${escapeHTML(subtitle)}</p><div class="actionrow">${button('🔁 Play Again','replay','pill yellow')}${button('🃏 Flashcards','toFlash','pill pink')}${button('🏠 All Topics','home','pill')}</div></div>`;confetti(true)}
function confetti(big=false){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const c=$('confetti'),context=c.getContext('2d');if(!context)return;const dpr=Math.min(devicePixelRatio||1,2),w=innerWidth,h=innerHeight;c.width=w*dpr;c.height=h*dpr;context.setTransform(dpr,0,0,dpr,0,0);let parts=Array.from({length:big?125:55},()=>({x:w*(.3+Math.random()*.4),y:h*.3,vx:(Math.random()-.5)*10,vy:-Math.random()*9-3,life:0,size:4+Math.random()*7,color:['#f9b5b5','#ffe08b','#9fd5fa','#a4e9b4','#c4aeff'][Math.floor(Math.random()*5)]}));let frame=0;function tick(){context.clearRect(0,0,w,h);for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=.27;p.life++;context.fillStyle=p.color;context.fillRect(p.x,p.y,p.size,p.size*.7)}if(++frame<105)requestAnimationFrame(tick);else context.clearRect(0,0,w,h)}requestAnimationFrame(tick)}
app.addEventListener('click',e=>{const open=e.target.closest('[data-open]');if(open){choose(open.dataset.open);return}const tab=e.target.closest('[data-tab]');if(tab){changeMode(tab.dataset.tab);return}const card=e.target.closest('[data-card]');if(card){idx=Number(card.dataset.card);flipped=false;renderFlash();speak(selected.items[idx][0]);return}const answerBtn=e.target.closest('[data-answer]');if(answerBtn){answer(answerBtn.dataset.answer,answerBtn);return}const mem=e.target.closest('[data-memory]');if(mem){flipMatch(Number(mem.dataset.memory));return}const action=e.target.closest('[data-act]');if(!action)return;switch(action.dataset.act){case'home':home();break;case'prev':nextCard(-1);break;case'next':nextCard(1);break;case'listen':speak(selected.items[idx][0]);break;case'listenQuiz':speak(quiz[qpos][0]);break;case'replay':session++;render();break;case'toFlash':changeMode('flash');break}});
save();home();
</script>
