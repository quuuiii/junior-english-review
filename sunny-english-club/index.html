<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sunny English Club</title><style>
:root{font-family:'Trebuchet MS',Arial,sans-serif;color:#26334c}*{box-sizing:border-box}body{margin:0;background:#fff7e8}header{text-align:center;padding:25px 14px;background:#fff0b5}h1{font-size:clamp(32px,7vw,58px);margin:0}p{line-height:1.5}main{max-width:960px;margin:auto;padding:18px}.menu,.grid,.buttons{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}.box{background:white;border:3px solid #e7eafa;border-radius:28px;padding:22px;text-align:center;margin:18px 0;box-shadow:0 7px #e7eafa}button{font:inherit;font-size:22px;font-weight:bold;min-height:62px;border:0;padding:12px 18px;background:#b9e9d4;border-radius:20px;cursor:pointer;color:#26334c;box-shadow:0 5px #79be9e}button:active{transform:translateY(3px);box-shadow:0 2px #79be9e}.pink{background:#ffc9dd;box-shadow:0 5px #e2a1b4}.blue{background:#c7e7ff;box-shadow:0 5px #97c6e8}.yellow{background:#ffe38e;box-shadow:0 5px #dfc061}.word{font-size:clamp(46px,10vw,80px);margin:18px}.emoji{font-size:90px}.small{font-size:17px;color:#68758b}.stars{font-size:27px}#notice{min-height:44px;font-size:26px}button:focus-visible{outline:4px solid #6356d7}</style></head><body><header><h1>☀️ Sunny English Club</h1><p>Look • Listen • Play • Learn</p><div class="stars" id="stars">⭐ 0</div></header><main id="app"></main>
<script>
const weeks=[
['the','in','on','is','big','little'],['I','am','you','are','he','she'],['have','has','it','one','two','four'],['can','play','with','me','around','cannot'],
['do','like','to','go','went','see'],['please','give','get','come','down','up'],['this','that','there','was','friend','here'],['we','they','smell','then','find','too'],
['your','my','mother','father','said','good'],['where','under','goes','at','against','from'],['a','an','live','into','often','out'],['why','because','some','people','always','all']];
const phonics={a:['pat','tap','snap','hat','back','stand','bad','hand','flag','ant'],e:['red','pet','pen','hen','get','leg','neck','best','pest','test'],i:['in','tin','six','twin','kiss','drip','grill','sniff','brick','lick'],o:['pot','dog','soft','not','log','fox','frog','box','hot','spot'],ai:['rain','train','wait','rainbow','paint','tail','snail','brain','raindrops','paintbrush'],ee:['jeep','feel','free','feet','green','creep','street','screen','asleep','coffee'],ie:['lie','tie','die','pie','cried','fries','magpie','untie','flies','dries'],oa:['boat','goat','float','moat','coat','road','coach','raincoat','unload','afloat'],ue:['cue','fuel','argue','hue','value','tissue','rescue','continue','statue','barbecue']};
const hints={cat:'🐱',dog:'🐶',box:'📦',big:'🐘',little:'🐭',one:'1️⃣',two:'2️⃣',four:'4️⃣',eyes:'👀',play:'🧸',rain:'🌧️',train:'🚂',rainbow:'🌈',paint:'🎨',tail:'🐈',snail:'🐌',brain:'🧠',jeep:'🚙',feet:'🦶',green:'🌳',coffee:'☕',red:'🟥',pet:'🐕',pen:'🖊️',hen:'🐔',leg:'🦵',neck:'🧣',test:'📝',hat:'👒',hand:'✋',flag:'🚩',ant:'🐜',six:'6️⃣',twin:'👯',kiss:'😘',brick:'🧱',pot:'🍲',fox:'🦊',frog:'🐸',hot:'☀️',boat:'🚣',goat:'🐐',coat:'🧥',road:'🛣️',raincoat:'🧥',pie:'🥧',tie:'👔',fries:'🍟',flies:'🪰',tissue:'🧻',rescue:'🚒',statue:'🗽',barbecue:'🍢',friend:'🧑‍🤝‍🧑',mother:'👩',father:'👨',good:'👍',smell:'🌸',happy:'😃'};
const sentences=['The cat is in the box.','I am happy.','It has one tail.','Can you play with me?','Do you like to go to the zoo?','Please, get up now.','My friend went to the beach.','We smell the flowers, too.','My mother said, "Go to bed."','It goes under the table.','A turtle often lives in the sea.','Why do all people eat?'];
let category='week',index=0,position=0,points=0,correctAnswer='',currentMode='';
const app=document.getElementById('app');const say=t=>{if('speechSynthesis' in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.78;speechSynthesis.speak(u)}};const shuffle=a=>[...a].sort(()=>Math.random()-.5);const current=()=>category==='week'?weeks[index]:phonics[Object.keys(phonics)[index]];const escapeHtml=x=>String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const header=(title)=>'<div class="box"><h2>'+title+'</h2><button class="blue" onclick="home()">🏠 Home</button></div>';
function home(){app.innerHTML='<section class="box"><h2>Choose a lesson! 🌟</h2><p>Tap a lesson to begin.</p><h2>📚 Sight Words</h2><div class="grid">'+weeks.map((w,i)=>'<button class="pink" onclick="openLesson(\'week\','+i+')">Week '+(i+1)+'</button>').join('')+'</div><h2>🔤 Phonics</h2><div class="grid">'+Object.keys(phonics).map((k,i)=>'<button class="yellow" onclick="openLesson(\'phonics\','+i+')">'+k+'</button>').join('')+'</div></section>'}
function openLesson(c,i){category=c;index=i;position=0;lesson()}
function lesson(){let words=current(),title=category==='week'?'Week '+(index+1):Object.keys(phonics)[index].toUpperCase();let word=words[position];app.innerHTML=header(title)+'<section class="box"><div class="small">Tap the word and listen!</div><div class="emoji">'+(hints[word]||'🌟')+'</div><div class="word">'+escapeHtml(word)+'</div><div class="buttons"><button class="yellow" onclick="say(current()[position])">🔊 Listen</button><button onclick="position=(position+1)%current().length;lesson()">Next ➜</button></div><p class="small">'+(position+1)+' / '+words.length+'</p></section>'+(category==='week'?'<section class="box"><p>'+escapeHtml(sentences[index])+'</p><button class="blue" onclick="say(sentences[index])">🔊 Read Sentence</button></section>':'')+'<section class="box"><h2>Ready to play? 🎮</h2><div class="buttons"><button class="pink" onclick="startGame(\'listen\')">👂 Listen & Tap</button><button class="blue" onclick="startGame(\'spell\')">🔡 Missing Letter</button><button class="yellow" onclick="startGame(\'read\')">📖 Read & Tap</button></div></section>'}
let questions=[],qindex=0,score=0;
function startGame(mode){currentMode=mode;questions=shuffle(current()).slice(0,Math.min(6,current().length));qindex=0;score=0;game()}
function game(){if(qindex>=questions.length){finish();return}const word=questions[qindex],options=shuffle([word,...shuffle(current().filter(w=>w!==word)).slice(0,3)]);correctAnswer=word;const prompt=currentMode==='spell'?'Which letter is missing?':currentMode==='listen'?'Listen and find the word!':'Tap the word!';const choices=currentMode==='spell'?shuffle([...new Set([word[Math.floor(word.length/2)],...shuffle('aeiourstnpl').slice(0,3)])]):options;let display=currentMode==='spell'?word.replace(/./g,(c,i)=>i===Math.floor(word.length/2)?'_':c):currentMode==='read'?word:'🔊';if(currentMode==='spell')correctAnswer=word[Math.floor(word.length/2)];app.innerHTML=header('Let’s Play! 🎮')+'<div class="box"><p class="small">Question '+(qindex+1)+' / '+questions.length+'</p><h2>'+prompt+'</h2><div class="word">'+escapeHtml(display)+'</div><button class="yellow" onclick="say(questions[qindex])">🔊 Listen</button><div class="grid" style="margin-top:25px">'+choices.map(w=>'<button class="blue" onclick="answer(this,\''+w+'\')">'+escapeHtml(w)+'</button>').join('')+'</div><p id="notice" aria-live="polite"></p></div>';if(currentMode==='listen')say(word)}
let locked=false;function answer(el,word){if(locked)return;if(word===correctAnswer){locked=true;score++;points++;document.getElementById('stars').textContent='⭐ '+points;document.getElementById('notice').textContent='🎉 Great job!';el.style.background='#9be5a9';say('Great job!');setTimeout(()=>{qindex++;locked=false;game()},950)}else{document.getElementById('notice').textContent='Try again! 💛';say('Try again')}}
function finish(){app.innerHTML=header('Great Job! 🏆')+'<div class="box"><div class="emoji">🌈</div><h2>You got '+score+' / '+questions.length+'!</h2><p>Super star! ⭐</p><div class="buttons"><button onclick="startGame(currentMode)">Play Again 🔁</button><button class="pink" onclick="lesson()">My Lesson 📚</button></div></div>';say('Great job! You are a star!')}
home();
</script></body></html>
