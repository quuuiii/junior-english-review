<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850"><style>text{font-family:Arial,sans-serif;fill:#24364b}.cap{font-weight:700;font-size:22px}.bubble{fill:#fff;stroke:#49657d;stroke-width:2}.panel{fill:#e9f2fb;stroke:#274f70;stroke-width:4}.small{font-size:18px}</style><rect width="1100" height="850" fill="#fff"/><rect class="panel" x="15" y="15" width="525" height="400" rx="14"/><rect class="panel" x="560" y="15" width="525" height="400" rx="14"/><rect class="panel" x="15" y="430" width="525" height="400" rx="14"/><rect class="panel" x="560" y="430" width="525" height="400" rx="14"/><rect x="15" y="15" width="65" height="65" fill="#1d6397"/><text x="33" y="62" font-size="40" font-weight="bold" fill="white">1</text><rect x="560" y="15" width="65" height="65" fill="#1d6397"/><text x="578" y="62" font-size="40" font-weight="bold" fill="white">2</text><rect x="15" y="430" width="65" height="65" fill="#1d6397"/><text x="33" y="477" font-size="40" font-weight="bold" fill="white">3</text><rect x="560" y="430" width="65" height="65" fill="#1d6397"/><text x="578" y="477" font-size="40" font-weight="bold" fill="white">4</text>
<text x="94" y="48" font-size="21">In 6th grade, I tried to get the students</text><text x="94" y="74" font-size="21">to pick me as student leader.</text>
<rect x="80" y="115" width="135" height="160" rx="15" fill="#a9d4ef"/><circle cx="150" cy="155" r="25" fill="#f5c6a5"/><path d="M126 141q25-36 48 0" fill="#513b30"/><rect x="111" y="183" width="78" height="66" rx="10" fill="#fff"/><rect x="83" y="252" width="140" height="82" fill="#c99963"/><text x="100" y="282" font-size="18" font-weight="bold">HAWKINS</text><rect class="bubble" x="237" y="104" width="281" height="113" rx="18"/><text x="254" y="136" font-size="19">I’ll make class hours shorter.</text><text x="254" y="163" font-size="19">And we’ll have only three</text><text x="254" y="190" font-size="19">days of school a week...</text><rect class="bubble" x="239" y="231" width="274" height="77" rx="16"/><text x="255" y="262" font-size="18">What? That’s not what a</text><text x="255" y="288" font-size="18">student leader can decide.</text><rect class="bubble" x="237" y="324" width="273" height="57" rx="15"/><text x="255" y="360" font-size="20">He doesn’t know anything.</text>
<text class="cap" x="650" y="55">I totally bombed it.</text><rect x="593" y="103" width="424" height="198" rx="12" fill="#fff" stroke="#6c90aa" stroke-width="8"/><text x="630" y="150" font-size="29">HAWKINS    2</text><text x="630" y="205" font-size="29">BRATT       25</text><text x="630" y="260" font-size="29">HAHN        13</text><rect class="bubble" x="606" y="319" width="412" height="83" rx="15"/><text x="625" y="350" font-size="21">I was the best choice, but why</text><text x="625" y="379" font-size="21">didn’t people know that?</text>
<text x="94" y="461" font-size="19">I became a salesperson when I was 23,</text><text x="94" y="487" font-size="19">and I believed I could be Number 1.</text><rect x="40" y="520" width="470" height="265" rx="20" fill="#d5e8f4"/><rect class="bubble" x="48" y="540" width="242" height="133" rx="15"/><text x="62" y="568" font-size="18">You said you would</text><text x="62" y="595" font-size="18">sell 50 cars a month.</text><text x="62" y="622" font-size="18">But you sold only 1</text><text x="62" y="649" font-size="18">car in two months.</text><rect class="bubble" x="307" y="540" width="205" height="112" rx="15"/><text x="322" y="570" font-size="18">Don’t worry.</text><text x="322" y="597" font-size="18">I’ll sell 149 cars</text><text x="322" y="624" font-size="18">next month.</text><rect class="bubble" x="90" y="696" width="350" height="64" rx="15"/><text x="112" y="735" font-size="21">You said that a year ago.</text>
<text class="cap" x="650" y="469">I bombed it again.</text><rect x="580" y="510" width="480" height="300" rx="20" fill="#dcebf7"/><rect class="bubble" x="735" y="546" width="303" height="127" rx="16"/><text x="750" y="579" font-size="19">Hawkins, we don’t need</text><text x="750" y="607" font-size="19">your service anymore.</text><text x="750" y="635" font-size="19">Go pack your things...</text><rect class="bubble" x="595" y="703" width="140" height="66" rx="25"/><text x="630" y="746" font-size="27">Why?</text></svg>