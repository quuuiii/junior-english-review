}.mistake{background:#fff5f1;border-left:4px solid #ef9478;padding:11px 14px;border-radius:8px;margin-top:13px}.examples{padding-left:19px;margin:7px 0}.side{position:sticky;top:84px}.side p{color:var(--muted);font-size:.92rem}.input{border:1px solid #cbdde9;padding:12px 13px;width:100%;border-radius:11px;background:white;margin:6px 0 12px;color:var(--ink)}.button{border:0;padding:11px 18px;border-radius:12px;background:var(--blue);color:#fff;font-weight:750}.button.secondary{color:#246ea6;background:#e5f1fc}.button.green{background:#128b83}.button:focus-visible,.option:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #81c9ff;outline-offset:2px}.hint{font-size:.87rem}.quiz{margin-top:23px}.quiz-intro{display:flex;align-items:center;justify-content:space-between;gap:10px}.question{margin:15px 0;padding:19px;border:1px solid var(--line);border-radius:14px;background:white}.question h3{font-size:1rem;margin:3px 0 14px}.qtype{color:#2875a3;font-weight:650;font-size:.8rem}.options{display:grid;grid-template-columns:1fr 1fr;gap:9px}.option{border:1.5px solid #dce6ef;border-radius:10px;text-align:left;padding:10px 12px;background:#f9fcfe;color:var(--ink)}.option.selected{background:#e3f5f0;border-color:#199d90;font-weight:750}.write{width:100%;padding:12px;border:1.5px solid #bfcfdd;border-radius:10px}.footer-buttons{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:18px}.status{color:#516780;font-size:.91rem}.result-card{border:1px solid #d6e9ea;background:#f2fbf9;border-radius:14px;padding:18px;margin:17px 0}.result-card.wrong{background:#fff8f6;border-color:#f0d8d3}.result-card p{margin:8px 0}.feedback{display:inline-block;font-weight:760;color:#137b69}.feedback.bad{color:#ad3b54}.grade{font-size:2.5rem;font-weight:850;color:#168c86}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#142d48b5;z-index:30;display:flex;align-items:center;justify-content:center;padding:20px}.modal>div{background:white;width:min(520px,100%);border-radius:22px;padding:27px;box-shadow:0 25px 80px #0003}.modal h2{margin:0}.modal .button{margin-top:18px}.notice{border-radius:11px;background:#f0f7ff;padding:12px;font-size:.9rem;color:#395b80}#report{scroll-margin-top:85px}.progress{height:8px;background:#dbe7f0;border-radius:20px;overflow:hidden;margin:15px 0}.progress>div{height:100%;background:#36a6a0;transition:width .2s}@media(max-width:760px){.layout{grid-template-columns:1fr}.side{position:static}.hero{padding:22px}.hero .symbol{font-size:40px}.panel{padding:18px}.nav{padding:10px 14px}.logo{font-size:.9rem}.pick{min-width:0;width:60%}.options{grid-template-columns:1fr}}
.review-section{border:1px solid var(--line);border-radius:12px;margin:14px 0;padding:12px 14px;background:#fcfeff}.review-section summary{cursor:pointer;font-weight:800;color:#216b9d}.review-section p{margin:10px 0}.review-scroll{overflow-x:auto}.review-table{width:100%;border-collapse:collapse;min-width:520px;font-size:.89rem}.review-table th,.review-table td{border-bottom:1px solid var(--line);padding:9px;text-align:left;vertical-align:top}.review-table thead{background:#e9f4fc}.review-table td:nth-child(2){font-weight:600}.review-section .mistake ul{padding-left:20px;margin:6px 0}@media(max-width:760px){.review-section{padding:10px}} </style>

<main>
<section class="hero"><div><span class="chip">國中英文・複習＋即時測驗</span><h1 id="heroTitle">英文複習補給站</h1><p>先讀重點、再練習，交卷後逐題弄懂錯在哪裡。</p></div><span class="symbol" aria-hidden="true">📚</span></section>
<div class="layout"><section class="panel" id="notes"><h2>📖 單元重點複習</h2><div id="notesBody"></div></section><aside class="panel side"><h2>🪪 測驗身分</h2><label for="student">學生姓名 <b style="color:#bd405b">*</b></label><input id="student" class="input" type="text" maxlength="80" placeholder="例：王小明" autocomplete="name"><label for="workDate">填寫日期 <b style="color:#bd405b">*</b></label><input id="workDate" class="input" type="date" required><p>全部 15 個單元各 35 題。每題都必須作答才能交卷。</p><div class="progress" aria-label="作答進度"><div id="progress" style="width:0%"></div></div><p id="progressText" class="hint">已完成 0 題</p><div class="notice">資料提交至老師設定的 Google Sheets。請只填課堂識別所需資訊，不必填手機、生日等個資。</div></aside></div>

<script>

const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxI6q6vTOZLkCOoQfiLih4soA1Nv5WJUm8d7Nbb8dJKRMNK-kmaOjdqTc05eovu61jj/exec";
/* GAS ContentService 沒有可自訂的 CORS 回應標頭，因此 POST 用 no-cors；
   之後用 JSONP GET 查詢提交 ID 是否真的寫入，確認後才顯示同步成功。 */
const DATA = [
{title:'冠詞・日常用語・數字與時間',words:['quarter｜一刻鐘','borrow｜借入','lend｜借出','appointment｜約定'],phrases:['a lot of 大量的','on time 準時','make a phone call 打電話'],dialog:'A: What time is it? B: It is a quarter past seven.',rule:'第一次提到單數可數名詞通常用 a/an；特定事物用 the。時間可用 It is + 時間。',example:'I saw a dog. The dog was friendly.',pitfall:'an 看發音而非拼字：an hour、a university。',qs:[['mc','It is ___ hour-long movie.',['a','an','the','×'],1,'hour 的 h 不發音，以母音音素開頭，用 an。'],['cl','It is 7:15. = It is a ___ past seven.','quarter','7:15 是七點過一刻。'],['fix','改正：She has an useful book.','She has a useful book.','useful 以 /juː/ 子音音素開頭，所以用 a。']]},
{title:'名詞的可數與不可數・代名詞',words:['information｜資訊','advice｜建議','glasses｜眼鏡','neighbor｜鄰居'],phrases:['a piece of advice 一項建議','by oneself 獨自','each other 彼此'],dialog:'A: Is this your book? B: No, it is hers.',rule:'可數名詞可用複數；不可數名詞通常沒有複數 -s。主格當主詞、受格當受詞、所有格表所有。',example:'She gave me some advice. / This book is mine.',pitfall:'advice、information 不可直接加 -s；mine 後面不再接名詞。',qs:[['mc','This pencil is not yours. It is ___.',['my','me','mine','I'],2,'mine 是所有格代名詞，可單獨使用。'],['cl','Please give me two pieces of ___.','advice','advice 不可數，使用 pieces of 計量。'],['fix','改正：These informations are useful.','This information is useful.','information 不可數，配 this 與 is。']]},
{title:'數量詞・不定代名詞・there be / have',words:['vegetable｜蔬菜','rice｜米飯','enough｜足夠的','another｜另一個'],phrases:['a few friends 幾個朋友','a little water 一點水','there is / are 有'],dialog:'A: How much milk is there? B: There is a little.',rule:'many/few 修飾可數複數；much/little 修飾不可數。There is/are 看後接主詞的單複數。',example:'There are three apples. / There is some milk.',pitfall:'a few 表有一些；few 表幾乎沒有。have 表擁有，不能一律和 there be 互換。',qs:[['mc','There ___ two cups on the table.',['is','are','has','have'],1,'two cups 是複數，使用 are。'],['cl','There is ___ water in the bottle. (一些)','some','肯定句不可數名詞 water 前可用 some。'],['fix','改正：How many milk do you need?','How much milk do you need?','milk 是不可數名詞，應搭配 how much。']]},
{title:'現在簡單式・現在進行式',words:['exercise｜運動','practice｜練習','habit｜習慣','usually｜通常'],phrases:['every day 每天','right now 現在','look forward to 期待'],dialog:'A: What is Amy doing? B: She is studying.',rule:'現在簡單式表習慣或事實：He plays. 現在進行式表正在發生：He is playing.',example:'I walk to school every day. / I am walking now.',pitfall:'第三人稱單數動詞加 -s；進行式需有 be 動詞，不是 She studying。',qs:[['mc','Listen! The baby ___ now.',['cries','cry','is crying','cried'],2,'Listen 與 now 表正在發生，用 be + V-ing。'],['cl','My father ___ to work every day. (go)','goes','主詞為第三人稱單數且有 every day，用 goes。'],['fix','改正：He is play basketball now.','He is playing basketball now.','is 後應接 V-ing。']]},
{title:'過去簡單式・過去進行式',words:['yesterday｜昨天','ago｜以前','suddenly｜突然','while｜當…時'],phrases:['last night 昨晚','at that time 當時','used to 過去常常'],dialog:'A: What were you doing then? B: I was reading.',rule:'過去簡單式：S + Ved。過去進行式：S + was/were + V-ing，強調過去某時進行中的動作。',example:'I was sleeping when the phone rang.',pitfall:'did 後用原形：Did he go? 不是 Did he went?。',qs:[['mc','We ___ TV at 8 p.m. last night.',['watch','watched','were watching','are watching'],2,'過去特定時間正在進行，使用 were watching。'],['cl','She ___ a letter yesterday. (write)','wrote','yesterday 搭配過去式，write 的過去式是 wrote。'],['fix','改正：Did you went home early?','Did you go home early?','助動詞 did 後接動詞原形 go。']]},
{title:'未來式・現在完成式',words:['already｜已經','yet｜尚未','since｜自從','future｜未來'],phrases:['be going to 即將','for three years 三年來','have been to 去過'],dialog:'A: Have you finished? B: Yes, I have.',rule:'未來式 will + V / be going to + V。現在完成式 have/has + p.p. 表經驗、持續或完成。',example:'She has lived here for five years.',pitfall:'since 接起始點、for 接一段時間；has went ✕ → has gone ✓。',qs:[['mc','He has studied English ___ 2021.',['for','since','during','ago'],1,'2021 是明確的起始時間點，用 since。'],['cl','I have ___ my homework already. (finish)','finished','現在完成式需要過去分詞 finished。'],['fix','改正：She has went to Japan.','She has gone to Japan.','has 後接過去分詞 gone。']]},
{title:'助動詞與祈使句',words:['permission｜許可','possible｜可能的','must｜必須','careful｜小心的'],phrases:['had better 最好','be able to 能夠','please + V 請…'],dialog:'A: May I leave early? B: Yes, you may.',rule:'can、must、should、may 後接動詞原形。祈使句以原形動詞開頭，否定句用 Don’t + V。',example:'You should drink water. / Don’t run here.',pitfall:'mustn’t 是禁止；don’t have to 是不必，意思不同。',qs:[['mc','You ___ smoke in the library. It is forbidden.',['must not','do not have to','may','can'],0,'明確禁止使用 must not。'],['cl','You should ___ enough sleep. (get)','get','should 後接原形動詞 get。'],['fix','改正：He can swims very fast.','He can swim very fast.','can 後面必須使用 swim 原形。']]},
{title:'連接詞・對等／從屬子句',words:['although｜雖然','because｜因為','unless｜除非','while｜當…時'],phrases:['because of 因為（片語）','even though 即使','as soon as 一…就…'],dialog:'A: Why are you late? B: Because I missed the bus.',rule:'because 後接子句；because of 後接名詞（片語）。although 表讓步；when 表時間。',example:'I stayed home because it rained.',pitfall:'Although he was tired, he kept studying. 不要再接 but。',qs:[['mc','We stayed home ___ the heavy rain.',['because','because of','although','so'],1,'後面是名詞片語 the heavy rain，選 because of。'],['cl','I wore a coat ___ it was cold.','because','it was cold 是子句，用 because。'],['fix','改正：Although it rained, but we played.','Although it rained, we played.','although 與 but 不在相同讓步結構中並用。']]},
{title:'副詞・形容詞與比較級',words:['carefully｜小心地','quiet｜安靜的','better｜更好的','worst｜最差的'],phrases:['as ... as 和…一樣','much taller 高得多','the most 最…'],dialog:'A: Which is heavier? B: The blue bag is.',rule:'形容詞修飾名詞，副詞修飾動詞等；比較級 + than；最高級多用 the + -est / most。',example:'Amy runs faster than Ben.',pitfall:'good → better → best；不要說 more better。',qs:[['mc','Tina sings ___ than I do.',['beautiful','more beautifully','most beautiful','beautifully'],1,'修飾 sings 用副詞，than 需比較級 more beautifully。'],['cl','This test is ___ than that one. (easy)','easier','easy 的比較級改 y 為 i 加 -er。'],['fix','改正：This is more better than that.','This is better than that.','better 已是比較級，不需 more。']]},
{title:'特殊動詞・感官／使役／連綴',words:['seem｜似乎','taste｜嚐起來','make｜使得','let｜讓'],phrases:['make someone laugh 使人笑','look like 看起來像','feel tired 感到累'],dialog:'A: How does the soup taste? B: It tastes great.',rule:'感官連綴動詞 + 形容詞：look happy、taste good。使役動詞 make/let + 人 + 原形動詞。',example:'The song makes me smile.',pitfall:'He looks happily ✕ → He looks happy ✓（描述主詞狀態）。',qs:[['mc','The music made us ___.',['danced','dancing','dance','to dance'],2,'使役動詞 made + 受詞 + 原形動詞。'],['cl','The cake tastes ___. (good)','good','taste 為連綴動詞，此處接形容詞 good。'],['fix','改正：She looks happily today.','She looks happy today.','連綴動詞 looks 後接形容詞 happy。']]},
{title:'動名詞與不定詞',words:['decide｜決定','enjoy｜享受','avoid｜避免','promise｜答應'],phrases:['want to 想要','enjoy V-ing 喜歡做','stop to V 停下去做…'],dialog:'A: Do you enjoy reading? B: Yes, I do.',rule:'enjoy/finish/mind 後常接 V-ing；want/hope/decide 後接 to + V；介系詞後常接 V-ing。',example:'I decided to study. / She enjoys swimming.',pitfall:'look forward to 中的 to 是介系詞，所以接 V-ing。',qs:[['mc','Ken enjoys ___ novels.',['read','to read','reading','reads'],2,'enjoy 後接 V-ing。'],['cl','They decided ___ early. (leave)','to leave','decide 後接 to + V。'],['fix','改正：I look forward to see you.','I look forward to seeing you.','look forward to 後面用 V-ing。']]},
{title:'被動語態',words:['invent｜發明','build｜建造','produce｜製造','written｜被寫成的'],phrases:['be made of 由…製成','be known for 以…聞名','be interested in 對…感興趣'],dialog:'A: Who wrote this book? B: It was written by Leo.',rule:'被動語態 be + p.p.；be 隨時態與主詞改變。可用 by + 動作者。',example:'The window was broken yesterday.',pitfall:'被動式不能漏掉 be：The cake made by Mom ✕（作完整句時）。',qs:[['mc','English ___ in many countries.',['speaks','is spoken','spoke','speaking'],1,'English 是被說的，現在簡單式被動用 is spoken。'],['cl','The bridge was ___ in 2010. (build)','built','was 後接 build 的過去分詞 built。'],['fix','改正：The homework finished yesterday.','The homework was finished yesterday.','主詞 homework 受動作，應用 was finished。']]},
{title:'附加問句・間接問句',words:['wonder｜想知道','whether｜是否','question｜問題','answer｜回答'],phrases:['do you know 你知道嗎','isn’t it 對吧','tell me 告訴我'],dialog:'A: Do you know where she lives? B: Yes, I do.',rule:'附加問句多採前肯後否、前否後肯。間接問句用直述語序：疑問詞 + 主詞 + 動詞。',example:'He is tired, isn’t he? / I know where he lives.',pitfall:'Do you know where does he live? ✕ → where he lives ✓。',qs:[['mc','She can swim, ___?',['can she','is she','can’t she','doesn’t she'],2,'前半肯定 can，附加問句用 can’t she。'],['cl','Do you know where he ___? (live)','lives','間接問句是直述語序，he lives。'],['fix','改正：Can you tell me where is the station?','Can you tell me where the station is?','間接問句採主詞 + 動詞語序。']]},
{title:'關係子句',words:['who｜關係代名詞（人）','which｜關係代名詞（物）','whose｜誰的','that｜關係代名詞'],phrases:['the boy who ... 那位…的男孩','the book that ... 那本…的書','a place where ... 一個…的地方'],dialog:'A: Who is the boy who won? B: He is Jack.',rule:'關係子句修飾前面的名詞；who 通常指人，which 指物，that 在多數限定用法可指人或物。',example:'The girl who sits there is my friend.',pitfall:'The man who he lives here ✕：who 已在子句當主詞，不要再補 he。',qs:[['mc','The woman ___ teaches us is kind.',['which','who','where','when'],1,'先行詞 woman 指人，且關係詞當主詞，用 who。'],['cl','This is the bike ___ I bought.','that|which','指物且當受詞，that 或 which 都可。'],['fix','改正：The boy who he called me is Tom.','The boy who called me is Tom.','who 已當關係子句主詞，不可再放 he。']]},
{title:'名詞子句・總複習',words:['believe｜相信','explain｜解釋','whether｜是否','truth｜事實'],phrases:['I think that ... 我認為…','what he said 他說的話','whether or not 是否'],dialog:'A: What do you think? B: I think that it will rain.',rule:'名詞子句可當主詞、受詞或補語。間接問句仍保持直述語序，時態需依語意判斷。',example:'I don’t know what she wants.',pitfall:'I wonder what does she want ✕ → I wonder what she wants ✓。',qs:[['mc','I don’t know ___.',['what does he want','what he wants','what is he want','what wants he'],1,'know 後面的間接問句用直述語序。'],['cl','She said ___ she was tired.','that','that 可引導表示陳述內容的名詞子句。'],['fix','改正：Tell me why did he leave.','Tell me why he left.','間接問句中使用 why + 主詞 + 動詞。']]}

const DETAILED_NOTES={7:{"source":"參照《文法總匯》介系詞、連接詞及子句相關架構與《主題探索》生活情境，整理對等連接、原因、讓步、條件及時間子句；教學例句為新編。","sections":[{"title":"① 對等連接詞 and / but / or / so","intro":"連接相同語法層級的字詞、片語或子句，先辨別語意關係。","rows":[["and 表並列","Amy likes music and art.","兩者都成立，連接相同詞性。"],["but 表轉折","He was tired, but he kept working.","前後語意對比。"],["or 表選擇","Would you like tea or juice?","提供選項。"],["so 表結果","It rained, so we stayed home.","前因後果，so 後為結果。"],["both ... and ...","Both Kevin and May are here.","兩者皆是；並列主詞通常搭配複數動詞。"]],"mistakes":["✘ Although it rained, but we went out. → ✔ Although it rained, we went out.","because 和 so 不要在同一因果結構重複搭配。"]},{"title":"② because 與 because of","intro":"兩者都表示原因，但後面接的結構不同。","rows":[["because + 子句","I stayed home because I was sick.","子句有主詞與動詞。"],["because of + 名詞","We stayed home because of the storm.","名詞或名詞片語。"],["句首原因子句","Because it was late, we left.","前置從屬子句後通常加逗號。"],["問答","Why were you absent? Because I had a fever.","回答 Why 的原因。"]],"mistakes":["✘ because of it rained → ✔ because it rained","✘ because the storm → ✔ because of the storm"]},{"title":"③ although / though 與轉折","intro":"讓步子句表示雖然有某情況，但主要結果仍發生。","rows":[["although","Although it was cold, she went jogging.","雖然很冷，仍去慢跑。"],["though","Though I was nervous, I spoke clearly.","與 although 類似。"],["but","It was cold, but she went jogging.","用對等連接詞連接兩個子句。"],["even though","Even though it rained heavily, the game continued.","語氣較強。"]],"mistakes":["✘ Although I was tired, but I studied. → ✔ Although I was tired, I studied.","✘ Though she is young, but she works hard. → ✔ Though she is young, she works hard."]},{"title":"④ if / unless 條件子句","intro":"未來條件常用『主句未來式、條件子句現在式』。","rows":[["if","If it rains, we'll stay home.","如果下雨就待在家。"],["unless","Unless you study, you won't pass.","unless = if ... not。"],["主句在前","We'll go out if the weather is nice.","if 子句在後時一般不必加逗號。"],["祈使句搭配","Call me if you need help.","條件成立時請採取行動。"],["時間與條件","If he comes tomorrow, I will tell him.","if 子句不要寫 will come。"]],"mistakes":["✘ If it will rain, we will stay home. → ✔ If it rains, we will stay home.","✘ Unless you don't hurry, you'll miss the bus. → ✔ Unless you hurry, you'll miss the bus."]},{"title":"⑤ when / while / before / until / as soon as","intro":"判斷兩個動作的先後與是否同時進行。","rows":[["when","I was reading when Dad called.","電話發生時，我正在看書。"],["while","While I was cooking, my brother was studying.","強調動作同時持續。"],["before / after","Wash your hands before you eat.","指出先後順序。"],["until","Wait here until I return.","持續到某時間。"],["as soon as","I'll call you as soon as I arrive.","一…就…。"],["未來時間子句","When she gets home, she will rest.","從屬子句用現在式表示未來。"]],"mistakes":["✘ when I will arrive → ✔ when I arrive","✘ because of she was late → ✔ because she was late"]}]},8:{"source":"參照《文法總匯》形容詞、副詞與比較相關章節及《主題探索》人物、物品比較情境；依國中常見觀念重編例句及陷阱。","sections":[{"title":"① 形容詞與副詞的功能","intro":"先辨識修飾對象，再選字形。","rows":[["形容詞修飾名詞","She is a careful driver.","careful 修飾 driver。"],["副詞修飾動詞","She drives carefully.","carefully 修飾 drives。"],["連綴動詞 + 形容詞","The soup tastes good.","look、sound、smell、taste、feel 後常接形容詞。"],["副詞位置","He often walks to school.","頻率副詞通常在一般動詞之前。"],["good / well","He is a good singer. / He sings well.","good 是形容詞；well 通常是副詞。"]],"mistakes":["✘ She drives careful. → ✔ She drives carefully.","✘ The cake tastes deliciously. → ✔ The cake tastes delicious."]},{"title":"② 比較級：兩者比較","intro":"通常搭配 than，依字尾決定變化。","rows":[["單音節加 -er","tall → taller; small → smaller","比較級常搭配 than。"],["字尾 -e 加 -r","nice → nicer; large → larger","避免重複 e。"],["子音 + y","easy → easier; heavy → heavier","y 改 i 加 -er。"],["短母音 + 單子音","big → bigger; hot → hotter","符合條件時雙寫末字母。"],["多音節 more","careful → more careful","某些形容詞用 more。"],["不規則","good/well → better; bad → worse","需直接記憶。"]],"mistakes":["✘ more taller → ✔ taller","✘ gooder → ✔ better"]},{"title":"③ 最高級：三者以上與範圍","intro":"最高級前常加 the，並標示比較範圍。","rows":[["一般 -est","tall → the tallest","三人以上的比較。"],["字尾變化","big → biggest; happy → happiest","依拼字規則改變。"],["most","beautiful → the most beautiful","多音節形容詞常用 most。"],["不規則","good → best; bad → worst","不能加 most good。"],["範圍","Amy is the tallest in her class.","in + 團體或空間。"],["one of the ...","She is one of the best players.","one of the + 最高級 + 複數名詞。"]],"mistakes":["✘ the most easiest → ✔ the easiest","✘ one of the tallest student → ✔ one of the tallest students"]},{"title":"④ as ... as、not as ... as","intro":"表示相等或不相等比較，原級不能改比較級。","rows":[["相等","Ken is as tall as Leo.","as + 形容詞原級 + as。"],["不相等","This bag isn't as heavy as that one.","not as ... as。"],["副詞原級","She runs as fast as her brother.","修飾動詞使用副詞。"],["數量比較","I have as many books as you.","many + 可數複數。"],["不可數數量","He has as much time as I do.","much + 不可數名詞。"]],"mistakes":["✘ as taller as → ✔ as tall as","✘ as more carefully as → ✔ as carefully as"]},{"title":"⑤ 比較級加強與會考陷阱","intro":"理解程度副詞、越來越、兩者中的較者。","rows":[["much / a lot + 比較級","This one is much cheaper.","強化差距。"],["a little + 比較級","He is a little taller.","表示略微。"],["比較級 and 比較級","It's getting colder and colder.","越來越…。"],["more and more + 多音節","The story is more and more interesting.","逐漸增加程度。"],["the 比較級, the 比較級","The more you practice, the better you get.","越…就越…。"],["兩者中的較者","This is the better of the two.","兩者仍用比較級。"]],"mistakes":["✘ more better → ✔ much better（若要強調）","✘ the most of the two → ✔ the better of the two"]}]},9:{"source":"參照《文法總匯》動詞與特殊動詞相關章節，以及《主題探索》感官、使役和句型練習。以下是重新編排的對照表與例句。","sections":[{"title":"① 五大感官連綴動詞","intro":"此處描述主詞狀態，後面通常接形容詞，而非副詞。","rows":[["look + 形容詞","You look tired.","你看起來很累。"],["sound + 形容詞","That sounds exciting.","聽起來令人興奮。"],["smell + 形容詞","The flowers smell sweet.","聞起來香。"],["taste + 形容詞","The soup tastes salty.","嚐起來鹹。"],["feel + 形容詞","I feel nervous.","感到緊張。"]],"mistakes":["✘ He looks happily. → ✔ He looks happy.","感官動詞若表『用感官做動作』，結構可能不同：She looked carefully at the map."]},{"title":"② look / look like 與感官用法對照","intro":"看起來具有某特性 vs 看起來像某人或某物。","rows":[["look + 形容詞","Amy looks happy.","描述狀態。"],["look like + 名詞","Amy looks like her mother.","像某人、某物。"],["sound like + 名詞","It sounds like a good plan.","聽起來像某件事。"],["feel like + N/V-ing","I feel like eating noodles.","此處表示想做某事。"],["taste / smell + 形容詞","The milk smells strange.","表示特性。"]],"mistakes":["✘ looks like happy → ✔ looks happy","✘ looks her mother → ✔ looks like her mother"]},{"title":"③ make / let / have：使役動詞","intro":"主動使役句的受詞後用動詞原形。","rows":[["make + 人 + 原形","The joke made us laugh.","使某人做某事。"],["let + 人 + 原形","Mom let me go out.","允許某人做某事。"],["have + 人 + 原形","I had Tom wash the car.","請／讓某人做事。"],["make + 人 + 形容詞","The news made her sad.","使人進入某狀態。"],["被動 make","He was made to apologize.","被動式須補回 to。"]],"mistakes":["✘ made me to cry → ✔ made me cry","✘ let him to leave → ✔ let him leave"]},{"title":"④ get / help 與特殊動詞","intro":"相近語意但句型不同。","rows":[["get + 人 + to V","I got my brother to help me.","和 make/let + 原形不同。"],["help + 人 + (to) V","She helped me (to) carry the bags.","to 可省略。"],["have + 物 + p.p.","I had my hair cut.","表示請人完成服務。"],["get + 物 + p.p.","I got my bike repaired.","使物品被修理好。"],["keep + 人／物 + 形容詞","Keep the door open.","保持某狀態。"]],"mistakes":["✘ got her help me → ✔ got her to help me","✘ have my hair cutted → ✔ have my hair cut"]},{"title":"⑤ see / hear / watch / notice 與原形／V-ing","intro":"感官動詞後常接受詞加原形或 V-ing，意義焦點不同。","rows":[["see + 人 + 原形","I saw Ben cross the street.","強調看到完整動作。"],["see + 人 + V-ing","I saw Ben crossing the street.","強調看到動作正在發生。"],["hear + 人 + 原形","I heard her sing.","聽見完整演唱動作。"],["hear + 人 + V-ing","I heard her singing.","聽到正在唱歌。"],["watch + 人 + V-ing","We watched the kids playing.","看到正在進行的活動。"]],"mistakes":["✘ I heard him to sing. → ✔ I heard him sing.","原形與 V-ing 的選擇主要取決於語意及觀察焦點。"]}]},4:{"source":"依《文法總匯》第 1、2 章（現在／過去簡單式、進行式）及《主題探索》相應時態主題整理；例句及辨析為新編教學內容。","sections":[{"title":"① 過去簡單式：be 動詞","intro":"表示過去某時的身分、位置或狀態。","rows":[["was / were","I was tired. / They were late.","I/he/she/it 用 was；you/we/they 用 were。"],["否定","He wasn't home.","was/were 後加 not。"],["疑問","Were you busy yesterday?","將 was/were 提前。"],["時間線索","yesterday, last week, two days ago","看到明確過去時間，優先檢查過去式。"]],"mistakes":["✘ They was late. → ✔ They were late.","✘ Was you happy? → ✔ Were you happy?"]},{"title":"② 一般動詞過去式","intro":"敘述已發生並結束的動作。","rows":[["肯定句","She visited Grandma yesterday.","主詞 + 過去式。"],["否定句","She didn't visit Grandma.","didn't + 原形，不再用過去式。"],["疑問句","Did she visit Grandma?","Did + 主詞 + 原形？"],["規則變化","work → worked; live → lived; study → studied","依字尾決定 -ed、-d、-ied。"],["不規則變化","go → went; buy → bought; see → saw","需另外記憶。"]],"mistakes":["✘ Did you went? → ✔ Did you go?","✘ She didn't bought it. → ✔ She didn't buy it."]},{"title":"③ 過去進行式","intro":"描述過去特定時刻正在進行的動作。","rows":[["基本句型","I was doing homework at eight.","was/were + V-ing。"],["否定","We weren't sleeping then.","were not + V-ing。"],["疑問","What were you doing at nine?","疑問詞 + was/were + 主詞 + V-ing。"],["at that time","They were playing soccer at that time.","表示當時正在進行。"],["while","While I was reading, Mom was cooking.","常用來描述兩個過去同時進行的動作。"]],"mistakes":["✘ He was play. → ✔ He was playing.","✘ They were study. → ✔ They were studying."]},{"title":"④ when / while 的時態搭配","intro":"把持續中的背景動作與突然發生的事件分開。","rows":[["持續 + 短暫","I was taking a shower when the phone rang.","背景用過去進行式；發生的事件用過去式。"],["while 引導","While she was walking, it started to rain.","while 後常見進行中的動作。"],["兩個持續動作","Dad was cooking while I was setting the table.","兩個動作可以同時持續。"],["先後事件","I opened the door and walked in.","純粹敘述過去事件可用過去簡單式。"]],"mistakes":["✘ When the bell rang, I was slept. → ✔ ... I was sleeping.","when 不只能接短暫動作，須按語意判斷。"]},{"title":"⑤ used to 與時間判斷","intro":"用於描述過去習慣，以及幾種常見的時態判斷線索。","rows":[["used to + V","I used to walk to school.","過去常做，現在不一定。"],["didn't use to","He didn't use to eat vegetables.","didn't 後用 use 原形。"],["ago","We met two years ago.","ago 常搭配過去簡單式。"],["last / yesterday","She called me last night.","已完成的動作。"],["at eight last night","She was studying at eight last night.","強調當時進行中。"]],"mistakes":["✘ He used to went. → ✔ He used to go.","✘ didn't used to → ✔ didn't use to"]}]},5:{"source":"依《文法總匯》第 3 章「未來簡單式與現在／過去完成式」（約第 30–46 頁）及《主題探索》相應時態主題整理；例句與提醒為新編。","sections":[{"title":"① 未來式 will / be going to","intro":"兩者都能表示未來，但側重語意可能不同。","rows":[["will + V","I will help you.","可表示臨時決定、承諾或預測。"],["be going to + V","We are going to visit Tainan.","常描述計畫或有依據的預測。"],["否定","She won't leave. / She isn't going to leave.","will not = won't。"],["疑問","Will it rain? / Are you going to cook?","分別提前 will 或 be 動詞。"],["時間詞","tomorrow, next Sunday, in two weeks","常與未來式搭配。"]],"mistakes":["✘ will to go → ✔ will go","✘ She going to go → ✔ She is going to go"]},{"title":"② 未來時間子句","intro":"主句談未來，when、if 等時間／條件子句常用現在式。","rows":[["when","I'll text you when I arrive.","when 子句用現在式 arrive。"],["if","If it rains, we'll stay home.","if 子句描述未來條件，常用現在式。"],["before / after","Please call before you leave.","依語境選擇時態。"],["as soon as","I'll tell you as soon as I know.","表示一…就…。"]],"mistakes":["✘ when I will arrive → ✔ when I arrive","不能一看到未來語意就全部使用 will。"]},{"title":"③ 現在完成式 have / has + p.p.","intro":"把過去的事與現在的結果、經驗或持續狀態連結。","rows":[["基本句型","She has finished her homework.","have/has + 過去分詞。"],["否定／疑問","I haven't eaten. / Have you eaten?","have/has 當助動詞。"],["經驗","Have you ever visited Japan?","ever、never 常用於經驗。"],["完成結果","He has just left.","just、already、yet 常見。"],["持續","We have lived here for five years.","某些動詞可搭配持續時間。"]],"mistakes":["✘ She has went. → ✔ She has gone.","✘ I have seen him yesterday. → ✔ I saw him yesterday.（指明過去時間）"]},{"title":"④ for / since 與完成式副詞","intro":"時間片語是國中完成式最常見的判斷重點。","rows":[["for + 一段時間","for three months","期間。"],["since + 起始時間","since 2022 / since Monday","起點。"],["already","I have already eaten.","常見於肯定句。"],["yet","Have you finished yet?","常見於問句或否定句句末。"],["just","She has just arrived.","表示剛剛。"],["ever / never","Have you ever seen snow?","經驗用法。"]],"mistakes":["✘ since five years → ✔ for five years","✘ has finished yesterday → ✔ finished yesterday"]},{"title":"⑤ have been to / have gone to / 過去完成式","intro":"辨識去過、去了尚未回來，以及過去某時間之前已完成。","rows":[["have been to","I have been to Japan twice.","去過，有經驗。"],["have gone to","Dad has gone to the store.","去了，通常人不在這裡。"],["had + p.p.","The train had left before we arrived.","過去的過去。"],["before / by the time","By the time I got there, they had eaten.","釐清兩個過去動作的先後。"],["過去完成式否定","She hadn't finished when I called.","hadn't + p.p.。"]],"mistakes":["✘ He has been to the store, so he isn't here. → 視語意應用 has gone to。","✘ had went → ✔ had gone"]}]},6:{"source":"依《文法總匯》第 4 章「助動詞」（約第 47–57 頁）整理，延伸對應《主題探索》的生活指令與建議對話；例句與錯誤對比為新編。","sections":[{"title":"① can / could / may / might","intro":"情態助動詞後通常接原形動詞，語氣與功能各不相同。","rows":[["can","I can swim.","能力、許可或可能性。"],["could","Could you help me?","可表示過去能力或較委婉的請求。"],["may","May I come in?","徵求許可較正式。"],["might","It might rain tonight.","不確定的可能性。"],["共同規則","She can speak English.","不加第三人稱 -s，也不加 to。"]],"mistakes":["✘ She cans swim. → ✔ She can swim.","✘ may to leave → ✔ may leave"]},{"title":"② must / have to / need","intro":"「必須」、「不必」與「禁止」是關鍵差別。","rows":[["must","You must wear a seat belt.","必要、義務。"],["have to / has to","He has to get up early.","依主詞和時態變化。"],["mustn't","You mustn't park here.","禁止，不是『不必』。"],["don't have to","You don't have to come early.","不必、無此義務。"],["need to","I need to study.","need 作一般動詞時接 to V。"]],"mistakes":["✘ You mustn't go = 你不必去（錯，應解為禁止）","✘ She have to work. → ✔ She has to work."]},{"title":"③ should / had better / shall / would","intro":"常用於建議、邀請、提議及禮貌表達。","rows":[["should","You should drink more water.","建議。"],["had better","You had better leave now.","後面接原形，不加 to。"],["shall","Shall we go?","提出建議。"],["would like to","I would like to order tea.","禮貌表達意願。"],["would you","Would you open the window?","禮貌請求。"]],"mistakes":["✘ had better to go → ✔ had better go","✘ should studies → ✔ should study"]},{"title":"④ 祈使句與 Let's","intro":"常見於課堂規範、生活指令、路線與安全提醒。","rows":[["肯定祈使句","Please sit down.","原形動詞開頭。"],["否定祈使句","Don't touch the screen.","Don't + 原形。"],["be 祈使句","Be careful.","be 仍用原形 Be。"],["Let's","Let's play a game.","Let's + 原形。"],["附加問句","Let's go, shall we?","常見固定搭配。"]],"mistakes":["✘ Don't to run. → ✔ Don't run.","✘ Let's playing. → ✔ Let's play."]},{"title":"⑤ used to / be used to / 能力與請求整理","intro":"辨識看似相近、實際意思不同的結構。","rows":[["used to + V","I used to live in Taipei.","過去習慣。"],["be used to + N/V-ing","I'm used to getting up early.","習慣於。"],["be able to + V","She will be able to drive.","可用於不同時態的能力表達。"],["Can you...?","Can you pass me the salt?","一般請求。"],["Could you...?","Could you pass me the salt?","較委婉的請求。"],["You'd better not","You'd better not stay up late.","否定為 had better not + V。"]],"mistakes":["✘ used to playing（表過去習慣時）→ ✔ used to play","✘ be used to get up（表習慣於時）→ ✔ be used to getting up"]}]},1:{"source":"依《主題探索》第 2 單元（約第 28–41 頁）名詞、所有格、反身與疑問代名詞整理，並參照《文法總匯》第 6 章名詞與代名詞（約第 76–98 頁）。下列例句為重新編寫。","sections":[{"title":"① 可數與不可數名詞","intro":"名詞是否能逐一計數，會影響冠詞、複數與數量詞。","rows":[["可數單數","a book, an apple","單數可數名詞通常需要限定詞。"],["可數複數","two boxes, three children","box → boxes；child → children。"],["不可數名詞","information, advice, water","不可直接加複數 -s 或 a/an。"],["單位量詞","two pieces of advice; a glass of water","用可數的計量單位表示份量。"],["集合及特殊用法","a pair of glasses; the police are ...","glasses 常用複數；police 指警察群體。"]],"mistakes":["✘ two advices → ✔ two pieces of advice","✘ an information → ✔ some information"]},{"title":"② 名詞複數變化","intro":"先掌握一般規則，再辨識不規則字形。","rows":[["加 -s","book → books","一般名詞。"],["加 -es","bus → buses; box → boxes","常見於 s、x、ch、sh 等字尾。"],["子音 + y","baby → babies","去 y 改 ies。"],["-f / -fe","knife → knives; leaf → leaves","部分詞變成 -ves，但存在例外。"],["不規則複數","man → men; foot → feet; mouse → mice","不能套用一般 -s 規則。"],["單複數同形","sheep → sheep; deer → deer","數量由限定詞與語境判斷。"]],"mistakes":["✘ childs → ✔ children","✘ two sheeps → ✔ two sheep"]},{"title":"③ 人稱代名詞與所有格","intro":"區分主格、受格、所有格形容詞與所有格代名詞。","rows":[["主格","I / he / she / we / they","當句子主詞：She knows me。"],["受格","me / him / her / us / them","動詞或介系詞後：Help us。"],["所有格形容詞","my / your / his / her / our / their","後面要接名詞：my bag。"],["所有格代名詞","mine / yours / his / hers / ours / theirs","可單獨使用：The bag is mine。"],["雙重所有格","a friend of mine","表示我的某位朋友。"]],"mistakes":["✘ The bag is my. → ✔ The bag is mine.","✘ Me like English. → ✔ I like English."]},{"title":"④ 反身代名詞與指示代名詞","intro":"反身代名詞表示動作回到主詞，也能用於強調。","rows":[["反身代名詞","myself, yourself, himself, herself, itself","主詞和受詞相同：He hurt himself。"],["複數反身代名詞","ourselves, yourselves, themselves","We made it ourselves。"],["by oneself","She studied by herself.","表示獨自完成。"],["指示代名詞","this / that / these / those","近單／遠單／近複／遠複。"],["限定詞用法","these books; that chair","指示詞也可直接修飾名詞。"]],"mistakes":["✘ by ourself → ✔ by ourselves","✘ this books → ✔ these books"]},{"title":"⑤ 所有格與 Wh- 疑問詞","intro":"注意人與物的所有關係，以及疑問詞在句中角色。","rows":[["單數名詞所有格","Amy's bicycle","表示 Amy 的腳踏車。"],["規則複數所有格","the students' classroom","複數以 s 結尾，通常加撇號即可。"],["whose","Whose pen is this?","詢問『誰的』。"],["who / whom","Who called you? / Whom did you call?","前者作主格，whom 用於正式受格情境。"],["which / what","Which color do you prefer?","which 常指限定範圍的選擇。"],["How long / often / far","How often do you exercise?","依期間、頻率、距離選擇問法。"]],"mistakes":["✘ who's book → ✔ whose book","✘ Whose is this pen belongs to? → ✔ Whose pen is this?"]}]},2:{"source":"依《主題探索》第 3 單元（約第 52–65 頁）數量詞、不定代名詞、there be 與 have 整理，並參照《文法總匯》第 6–7 章的相關內容。例句為重新編寫。","sections":[{"title":"① How many / How much 與數量詞","intro":"先判斷名詞能不能數，再決定使用哪個數量詞。","rows":[["How many","How many eggs are there?","搭配可數複數。"],["How much","How much rice do you need?","搭配不可數名詞；也可問價格。"],["many / few / a few","many books; a few friends; few friends","搭配可數複數。"],["much / little / a little","much time; a little milk; little time","搭配不可數名詞。"],["a lot of / lots of","a lot of people; lots of water","兩類名詞皆可使用。"]],"mistakes":["✘ many water → ✔ much water","few 是少到幾乎沒有；a few 表有一些。"]},{"title":"② some / any 與複合不定代名詞","intro":"some、any 通常依肯定、否定及提問語意決定。","rows":[["some","I have some bread.","肯定句常用；提供或邀請時疑問句也常用。"],["any","Do you have any questions?","否定句與一般疑問句常見。"],["somebody / someone","Someone is knocking.","作主詞通常視為單數。"],["anything / nothing","I didn't hear anything.","anything 可用於否定句。"],["形容詞位置","something interesting","形容詞放複合不定代名詞後。"]],"mistakes":["✘ something interestingly → ✔ something interesting","✘ anyone are here → ✔ anyone is here"]},{"title":"③ each、every、both、either、neither","intro":"掌握兩者和全體的差異及動詞一致。","rows":[["each / every","Each child has a card.","通常搭配單數名詞與單數動詞。"],["both","Both boys are ready.","兩者皆是，動詞用複數。"],["either","Either answer is fine.","兩者中任一個。"],["neither","Neither answer is right.","兩者都不是。"],["each of","Each of the students has a book.","of 後複數，但主詞中心 each 是單數。"]],"mistakes":["✘ Every students are... → ✔ Every student is...","✘ Both boy is... → ✔ Both boys are..."]},{"title":"④ one / ones / another / other / others","intro":"用代名詞避免重複名詞，注意單複數。","rows":[["one / ones","I like the red one. / the blue ones","代替前文可數名詞。"],["another","May I have another cup?","另一個、不特定的一個。"],["other + 名詞","other students","other 後接名詞。"],["others","Some are reading; others are talking.","others 可單獨代替其他人或物。"],["the other / the others","One is red; the other is blue.","特定剩餘對象。"]],"mistakes":["✘ another books → ✔ other books","✘ Some students ..., other are ... → ✔ others are ..."]},{"title":"⑤ there be 和 have / has","intro":"there be 強調某處存在，have/has 強調某人擁有。","rows":[["There is","There is a pen on the table.","後接單數或不可數。"],["There are","There are four pencils.","後接複數。"],["就近一致","There is a cat and two dogs.","依 be 後最接近的名詞判斷。"],["have / has","She has a new bike.","主詞是擁有者；he/she/it 用 has。"],["疑問句","Is there a store nearby?","there be 疑問句將 be 提前。"]],"mistakes":["✘ There have two cats. → ✔ There are two cats.","✘ She have a bike. → ✔ She has a bike."]}]},3:{"source":"依《主題探索》第 4 單元（約第 75–83 頁）現在簡單式與現在進行式整理，並對照《文法總匯》第 1–2 章（約第 6–29 頁）的時態用法。例句為重新編寫。","sections":[{"title":"① 現在簡單式：be 動詞","intro":"描述身分、狀態、一般事實；按人稱決定 am/is/are。","rows":[["肯定","I am a student. / She is happy.","I am；he/she/it is；we/you/they are。"],["否定","They are not tired.","be 後加 not。"],["疑問","Are you ready? → Yes, I am.","be 移到主詞前。"],["頻率副詞","She is usually busy.","頻率副詞通常放 be 後。"]],"mistakes":["✘ She are happy. → ✔ She is happy.","✘ Are you student? → ✔ Are you a student?"]},{"title":"② 現在簡單式：一般動詞","intro":"表示習慣、固定活動與普遍事實。","rows":[["肯定","He studies every day.","第三人稱單數動詞加 -s / -es 或改 -ies。"],["否定","He doesn't play baseball.","doesn't 後接原形。"],["疑問","Does she walk to school?","Does + 主詞 + 原形動詞。"],["Wh- 問句","What time do you get up?","疑問詞 + do/does + 主詞 + 原形。"],["常見時間詞","usually; often; every Friday","提示經常性動作。"]],"mistakes":["✘ He doesn't plays. → ✔ He doesn't play.","✘ She study every day. → ✔ She studies every day."]},{"title":"③ 第三人稱單數拼字變化","intro":"特別注意 -s、-es、-ies。","rows":[["一般加 -s","read → reads; play → plays","母音 + y 後直接加 -s。"],["加 -es","watch → watches; go → goes","ch、sh、s、x、o 等常見字尾。"],["子音 + y → -ies","study → studies; try → tries","去 y 改 ies。"],["特例","have → has","不要寫 haves。"]],"mistakes":["✘ study → studys → ✔ studies","✘ watch → watchs → ✔ watches"]},{"title":"④ 現在進行式：be + V-ing","intro":"表說話當下或現階段正在進行的動作。","rows":[["肯定","She is reading now.","主詞 + am/is/are + V-ing。"],["否定","They aren't playing.","be 後面加 not。"],["疑問","Is Tom sleeping?","將 be 提前。"],["直接加 -ing","read → reading; cook → cooking","一般動詞。"],["去 e 加 -ing","make → making; write → writing","不發音 e 常省略。"],["雙寫字尾","run → running; sit → sitting","部分重讀短母音 + 單子音動詞。"]],"mistakes":["✘ She is read. → ✔ She is reading.","✘ They playing. → ✔ They are playing."]},{"title":"⑤ 現在簡單式與進行式比較","intro":"依語境與時間線索辨別習慣或當下狀態。","rows":[["習慣","I drink tea every morning.","現在簡單式。"],["正在發生","I am drinking tea now.","現在進行式。"],["對照","He usually walks, but today he is taking a bus.","兩個時態可出現在同一句。"],["Look! / Listen!","Listen! Someone is singing.","常提示當下正在發生。"],["狀態動詞","I know the answer.","know、believe 等一般不以進行式表示狀態。"]],"mistakes":["✘ I am knowing the answer. → ✔ I know the answer.","✘ Look! The children play. → ✔ Look! The children are playing."]}]},0:{"source":"依《主題探索》單元 1（約第 9–19 頁）整理，並參考《文法總匯》時態、句型相關章節；下方是重新編寫的教學例句與易錯提醒，不是原書逐頁轉錄。","sections":[{"title":"① 冠詞 a / an / the","intro":"先分辨名詞是否為單數可數，再判斷是不是第一次提及或特定對象。","rows":[["a + 子音音素","a book, a university","university 雖然字首是 u，發音以 /j/ 開頭。"],["an + 母音音素","an apple, an hour","hour 的 h 不發音。"],["the + 已知、特定事物","I saw a cat. The cat was black.","第二次提到同一事物改用 the。"],["不用冠詞的常見情況","I like music. / She plays basketball.","一般泛指不可數名詞與多數球類前，不加 a/an。"]],"mistakes":["✘ an useful idea → ✔ a useful idea","✘ a hour → ✔ an hour","✘ I saw a dog. A dog was cute. → ✔ I saw a dog. The dog was cute."]},{"title":"② 招呼、問候、介紹與電話用語","intro":"依情境判斷何時使用固定表達，並注意電話中的主詞與代名詞。","rows":[["初次見面","Nice to meet you. → Nice to meet you, too.","初見與回應均可使用此句。"],["關心近況","How's everything? → Pretty good.","比只回答 Yes 更自然。"],["介紹他人","This is my classmate, Amy.","介紹人物常用 This is...。"],["電話找人","May I speak to Kevin? → Speaking.","接電話者本人可說 Speaking。"],["暫時等候","Hold on, please.","意思是請稍候，非掛電話。"],["打錯電話","Sorry, you have the wrong number.","提醒對方打錯號碼。"]],"mistakes":["✘ I am Kevin.（電話回應中較不自然）→ ✔ Speaking. / This is Kevin speaking.","✘ Nice to meet you. → Yes. → ✔ Nice to meet you, too."]},{"title":"③ 基數、序數、分數與數量","intro":"基數用來計數，序數用來表示次序與日期。","rows":[["基數","one, two, three, twenty-one","21 等十位與個位可用連字號。"],["序數","first, second, third, fourth, twenty-first","1st、2nd、3rd 是不規則拼法。"],["整百、整千","one hundred; two thousand","前有確切數字時 hundred/thousand 不加 s。"],["分數","one half, one third, two thirds","分子大於 1 時，分母通常改成複數。"],["數量搭配","a lot of books / a lot of water","a lot of 可修飾可數複數與不可數名詞。"]],"mistakes":["✘ two hundreds students → ✔ two hundred students","✘ two third → ✔ two thirds","✘ twenty-one-th → ✔ twenty-first"]},{"title":"④ 時間、日期與年齡","intro":"這是第 1 單元常出現的生活對話題型，可先看問句、再決定回答方式。","rows":[["詢問鐘點","What time is it? → It's seven thirty.","What's the time? 也可詢問鐘點。"],["整點／一刻／半點","six o'clock; a quarter past six; half past six","6:15 是過一刻；6:30 是半點。"],["差幾分到下一整點","a quarter to seven = 6:45","to 後面接下一個鐘點。"],["日常作息時間","What time do you get up? → At seven.","動作發生的確切時間前使用 at。"],["星期與日期","What day is it today? / What's the date today?","day 問星期；date 問幾月幾號。"],["日期讀法","May 2nd → May second","日期通常使用序數。"],["年齡問答","How old is your sister? → She is twelve.","twelve-year-old 放在名詞前作複合形容詞，year 不加 s。"]],"mistakes":["✘ at Monday → ✔ on Monday","✘ He is twelve-years-old. → ✔ He is twelve years old.","✘ a twelve-years-old boy → ✔ a twelve-year-old boy"]},{"title":"⑤ 祈使句與常見生活片語","intro":"祈使句用來指示、請求、提醒；片語則要注意動詞搭配。","rows":[["肯定祈使句","Please sit down. / Turn left.","原形動詞起首。"],["否定祈使句","Don't run in the hallway.","Don't + 動詞原形。"],["邀請一起做","Let's take a break.","Let's 後用原形動詞。"],["借入與借出","borrow a pen from Amy / lend a pen to Amy","borrow from；lend to。"],["時間相關片語","on time; the day after tomorrow; every other day","準時；後天；每隔一天。"],["電話片語","make a phone call; leave a message","打電話；留言。"]],"mistakes":["✘ Don't to run. → ✔ Don't run.","✘ Can I lend your pen? → ✔ Can I borrow your pen?","✘ She lent a book from Tom. → ✔ She borrowed a book from Tom."]}]}};

const $=id=>document.getElementById(id);
function escapeHTML(str){return String(str).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function choiceText(q,i){return q[2][i]}
function correctText(q){return q[0]==='mc'?q[2][q[3]]:q[2].split('|')[0]}
function normalize(s){return String(s||'').trim().toLowerCase().replace(/[.?!,，。！？]/g,'').replace(/\s+/g,' ')}
function isCorrect(q,value){return q[0]==='mc'?Number(value)===q[3]:q[2].split('|').some(x=>normalize(x)===normalize(value))}
function answered(v){return v!==undefined&&String(v).trim()!==''}
function progress(){const n=Object.values(answers).filter(answered).length,total=DATA[unitIndex].qs.length;$('progress').style.width=(n/total*100)+'%';$('progressText').textContent=`已完成 ${n} / ${total} 題`}
function render(){const u=DATA[unitIndex];$('heroTitle').textContent=`第 ${unitIndex+1} 單元｜${u.title}`;$('quizInfo').textContent=`${u.title}｜共 ${u.qs.length} 題・每題 ${Math.round(100/u.qs.length*100)/100} 分（以正確題數計分）`;
$('notesBody').innerHTML=`<div class="subhead">核心單字</div><div class="chips">${u.words.map(x=>`<span class="tag"><b>${escapeHTML(x.split('｜')[0])}</b> ${escapeHTML(x.split('｜')[1])}</span>`).join('')}</div><div class="subhead">實用片語</div><div class="chips">${u.phrases.map(x=>`<span class="tag">${escapeHTML(x)}</span>`).join('')}</div><div class="subhead">對話句型</div><div class="rule">${escapeHTML(u.dialog)}</div><div class="subhead">文法重點</div><p>${escapeHTML(u.rule)}</p><ul class="examples"><li><b>例句：</b>${escapeHTML(u.example)}</li></ul><div class="mistake"><b>⚠️ 常見易錯盲點</b><div>${escapeHTML(u.pitfall)}</div></div>`;
const extra=DETAILED_NOTES[unitIndex];
if(extra){
 const body=$('notesBody');
 body.innerHTML+='<div class="subhead">📚 完整單元講義</div><p class="hint">'+escapeHTML(extra.source)+'</p>'+extra.sections.map(s=>'<details class="review-section" open><summary>'+escapeHTML(s.title)+'</summary><p>'+escapeHTML(s.intro)+'</p><div class="review-scroll"><table class="review-table"><thead><tr><th>重點</th><th>例句／用法</th><th>提醒</th></tr></thead><tbody>'+s.rows.map(r=>'<tr><th>'+escapeHTML(r[0])+'</th><td>'+escapeHTML(r[1])+'</td><td>'+escapeHTML(r[2])+'</td></tr>').join('')+'</tbody></table></div><div class="mistake"><b>⚠️ 常見易錯</b><ul>'+s.mistakes.map(m=>'<li>'+escapeHTML(m)+'</li>').join('')+'</ul></div></details>').join('');
}
$('questions').innerHTML=u.qs.map((q,i)=>{const type=q[0];const label={mc:'單選題',cl:'克漏字',fix:'文法改錯'}[type];let body=type==='mc'?`<div class="options">${q[2].map((x,k)=>`<button type="button" class="option ${answers[i]===k?'selected':''}" data-q="${i}" data-opt="${k}" aria-pressed="${answers[i]===k}">${'ABCD'[k]}. ${escapeHTML(x)}</button>`).join('')}</div>`:`<input class="write" data-q="${i}" type="text" maxlength="220" value="${escapeHTML(answers[i]||'')}" placeholder="${type==='fix'?'請輸入完整的正確句子':'請填入英文答案'}" aria-label="第 ${i+1} 題答案">`;return `<article class="question"><span class="qtype">第 ${i+1} 題 · ${label}</span><h3>${escapeHTML(q[1])}</h3>${body}</article>`}).join('');
$('questions').querySelectorAll('[data-opt]').forEach(b=>b.addEventListener('click',()=>{if(submitted)return;const i=Number(b.dataset.q);answers[i]=Number(b.dataset.opt);b.parentNode.querySelectorAll('button').forEach(y=>{y.classList.toggle('selected',y===b);y.setAttribute('aria-pressed',String(y===b))});progress()}));
$('questions').querySelectorAll('input[data-q]').forEach(inp=>inp.addEventListener('input',()=>{if(!submitted){answers[Number(inp.dataset.q)]=inp.value;progress()}}));$('report').classList.add('hidden');$('submit').disabled=false;$('submit').textContent='提交測驗並看成績';$('status').textContent='';progress()}
function changeUnit(i){unitIndex=i;answers={};submitted=false;sending=false;render();window.scrollTo({top:0,behavior:'smooth'})}
function statusJSONP(id,timeout=7000){return new Promise((resolve,reject)=>{const callback='gasCheck'+Math.random().toString(36).slice(2);const s=document.createElement('script');let finished=false;const timer=setTimeout(()=>finish(new Error('查詢逾時')),timeout);function finish(err,data){if(finished)return;finished=true;clearTimeout(timer);delete window[callback];s.remove();err?reject(err):resolve(data)}window[callback]=data=>finish(null,data);s.onerror=()=>finish(new Error('無法連線至 GAS'));s.src=GAS_WEB_APP_URL+'?action=status&id='+encodeURIComponent(id)+'&callback='+callback+'&_='+Date.now();document.head.appendChild(s)})}
async function verifySaved(id){for(let attempt=0;attempt<5;attempt++){try{const r=await statusJSONP(id);if(r&&r.saved)return true}catch(e){console.warn('確認同步狀態失敗',e)}if(attempt<4)await new Promise(r=>setTimeout(r,1100+attempt*400))}return false}
function showReport(correctCount,sync){const u=DATA[unitIndex],percent=Math.round(correctCount/u.qs.length*1000)/10;
const rows=u.qs.map((q,i)=>{const given=q[0]==='mc'?(answered(answers[i])?choiceText(q,answers[i]):'未作答'):answers[i];const ok=isCorrect(q,answers[i]);return `<div class="result-card ${ok?'':'wrong'}"><div class="feedback ${ok?'':'bad'}">第 ${i+1} 題｜${ok?'✓ 答對':'✕ 答錯'}</div><p><b>${escapeHTML(q[1])}</b></p><p>你的答案：${escapeHTML(given)}</p><p>正確答案：<b>${escapeHTML(correctText(q))}</b></p><p><b>詳細解析：</b>${escapeHTML(q[q.length-1])}</p></div>`}).join('');
$('reportBody').innerHTML=`<div class="grade">${percent}%</div><p>答對 ${correctCount} / ${u.qs.length} 題｜換算分數 ${percent} 分</p><p class="notice">${sync?'✅ 已確認寫入 Google Sheets':'⚠️ 未能確認雲端寫入，請勿關閉頁面，可聯絡老師確認紀錄。'}</p>${rows}`;
$('report').classList.remove('hidden');$('modalBody').innerHTML=`<div class="grade">${percent} 分</div><p>答對 ${correctCount} / ${u.qs.length} 題</p><p>${sync?'✅ 已寫入老師的 Google Sheets':'⚠️ 成績已算出，但目前無法確認 Google Sheets 收到資料。'}</p>`;$('resultModal').classList.remove('hidden');}
async function submitQuiz(){if(sending||submitted)return;const student=$('student').value.trim();if(!student){$('status').textContent='請先填寫學生姓名。';$('student').focus();return}const workDate=$('workDate').value;if(!/^\d{4}-\d{2}-\d{2}$/.test(workDate)){$('status').textContent='請先選擇填寫日期。';$('workDate').focus();return}if(DATA[unitIndex].qs.some((_,i)=>!answered(answers[i]))){$('status').textContent='還有未作答的題目，請全部完成。';$('questions').querySelector(`[data-q="${DATA[unitIndex].qs.findIndex((_,i)=>!answered(answers[i]))}"]`)?.focus();return}
if(!GAS_WEB_APP_URL.startsWith('https://script.google.com/macros/s/')){$('status').textContent='請先在 HTML 設定有效的 GAS /exec 網址。';return}
sending=true;$('submit').disabled=true;$('submit').textContent='提交中...';$('status').textContent='正在同步到 Google Sheets...';const unit=DATA[unitIndex];const id=typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():'sid-'+Date.now()+'-'+Math.random().toString(36).slice(2);
const records=unit.qs.map((q,i)=>{const given=q[0]==='mc'?choiceText(q,answers[i]):String(answers[i]).trim();return {number:i+1,type:q[0],question:q[1],given,correct:correctText(q),isCorrect:isCorrect(q,answers[i])}});const correctCount=records.filter(x=>x.isCorrect).length;
const payload={submissionId:id,timestamp:new Date().toISOString(),student,workDate,unit:`第${unitIndex+1}單元：${unit.title}`,score:correctCount,total:unit.qs.length,accuracy:Math.round(correctCount/unit.qs.length*1000)/10,wrongAnswers:records.filter(x=>!x.isCorrect),answers:records};
let sync=false;try{
/* Content-Type: text/plain 避免 CORS preflight；no-cors 的 response 不可讀取，不能據此推論成功。 */
await fetch(GAS_WEB_APP_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
sync=await verifySaved(id);
}catch(err){console.error(err)}finally{sending=false;submitted=true;$('submit').textContent='已交卷';$('status').textContent=sync?'已確認儲存！':'尚未確認同步，請老師檢查網址或權限。';showReport(correctCount,sync)}}
$('unitSelect').innerHTML=DATA.map((x,i)=>`<option value="${i}">單元 ${i+1}｜${escapeHTML(x.title)}</option>`).join('');$('unitSelect').addEventListener('change',e=>changeUnit(Number(e.target.value)));$('submit').addEventListener('click',submitQuiz);$('closeModal').addEventListener('click',()=>{$('resultModal').classList.add('hidden');$('report').scrollIntoView({behavior:'smooth',block:'start'})});$('retry').addEventListener('click',()=>{answers={};submitted=false;render();$('quiz').scrollIntoView({behavior:'smooth'})});$('workDate').value=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);render();
</script>
</body></html>
