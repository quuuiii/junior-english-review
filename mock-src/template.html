<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>會考英語模擬試題 16 回｜English Orbit</title>
<style>:root{--blue:#286ec0;--ink:#1d3650;--line:#dbe7f1}*{box-sizing:border-box}body{margin:0;background:#f4f8fd;font:16px/1.6 system-ui,"Noto Sans TC",sans-serif;color:var(--ink)}a{color:var(--blue)}header{background:#fff;position:sticky;top:0;z-index:3;border-bottom:1px solid var(--line);padding:13px max(16px,calc((100vw - 1050px)/2))}main{max-width:1050px;margin:auto;padding:22px 16px 80px}h1{margin:8px 0}h2{margin:0 0 10px}p{color:#5b7289}.hero,.panel{background:#fff;border-radius:18px;padding:20px;border:1px solid var(--line);margin-bottom:18px}.hero{background:linear-gradient(120deg,#e4f4ff,#eaf9f3)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:12px}.exam{display:flex;flex-direction:column;justify-content:flex-start;border:1px solid #d9e6f0;padding:16px;border-radius:14px;cursor:pointer;background:#fff;text-align:left;font:inherit;color:inherit}.exam:hover{border-color:#2c8bca;background:#f0f8ff}.exam strong{display:block;font-size:1.07rem}.exam span{display:block;color:#657b90;font-size:.85rem;margin-top:4px}.exam em{font-style:normal;font-size:.78rem;color:#147c72;background:#e3f5f0;border-radius:8px;padding:1px 8px}.sect{margin:20px 0 8px;font-size:1.05rem;color:#246b9d}button{cursor:pointer;font:inherit}.btn{background:#327bd0;border:0;border-radius:10px;color:#fff;padding:10px 16px;font-weight:700}.btn.secondary{background:#e8f2fb;color:#246b9d}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.pill{background:#e3f5f0;border-radius:10px;padding:5px 11px;color:#147c72;font-weight:700}.muted{color:#62768c;font-size:.9rem}.hidden{display:none!important}.bar{background:#e4eef7;height:9px;border-radius:9px;overflow:hidden;margin-top:12px}.fill{height:100%;background:#169b8b;width:0}#timer{font-weight:800;font-variant-numeric:tabular-nums;font-size:1.3rem}.part{margin:26px 0 8px;padding:8px 12px;border-radius:8px;background:#e8f0fa;font-weight:700}.grp{margin:18px 0;padding:14px;border:1px solid var(--line);border-radius:12px;background:#fff}.grp h3{margin:0 0 8px;font-size:1rem;color:#4b6378}.passage{background:#f6f9fc;border-radius:10px;padding:12px 14px;white-space:pre-line;margin-bottom:6px;font-family:Georgia,"Times New Roman",serif;line-height:1.7}.q{padding:14px 0;border-bottom:1px solid #e3ecf4;scroll-margin-top:80px}.q:last-child{border-bottom:0}.q .stem{margin:0 0 8px;color:var(--ink);font-weight:600}.q .no{color:#2876a7;margin-right:6px}.opts{display:grid;gap:6px}.opt{display:flex;gap:8px;text-align:left;border:1px solid #cad8e5;background:#fff;border-radius:10px;padding:8px 12px;color:var(--ink);width:100%}.opt b{min-width:1.4em;color:#2876a7}.opt.chosen{border-color:#168e86;background:#e6f6f3}.opt.ok{border-color:#2a9d5c;background:#e4f7ea}.opt.bad{border-color:#d1493f;background:#fdeceb}.opt:disabled{cursor:default}.expl{margin-top:8px;padding:8px 12px;border-radius:8px;background:#fff9eb;font-size:.92rem;color:#5a4a1d}.blank{display:inline-block;min-width:2.6em;text-align:center;border-bottom:2px solid #2876a7;font-weight:700;color:#2876a7;font-family:system-ui}.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}.sc{border:1px solid var(--line);border-radius:8px;background:#fff;padding:6px 2px;text-align:center;font-size:.85rem;color:var(--ink)}.sc.done{background:#e6f6f3;border-color:#168e86}.sc.ok{background:#e4f7ea;border-color:#2a9d5c}.sc.bad{background:#fdeceb;border-color:#d1493f}.result{background:linear-gradient(120deg,#f1f8ff,#eefaf3);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}.result .big{font-size:2rem;font-weight:800;color:#168e86}.notice{background:#fff9eb;padding:12px;border-radius:10px;margin:12px 0;font-size:.9rem;color:#5a4a1d}@media(max-width:620px){.panel,.hero{padding:14px}.grp{padding:8px;margin-left:-6px;margin-right:-6px}}.sitenav{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap}.sitenav .logo{font-weight:850;color:#286ec0;text-decoration:none;margin-right:6px}.sitenav .logo span{color:#16a79e}.sitenav .links{display:flex;gap:6px;flex-wrap:wrap}.sitenav .links a{font-weight:750;color:#1b7c83;text-decoration:none;white-space:nowrap;padding:4px 12px;border-radius:20px}.sitenav .links a:hover{background:#f0f7ff}.sitenav .links a.active{background:#e1f2ff;color:#1d5fa6}</style></head><body>
<header><nav class="sitenav" aria-label="主導覽"><a class="logo" href="index.html">✦ English <span>Orbit</span></a><div class="links"><a href="index.html">📖 單元複習</a><a href="past-exams.html">📝 歷屆會考 5 回</a><a href="mock-exams.html" class="active" aria-current="page">📘 模擬試題 16 回</a></div></nav></header><main>
<div id="choose"><div class="hero"><h1>📝 會考英語模擬試題｜共 16 回</h1><p>參照《會考 3800+ 應用題彙編》的回數與編排：分冊複習 10 回、會考模擬 6 回。每回 43 題（單題 19 題＋題組 24 題），題目全部為原創，並附答案與中文解析。聽力題因需音檔，本頁未收錄。</p></div><div id="cards"></div><p class="muted">答案儲存在此裝置的瀏覽器，不會上傳。成績僅供自我檢視。</p></div>
<section id="workspace" class="hidden">
<div class="panel"><div class="row" style="justify-content:space-between"><h2 id="title"></h2><button class="btn secondary" id="back">← 換一回</button></div><p class="muted" id="scope"></p><div class="row"><span class="pill" id="count">0 / 43 題</span><span id="timer">60:00</span><button id="clockBtn" class="btn secondary">開始計時</button><button id="resetBtn" class="btn secondary">重新練習本回</button><select id="jump" aria-label="跳至題目"></select></div><div class="bar"><div class="fill" id="fill"></div></div></div>
<div class="panel"><div id="paper"></div></div>
<div class="panel"><h2>✏️ 答案卡</h2><div id="sheet" class="sheet"></div><div class="row" style="margin-top:16px"><button class="btn secondary" id="missing">跳至第一題未作答</button><button class="btn" id="finish">交卷並對答案</button><label class="muted hidden" id="wrongWrap"><input type="checkbox" id="onlyWrong"> 只看答錯的題目</label></div><div id="result" class="hidden"></div></div>
</section></main>
<script>
const DATA=__DATA__;
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=t=>esc(t).replace(/__(\d+)__/g,'<span class="blank">$1</span>');
const KEY=n=>'mock-exam-v1-'+n;
let cur=null,state=null,clock=null;
function allQs(s){const a=s.singles.map(q=>({...q}));s.groups.forEach(g=>g.qs.forEach(q=>a.push({...q})));return a.sort((x,y)=>x.n-y.n)}
function load(n){try{return JSON.parse(localStorage.getItem(KEY(n)))||null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY(cur.n),JSON.stringify(state))}catch(e){}}
function cards(){const box=$('#cards');box.innerHTML='';[['分冊複習（回 1～10）',s=>s.n<=10],['會考模擬（回 11～16）',s=>s.n>10]].forEach(([h,f])=>{const t=document.createElement('h2');t.className='sect';t.textContent=h;box.appendChild(t);const g=document.createElement('div');g.className='grid';DATA.filter(f).forEach(s=>{const st=load(s.n);const done=st?Object.keys(st.ans||{}).length:0;const b=document.createElement('button');b.className='exam';b.innerHTML='<strong>第 '+s.n+' 回</strong><em>'+esc(s.kind)+'</em><span>'+esc(s.scope.length>34?s.scope.slice(0,34)+'…':s.scope)+'</span>'+(st&&st.done?'<span>✅ 已交卷：'+st.score+' / 43</span>':done?'<span>作答中：'+done+' / 43</span>':'');b.onclick=()=>open(s.n);g.appendChild(b)});box.appendChild(g)})}
function open(n){cur=DATA.find(s=>s.n===n);state=load(n)||{ans:{},elapsed:0,done:false};state.ans=state.ans||{};$('#choose').classList.add('hidden');$('#workspace').classList.remove('hidden');$('#title').textContent='第 '+n+' 回｜'+cur.kind;$('#scope').textContent='範圍：'+cur.scope;render();stopClock();tick();window.scrollTo(0,0)}
function render(){const qs=allQs(cur),paper=$('#paper');let h='<div class="part">一、單題（1～19 題）</div>';cur.singles.forEach(q=>h+=qHtml(q));h+='<div class="part">二、題組（20～43 題）</div>';cur.groups.forEach(g=>{h+='<div class="grp"><h3>第 '+g.from+(g.to>g.from?'～'+g.to:'')+' 題｜'+esc(g.type)+'：'+esc(g.title)+'</h3><div class="passage">'+fmt(g.text)+'</div>';g.qs.forEach(q=>h+=qHtml(q));h+='</div>'});paper.innerHTML=h;$('#sheet').innerHTML=qs.map(q=>'<button class="sc" data-n="'+q.n+'" id="sc'+q.n+'">'+q.n+'<br><span>-</span></button>').join('');$('#jump').innerHTML='<option value="">跳至題號</option>'+qs.map(q=>'<option value="'+q.n+'">第 '+q.n+' 題</option>').join('');paper.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n,b.dataset.l));$('#sheet').querySelectorAll('.sc').forEach(b=>b.onclick=()=>go(+b.dataset.n));refresh()}
function qHtml(q){const L='ABCD';const stem=q.q?'<p class="stem"><span class="no">'+q.n+'.</span>'+fmt(q.q)+'</p>':'<p class="stem"><span class="no">'+q.n+'.</span>請選出最適合第 <span class="blank">'+q.n+'</span> 格的答案。</p>';return '<div class="q" id="q'+q.n+'">'+stem+'<div class="opts">'+q.o.map((o,i)=>'<button class="opt" data-n="'+q.n+'" data-l="'+L[i]+'"><b>('+L[i]+')</b><span>'+esc(o)+'</span></button>').join('')+'</div><div class="expl hidden" id="ex'+q.n+'"></div></div>'}
function choose(n,l){if(state.done)return;if(state.ans[n]===l)delete state.ans[n];else state.ans[n]=l;save();refresh()}
function refresh(){const qs=allQs(cur),L='ABCD';let c=0;qs.forEach(q=>{const a=state.ans[q.n];if(a)c++;const el=$('#q'+q.n);el.querySelectorAll('.opt').forEach(b=>{const l=b.dataset.l;b.className='opt';b.disabled=!!state.done;if(state.done){if(l===q.a)b.classList.add('ok');else if(l===a)b.classList.add('bad')}else if(l===a)b.classList.add('chosen')});const ex=$('#ex'+q.n);if(state.done){ex.classList.remove('hidden');ex.innerHTML='<b>'+(a===q.a?'✅ 答對':'❌ 你的答案：'+(a||'未作答')+'｜正確答案：'+q.a)+'</b><br>'+esc(q.e)}else ex.classList.add('hidden');const sc=$('#sc'+q.n);sc.className='sc'+(state.done?(a===q.a?' ok':' bad'):(a?' done':''));sc.lastChild.textContent=a||'-'});$('#count').textContent=c+' / 43 題';$('#fill').style.width=(c/43*100)+'%';$('#wrongWrap').classList.toggle('hidden',!state.done);if(state.done)showResult()}
function go(n){const e=$('#q'+n);if(e)e.scrollIntoView({behavior:'smooth',block:'center'})}
function showResult(){const qs=allQs(cur);const ok=qs.filter(q=>state.ans[q.n]===q.a).length;const no=qs.filter(q=>!state.ans[q.n]).length;state.score=ok;save();const r=$('#result');r.classList.remove('hidden');r.innerHTML='<div class="result"><div class="big">'+ok+' / 43</div><div>答對 '+ok+' 題・答錯 '+(43-ok-no)+' 題・未作答 '+no+' 題・用時 '+fmtT(state.elapsed)+'</div><div class="muted">單題 '+qs.filter(q=>q.n<=19&&state.ans[q.n]===q.a).length+' / 19・題組 '+qs.filter(q=>q.n>19&&state.ans[q.n]===q.a).length+' / 24。各題解析已顯示於題目下方。</div></div>'}
function fmtT(s){s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function tick(){const left=Math.max(0,3600-state.elapsed);$('#timer').textContent=fmtT(left)}
function startClock(){if(clock||state.done)return;let t0=Date.now()-state.elapsed*1000;clock=setInterval(()=>{state.elapsed=(Date.now()-t0)/1000;tick();if(state.elapsed%10<1)save()},500);$('#clockBtn').textContent='暫停計時'}
function stopClock(){if(clock){clearInterval(clock);clock=null;save()}$('#clockBtn').textContent='開始計時'}
$('#clockBtn').onclick=()=>clock?stopClock():startClock();
$('#finish').onclick=()=>{const un=allQs(cur).filter(q=>!state.ans[q.n]).length;if(state.done)return;if(un&&!confirm('還有 '+un+' 題未作答，確定交卷？'))return;stopClock();state.done=true;save();refresh();$('#result').scrollIntoView({behavior:'smooth'})};
$('#missing').onclick=()=>{const q=allQs(cur).find(q=>!state.ans[q.n]);if(q)go(q.n);else alert('全部題目都已作答！')};
$('#resetBtn').onclick=()=>{if(!confirm('清除本回所有作答並重新開始？'))return;stopClock();state={ans:{},elapsed:0,done:false};save();$('#result').classList.add('hidden');$('#onlyWrong').checked=false;filterWrong();render();tick()};
$('#jump').onchange=e=>{if(e.target.value)go(+e.target.value);e.target.value=''};
function filterWrong(){const on=$('#onlyWrong').checked;allQs(cur).forEach(q=>{$('#q'+q.n).classList.toggle('hidden',on&&state.ans[q.n]===q.a)})}
$('#onlyWrong').onchange=filterWrong;
$('#back').onclick=()=>{stopClock();$('#workspace').classList.add('hidden');$('#choose').classList.remove('hidden');cards();window.scrollTo(0,0)};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&clock)save()});
cards();
</script></body></html>
