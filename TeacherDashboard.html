<!doctype html>
<html lang="zh-Hant"><head><base target="_top"><meta charset="utf-8">
<style>
*{box-sizing:border-box}body{font:14px system-ui,"Noto Sans TC",sans-serif;margin:0;padding:16px;color:#18304b;background:#f5f9fc}h2{font-size:19px;margin:0 0 8px}p{color:#597086}.toolbar{display:grid;gap:9px;margin:15px 0}input,select,button{font:inherit;border-radius:9px;padding:10px;border:1px solid #cbdde9;background:white;width:100%}button{background:#2879b5;color:white;border:0;cursor:pointer;font-weight:700}.card{padding:14px;margin:10px 0;border:1px solid #dce8f1;border-radius:13px;background:#fff}.summary{display:grid;grid-template-columns:1fr 1fr;gap:8px}.summary strong{font-size:19px;display:block;color:#167e77}.tiny{font-size:12px;color:#687c8d}details{border-top:1px solid #e3ebf2;margin-top:10px;padding-top:10px}summary{cursor:pointer;color:#246994;font-weight:700}.wrong{background:#fff7f4;padding:8px;border-radius:8px;margin:7px 0;overflow-wrap:anywhere}.error{color:#ad3851}.pill{display:inline-block;background:#e6f5f0;color:#117d69;padding:2px 7px;border-radius:6px;font-size:12px}#records{max-height:65vh;overflow:auto}label{font-size:12px;color:#52708b}
</style></head><body>
<h2>📚 老師成績管理</h2>
<p>只在有權限的 Google 試算表側邊欄查看，不對學生網站公開成績。</p>
<button id="refresh">↻ 重新讀取成績</button>
<div id="message" aria-live="polite" class="tiny">載入中…</div>
<div class="toolbar"><label>學生姓名<input id="search" placeholder="輸入姓名搜尋"></label><label>測驗單元<select id="unit"><option value="">全部單元</option></select></label><label>填寫日期<input id="date" type="date"></label></div>
<div class="summary"><div class="card">符合筆數<strong id="count">0</strong></div><div class="card">平均分數<strong id="average">—</strong></div></div>
<div id="records"></div>
<script>
let all=[];
const $=id=>document.getElementById(id);
function node(tag,text,klass){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(klass)e.className=klass;return e}
function load(){
 $('message').textContent='讀取試算表中…';
 google.script.run.withSuccessHandler(rows=>{all=Array.isArray(rows)?rows:[];const old=$('unit').value;$('unit').replaceChildren(new Option('全部單元',''));[...new Set(all.map(r=>r.unit).filter(Boolean))].sort((a,b)=>{const aa=Number((a.match(/第(\d+)/)||[])[1]||999),bb=Number((b.match(/第(\d+)/)||[])[1]||999);return aa-bb}).forEach(u=>$('unit').add(new Option(u,u)));$('unit').value=old;draw();$('message').textContent='讀取完成 '+new Date().toLocaleTimeString('zh-TW')}).withFailureHandler(err=>{$('message').textContent='讀取失敗：'+String(err.message||err);$('message').className='error'}).getTeacherResults();
}
function draw(){
 const name=$('search').value.trim().toLowerCase(),unit=$('unit').value,date=$('date').value;
 const rows=all.filter(r=>(!name||r.student.toLowerCase().includes(name))&&(!unit||r.unit===unit)&&(!date||r.workDate===date));
 $('count').textContent=String(rows.length);$('average').textContent=rows.length?(rows.reduce((s,r)=>s+r.accuracy,0)/rows.length).toFixed(1)+' 分':'—';
 $('records').replaceChildren();
 if(!rows.length){$('records').append(node('p','沒有符合條件的成績紀錄。'));return}
 rows.forEach(r=>{
 const c=node('article',undefined,'card'),nameLine=node('strong',r.student||'未填姓名');
 c.append(nameLine,node('div',r.unit,'tiny'),node('div','填寫日期：'+(r.workDate||'未填')+'｜提交：'+r.submittedAt,'tiny'),node('div',r.score+' / '+r.total+' 題　'+r.accuracy+' 分','pill'));
 const detail=document.createElement('details'),sum=document.createElement('summary');sum.textContent='查看錯題（'+(r.wrong.length|| (r.wrongSummary?'有紀錄':'0'))+'）';detail.append(sum);
 if(r.wrong.length){r.wrong.forEach(w=>detail.append(node('div','第 '+w.number+' 題：'+w.question+'\n作答：'+w.given+'\n正解：'+w.correct,'wrong')))}
 else detail.append(node('p',r.wrongSummary||'沒有錯題紀錄。'));
 c.append(detail);$('records').append(c);
 });
}
$('refresh').addEventListener('click',load);['search','date'].forEach(id=>$(id).addEventListener('input',draw));$('unit').addEventListener('change',draw);load();
</script></body></html>
